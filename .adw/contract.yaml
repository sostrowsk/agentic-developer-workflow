# Interface contract — R1: Der Orchestrator schreibt und löscht nur, was ihm gehört
#
# Single-Lane-Projekt (nur `backend`, siehe .adw/config.yaml). Gemäß Spec
# („Contract (Single-Lane)“) pinnt dieser Contract ausschließlich drei extern
# beobachtbare Flächen:
#   1. CLI-Verhalten von `adw run|resume|approve` bei belegtem Repo-Lock,
#   2. die Lock-Datei `.adw/runs/.repo.lock`,
#   3. das neue State-Feld `pushed_shas` in state.json.
#
# NICHT Teil des Contracts: interne Helfer und ihre Signaturen (Artefakt-Helfer,
# Repo-Lock-Kontextmanager, Preflight-Schalter, _push_branch, _run_worktrees).
# Seeding, Push-Lease, Resume-Schutz und trees-Grenze sind durch .adw/spec.md
# (A1–A4, AC 1–9) verbindlich, aber keine Vertragsfläche. Keine HTTP-Routen,
# keine neuen Events.

workstreams:
  - backend

cli:
  commands: [adw run, adw resume, adw approve]
  repo_lock_busy:
    condition: >-
      `.adw/runs/.repo.lock` ist von einem anderen Prozess bzw. Handle per flock
      exklusiv gehalten.
    exit_code: 1
    message_semantics: Nennt, dass in diesem Repo bereits ein ADW-Kommando läuft.
    side_effects:
      preflight_executed: false
      self_healing_executed: false
      run_directory_created: false
      state_created_or_modified: false
      main_checkout_artifacts_modified: false
      escalation_created: false

lock_file:
  path: .adw/runs/.repo.lock
  scope: repository
  mechanism: flock, LOCK_EX | LOCK_NB (nicht blockierend)
  acquired_before: [preflight, per_run_lock]
  held_until: Ende des Kommandos (einschließlich Auto-Prune); auf jedem Ausstiegspfad freigegeben
  deleted: never (auch nicht durch Retention/Prune)

state:
  path: .adw/runs/<run_id>/state.json
  added_fields:
    pushed_shas:
      type: object
      keys: Branch-Name (refs/heads/<branch> ohne Präfix)
      additionalProperties:
        type: string
        description: SHA des zuletzt erfolgreich gepushten Commits dieses Branches.
      default: {}
  compatibility:
    missing_pushed_shas_loads_as: {}
  persistence: >-
    Nach erfolgreichem Push wird der SHA für den Branch zusammen mit dem übrigen
    Fortschritt nach dem Push über den bestehenden State-Speicherpfad persistiert.
    Dasselbe gilt, wenn nach einer Lease-Ablehnung bestätigt wurde, dass der
    Remote-Branch bereits auf dem lokalen HEAD steht (Crash-Fenster, E4).
    Dry-Run pusht nicht und schreibt das Feld nicht.

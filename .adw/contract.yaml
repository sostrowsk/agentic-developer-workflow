# Interface contract — GUI-Redesign 3: Das Arbeitsfeld zuerst
#
# Single-Lane-Projekt (nur `backend`, siehe .adw/config.yaml). Dieser Brief ist
# REIN DARSTELLEND. Der Contract pinnt darum genau zwei Dinge:
#
#   1. die UNVERÄNDERLICHKEIT der beiden JSON-Routen `/api/runs` und
#      `/api/runs/{repo}/{run_id}` in allen Feldern, Typen und Werten — es
#      entstehen keine neuen Routen und keine neuen Query-Parameter; und
#   2. das extern beobachtbare TEMPLATE-Verhalten der bestehenden HTML-Route
#      `GET /runs/{repo}/{run_id}`: das rein serverseitige Auf-/Zuklappen der
#      zwei Zusammenfassungen ohne JavaScript, die dauerunabhängig lesbare
#      Timeline-Balkenbeschriftung bei unveränderter Balkengeometrie und die
#      vollständige, ungefensterte Baum-Spalte (ein `data-tree-entry` je
#      Knoten; die 200er-Schranke gilt nur für `data-tool-entry`).
#
# NICHT Teil des Contracts (frei änderbar, Gestaltungsspielraum): Klassennamen,
# Reihenfolge der Blöcke im Markup, Markup- und CSS-Wortlaut, Grid-Verhältnisse,
# interne Helfer-Signaturen. Die Kennzahlen-, Zeitgrößen- und Listen-Fläche aus
# Brief 2 bleibt in Kraft und wird hier NICHT revidiert.
openapi: 3.0.3
info:
  title: ADW GUI — Das Arbeitsfeld zuerst (rein darstellend)
  version: 3.0.0
  description: >-
    Minimaler Contract für den einzigen Workstream backend, Basis ist der
    gemergte Stand 0.23.0. Er fixiert, dass dieses Feature die JSON-API NICHT
    verändert (Regression über alle Felder, Typen und Werte) und pinnt das
    bindende Darstellungs-Verhalten der Run-Detail-Seite. Die Schemas
    beschreiben nur die vorhandenen äußeren Antwortformen; die vollständige
    Bestandsgleichheit ist zusätzlich verbindlich. Die Version bezeichnet
    dieses Vertragsdokument, keine Paket- oder API-Version.

paths:
  /api/runs:
    get:
      summary: Run-Liste — durch dieses Feature unverändert.
      description: >-
        Bei identischen Eingaben und identischem Auswertungszeitpunkt bleiben
        sämtliche Einträge, ihre Reihenfolge, Felder, Typen und Werte gegenüber
        dem Stand 0.23.0 unverändert (RunSummary bzw. RepoPlaceholder je
        Eintrag). Keine neuen Felder, keine neuen Query-Parameter. Ein
        Regressionstest fixiert die Unveränderlichkeit (AC 12).
      responses:
        "200":
          description: Bestehende Run-Listen-Antwort, unverändert.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/runs/{repo}/{run_id}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Run-Detail — durch dieses Feature unverändert.
      description: >-
        Bei identischen Eingaben und identischem Auswertungszeitpunkt bleiben
        alle Felder, Typen und Werte unverändert — einschließlich `run`,
        `tree`, `phases`, `raw`, `latest_context`, `problems`, `change_scope`,
        optionalem `plan_skeleton`/`recovery` und der Kennzahlen aus Brief 2.
        Auch die Bedingungen für vorhandene, fehlende und nullwertige Felder
        bleiben unverändert. Es kommen KEINE neuen Summary- oder
        Timeline-Darstellungsdaten (A2/A4) in diese JSON-Antwort hinzu.
        Keine neue Route, kein neuer Query-Parameter. Ein Regressionstest
        fixiert die Unveränderlichkeit (AC 12).
      responses:
        "200":
          description: Bestehende Run-Detail-Antwort, unverändert.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /runs/{repo}/{run_id}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Run-Detail-Seite — bestehende HTML-Route, neues Template-Verhalten.
      description: >-
        Bestehende HTML-Route mit unveränderten Query-Parametern (`limit`,
        `tools_offset`, `focus`, Raw-Filter; `offset` bleibt akzeptiert und für
        den Baum inert) und bestehender Navigation. Das geänderte beobachtbare
        Template-Verhalten ist unter x-adw-template-behavior beschrieben.
      responses:
        "200":
          description: Serverseitig gerenderte Run-Detail-Seite.
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    Repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string

x-adw-workstreams: [backend]

x-adw-invariants:
  - >-
    Rein darstellend: Die JSON-Routen `/api/runs` und
    `/api/runs/{repo}/{run_id}` bleiben in allen Feldern, Typen und Werten
    unverändert. Keine neue Route, kein neues Tab, kein neuer Query-Parameter,
    keine neuen Ereignistypen. Die JSON-Antworten enthalten keine neuen
    Summary- oder Timeline-Darstellungsdaten.
  - >-
    Keine Änderung an Ereignistypen, Instrumentierung, Event-Payloads,
    `build_tree`, dem SSE-Pfad oder der Retention (E8). Die Verdichtung des
    Baums (Faltung, Wiederholungen, Gruppen, drei Klappebenen,
    Standard-Faltung, `?focus`) bleibt unangetastet (E3). Auswahl,
    Pane-Verhalten, Deep-Links, Artefakte-/Raw-Tabs und Recovery-Karten
    behalten ihr bestehendes Verhalten.
  - >-
    Die Baum-Spalte rendert VOLLSTÄNDIG: je Knoten des serialisierten Baums
    genau ein `data-tree-entry`, keine Dopplung, keine Knotenobergrenze, kein
    Fenster, kein Lazy-Rendering; `?offset` ist für die Baum-Spalte inert und
    es wird keine Blätter-Navigation für sie gerendert (E2). Ein an seinen
    Aufruf gefaltetes Ergebnis behält seinen eigenen Marker;
    Verdichtungswrapper erzeugen keinen zusätzlichen.
  - >-
    Das Tools-Fenster der Detail-Panes (`?tools_offset`, `data-tool-entry`) und
    seine 200er-Schranke samt Blätter-Navigation bleiben unverändert; diese
    Schranke gilt ausschließlich für `data-tool-entry`, nicht für
    `data-tree-entry` (E6).
  - >-
    Keine neue Laufzeit-Dependency, kein Frontend-Paket, kein CDN, keine
    Webfont (E1). Keine neuen Farben, Schriftgrößen oder Abstandswerte; die
    Gestaltung aus Brief 1 wird benutzt (E4). Kein Responsive-Umbau, keine
    Breakpoints, keine Mobilansicht (E7). Run-Liste, Kennzahlen und Vokabular
    aus Brief 2 sowie die Zeitachse aus Brief 1 bleiben unverändert (E5).

x-adw-template-behavior:
  route: /runs/{repo}/{run_id}
  order: >-
    Im gerenderten Dokument beginnt das Arbeitsfeld (Trace-Baum │ Detail-Panes
    │ Run-Kontext) unmittelbar unter dem Seitenkopf; „Planned tasks" und
    „Change scope" stehen dahinter. Zwischen Seitenkopf und Arbeitsfeld steht
    keiner der beiden Blöcke. Kein weiterer Bereich wird umgeordnet.
  summaries:
    interaction:
      - Jeder der beiden Zusammenfassungsblöcke ist ein natives `<details>`.
      - Jeder Block enthält eine `<summary>` und hat initial kein `open`-Attribut.
      - Der Blockinhalt ist initial verborgen und beim Öffnen unverändert zugänglich.
      - Kein JavaScript, kein Client-Zustand, keine Persistenz, kein Query-Parameter dafür.
      - Ein Klick auf die Zusammenfassungszeile ist die einzige Bedienung.
    planned_tasks:
      presence: >-
        Ohne Plan-Skelett wird der gesamte Block GAR NICHT gerendert — kein
        leerer aufklappbarer Block.
      summary: >-
        Die `<summary>` nennt je Lane deren Namen, die Zahl der Aufgaben und
        den bestehenden Lane-Zustand — ohne Aufklappen ablesbar; der Zustand
        wird nicht neu hergeleitet.
      expanded: Die bisherigen Aufgaben je Lane bleiben zugänglich.
    change_scope:
      presence: Der Block bleibt auch ohne verwertbaren Diff sichtbar.
      summary: >-
        Die `<summary>` nennt die Zahl der geänderten Dateien über alle
        beobachteten Lanes sowie die Summen der Plus- und Minuszeilen.
        Binärdateien zählen bei der Dateizahl mit, tragen aber nichts zu den
        Zeilensummen bei.
      unavailable: >-
        Ohne verwertbaren Diff erscheint eine erklärende Zeile statt einer
        Null.
      empty: >-
        Ein verwertbarer Diff ohne geänderte Dateien zeigt Dateizahl 0 mit
        Nullsummen und bleibt vom fehlenden Diff unterscheidbar.
      expanded: >-
        Die bisherigen Lane-Inhalte einschließlich Dateiangaben und
        deklariertem Scope bleiben zugänglich.
  timeline:
    labels: >-
      Die Beschriftung eines Balkens verlässt den proportional bemessenen
      Balken; ihr Wortlaut bleibt gegenüber heute unverändert und ihre
      Lesbarkeit hängt NICHT mehr von der Balkenbreite ab. In einer Spur mit vielen
      kurzen Balken überlagern sich die Namen nicht, und die Zuordnung
      Name↔Balken bleibt erkennbar. Ohne JavaScript. Das `title`-Attribut
      allein erfüllt die Lesbarkeitsanforderung nicht.
    geometry: >-
      Der Balken ist reine Geometrie. `left` und `width` in Prozent bleiben
      bei identischen Eingangsdaten unverändert.
    preserved: >-
      Das `title`-Attribut, die Spurbeschriftung links (`.tl-lane-label`,
      feste 7 rem) und die Unterscheidung aktiv / wartend / noch laufend
      bleiben erhalten.
  tree:
    rendering: >-
      Die Baum-Spalte rendert den vollständigen serialisierten Baum ohne
      Fenster, Blätterung, Lazy-Rendering oder Knotenobergrenze. Lesbarkeit
      entsteht durch die bestehende, unveränderte Verdichtung.
    counting: >-
      Jeder serialisierte Knoten besitzt genau einen `data-tree-entry`-Marker
      in der Baum-Spalte. Ein an seinen Aufruf gefaltetes Ergebnis behält
      seinen eigenen Marker; Verdichtungswrapper erzeugen keine zusätzlichen.
    offset: Der bestehende `?offset`-Parameter verändert die Baum-Spalte nicht.
    navigation: Für die Baum-Spalte wird keine Blätter-Navigation gerendert.
  tools:
    preserved: >-
      `?tools_offset`, das bestehende Tools-Fenster und seine
      Blätter-Navigation bleiben unverändert. Die Schranke von höchstens 200
      Markern gilt nur für `data-tool-entry`, niemals für `data-tree-entry`.
  localization:
    - Alle neuen Beschriftungen liegen in `adw/gui/i18n.py` in Deutsch und Englisch vor.
    - Die Sprachkataloge haben identische Schlüsselmengen.
    - Aufgaben- und Dateizahlen verwenden korrekte Pluralformen für null, eins und mehrere.
    - Lane-Namen, Dateipfade und Balkennamen sind Inhalte und werden nicht übersetzt.

x-adw-contract-boundary:
  excluded:
    - Interne Helfer, Signaturen und Darstellungsdatentypen.
    - Klassennamen.
    - Reihenfolge der Blöcke im Markup.
    - Markup- und CSS-Wortlaut.
    - Grid-Verhältnisse.
  note: >-
    Die ausgeschlossenen Gestaltungsdetails werden nicht als Schnittstelle
    festgeschrieben. Die Anforderungen an Blockreihenfolge, Spaltenbreiten,
    Umbruchquote und Browserabnahme aus Spec und Plan bleiben verbindlich.

# Interface contract — Single-Lane project (`backend`).
#
# This contract pins only the externally observable additions: the boolean
# `dry_run` field in the two existing run responses, its visible behavior on the
# two existing HTML surfaces, and the run-list status ordering. It does not pin
# internal helper signatures, concrete markup, CSS selectors, event schemas, or
# unchanged response fields. No route or event is added or removed.

openapi: 3.1.0
info:
  title: ADW Run Inspector — dry-run identification & status ordering
  version: 1.0.0

paths:
  /api/runs:
    get:
      summary: List runs across all registered repositories.
      responses:
        "200":
          description: >
            Existing array of run summaries, now including `dry_run` on every
            run record and ordered according to R4.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"

  /api/runs/{repo}/{run_id}:
    get:
      summary: Return the existing run-detail representation.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing run-detail object whose nested run summary now includes
            `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"

  /:
    get:
      summary: Existing HTML run list.
      responses:
        "200":
          description: >
            Existing server-rendered run-list page. Pinned additions: the
            dry-run row marking per R2 and the status ordering per R4.
            Templates, selectors, and markup are not prescribed.
          content:
            text/html: {}

  /runs/{repo}/{run_id}:
    get:
      summary: Existing HTML run detail.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing server-rendered run-detail page. Pinned addition: the
            viewport-persistent dry-run marking in the header per R3.
            Templates, selectors, and markup are not prescribed.
          content:
            text/html: {}

components:
  schemas:
    RunSummary:
      type: object
      description: >
        Existing run-summary object. This contract adds and pins only `dry_run`;
        all pre-existing properties retain their current shape and meaning.
      required:
        - dry_run
      properties:
        dry_run:
          type: boolean
          default: false
          description: >
            True exactly when the start payload of the `run` span contains
            `dry_run: true`; false for explicit false, a missing field, or a
            missing `run` span.

    RunDetail:
      type: object
      description: >
        Existing run-detail object. Only the nested run summary's `dry_run`
        addition is pinned here.
      required:
        - run
      properties:
        run:
          $ref: "#/components/schemas/RunSummary"

x-behavior:
  R1_dry_run_derivation:
    applies_to:
      - RunSummary.dry_run
      - RunDetail.run.dry_run
    rule: >
      `dry_run` is derived exclusively from the start payload of the `run`
      span. A payload value of true yields true. An explicit false, an absent
      field, or a completely absent `run` span yields false and never an error.
      Missing `usage`, token, totals, or other content data has no effect on
      this value. No heuristic, new persisted state, instrumentation change, or
      event-schema change participates in the derivation.
    cross_endpoint: >
      For the same event-log content, GET /api/runs and
      GET /api/runs/{repo}/{run_id} expose the same boolean value in their
      respective existing run record.

  R2_run_list_presentation:
    surface: "GET / (HTML run list)"
    rule: >
      Every rendered run row whose run record has `dry_run: true` displays a
      clearly visible, short Dry-Run label associated with that row. A row with
      `dry_run: false` displays no Dry-Run designation. The label comes from the
      existing English/German i18n catalog and follows the selected language.
      Its visibility does not depend on `usage`, token, or other content data.
      The designation does not alter status, retention, selection behavior, or
      table semantics. Concrete markup and CSS wording are not prescribed.

  R3_run_detail_presentation:
    surface: "GET /runs/{repo}/{run_id} (HTML run-detail header)"
    rule: >
      A run detail whose run record has `dry_run: true` displays a
      non-dismissible designation with banner character in the header. The
      designation remains visible in the viewport while the user scrolls the
      trace tree (e.g. a sticky header or sticky banner); a notice that merely
      appears at the document start and scrolls out of view does not conform.
      A run with `dry_run: false` displays no Dry-Run designation. The short
      label comes from the existing English/German i18n catalog and follows the
      selected language. Its visibility does not depend on `usage`, token, or
      other content data. Concrete markup, CSS selectors, and the persistence
      mechanism are not prescribed.

  R4_run_list_order:
    applies_to: "GET /api/runs response order and GET / run-list order"
    groups:
      - awaiting_approval
      - running
      - remaining_statuses
    rule: >
      Runs are grouped first by status: every `awaiting_approval` run precedes
      every `running` run and every run in the remaining-status group; every
      `running` run precedes every run in the remaining-status group. Within
      each group, the existing newest-first ordering is preserved. The
      `dry_run` value affects neither group membership nor ordering within a
      group. No configurable ordering, filter, or grouping by `dry_run` is
      introduced.

  unchanged_surfaces:
    rule: >
      Timeline, Artifacts, Raw, SSE, retention, persistence, and all other
      existing interfaces and behaviors remain unchanged. No new route, tab,
      event, filter, or Dry-Run-specific retention behavior is introduced.

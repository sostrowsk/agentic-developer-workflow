# Interface contract — GUI-Redesign 4: Ohne Maus bedienbar
#
# Single-Lane-Projekt (nur `backend`, siehe .adw/config.yaml). Dieser Brief ist
# REIN BEDIENEND. Der Contract pinnt genau zwei Dinge:
#
#   1. die UNVERÄNDERLICHKEIT der beiden JSON-Routen `/api/runs` und
#      `/api/runs/{repo}/{run_id}` in allen Feldern, Typen und Werten — keine
#      neuen Routen, keine neuen Query-Parameter; und
#   2. das extern beobachtbare BEDIEN-Verhalten der bestehenden HTML-Route
#      `GET /runs/{repo}/{run_id}` (x-adw-template-behavior).
#
# NICHT Teil des Contracts (frei änderbar, Spec „Nicht Teil des Contracts"):
# Klassennamen, ARIA-Attribute, Markup- und CSS-Wortlaut, Tastenbelegung.
# Der Vertrag beschreibt das beobachtbare BEDIENERGEBNIS, nicht Attribut-,
# Token- oder Tastennamen; die bindende Tastenbelegung und die konkreten
# ARIA-Namen stehen in Spec und Plan und bleiben dort verbindlich.
openapi: 3.0.3
info:
  title: ADW GUI — Ohne Maus bedienbar (rein bedienend)
  version: 4.0.0
  description: >-
    Minimaler Contract für den einzigen Workstream backend, Basis ist der
    gemergte Stand 0.24.0. Er fixiert, dass dieses Feature die JSON-API NICHT
    verändert (Regression über alle Felder, Typen und Werte), und pinnt das
    beobachtbare Bedien-Verhalten der Run-Detail-Seite. Die Schemas
    beschreiben nur die vorhandenen äußeren Antwortformen; die vollständige
    Bestandsgleichheit der JSON-Antworten ist zusätzlich verbindlich. Die
    Version bezeichnet dieses Vertragsdokument, keine Paket- oder API-Version.

paths:
  /api/runs:
    get:
      summary: Run-Liste — durch dieses Feature unverändert.
      description: >-
        Bei identischen Eingaben und identischem Auswertungszeitpunkt bleibt
        die vollständige Antwort gegenüber 0.24.0 unverändert — Einträge,
        Reihenfolge, Felder, Typen, Werte und die Bedingungen für fehlende
        oder nullwertige Felder. Keine neuen Query-Parameter. Ein
        Regressionstest fixiert die Unveränderlichkeit (AC 13).
      responses:
        "200":
          description: Bestehende Run-Listen-Antwort, unverändert.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /api/runs/{repo}/{run_id}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Run-Detail — durch dieses Feature unverändert.
      description: >-
        Bei identischen Eingaben und identischem Auswertungszeitpunkt bleibt
        die vollständige Antwort gegenüber 0.24.0 in allen Feldern, Typen und
        Werten unverändert, einschließlich verschachtelter Inhalte,
        Listenreihenfolgen und der Bedingungen für vorhandene, fehlende und
        nullwertige Felder. Tastatur-, Fokus- oder Auswahlzustände werden
        NICHT in die JSON-Antwort aufgenommen. Keine neue Route, kein neuer
        Query-Parameter. Ein Regressionstest fixiert die Unveränderlichkeit
        auch nach einem vorausgehenden HTML-Abruf (AC 13).
      responses:
        "200":
          description: Bestehende Run-Detail-Antwort, unverändert.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /runs/{repo}/{run_id}:
    parameters:
      - $ref: "#/components/parameters/Repo"
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Run-Detail-Seite — bestehende HTML-Route, neues Bedien-Verhalten.
      description: >-
        Bestehende HTML-Route mit unveränderten Query-Parametern,
        unveränderten angezeigten Informationen und unveränderten Status- und
        Fehlerantworten. Bestehende Fokus-Navigation und serverseitige
        Tab-Vorauswahl behalten ihre Bedeutung. Das neue beobachtbare
        Bedien-Verhalten ist unter x-adw-template-behavior beschrieben; was
        die Seite ZEIGT, ändert sich nicht.
      responses:
        "200":
          description: Serverseitig gerenderte Run-Detail-Seite.
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    Repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string

x-adw-workstreams: [backend]

x-adw-invariants:
  - >-
    Rein bedienend: Die JSON-Routen `/api/runs` und
    `/api/runs/{repo}/{run_id}` bleiben in allen Feldern, Typen und Werten
    unverändert; die offenen Objektschemas erlauben KEINE featurebedingte
    API-Erweiterung. Keine neue Route, kein neues Tab, kein neuer
    Query-Parameter (AC 13).
  - >-
    Was die Seite ZEIGT, ändert sich nicht: keine neue Information, keine
    neue Spalte, kein neuer Block, keine geänderte Reihenfolge, keine
    Änderung an Layout, Kennzahlen, Verdichtung, Run-Liste oder
    Timeline-Geometrie (E7). Keine Änderung an Ereignistypen, Event-Payloads,
    Instrumentierung, `build_tree`, der Verdichtung, der Blätterung, dem
    SSE-Pfad oder der Retention (E8). Auswahl-, Pane- und `?focus`-Verhalten
    bleiben inhaltlich unverändert; nur ihre Erreichbarkeit über die Tastatur
    kommt hinzu. Keine Persistenz, kein Polling.
  - >-
    Kein DOM-Wachstum je Baumzeile (E3): die Zahl der Baum-Eintragsmarker und
    der gerenderten Elemente der serverseitigen Baum-Spalte bleibt für
    gleiche Eingabe unverändert; die Baum-Spalte erhält höchstens EINEN neuen
    serverseitigen Tastatur-Einstiegspunkt. Alles Weitere je Zeile setzt der
    Client zur Laufzeit.
  - >-
    Keine neue Laufzeit-Dependency, kein Frontend-Paket, kein CDN, keine
    Webfont, keine Barrierefreiheits-Bibliothek (E1): die Seite lädt keine
    neuen externen Ressourcen.
  - >-
    Bestand bleibt wörtlich erhalten: `<label>` um den Typfilter,
    `aria-label` am Suchfeld, `aria-expanded` am Falt-Knopf, `aria-hidden`
    an den Statusglyphen und `aria-label` am Run-Kontext-Panel (AC 12).

# Beobachtbares Bedien-Ergebnis der Run-Detail-Seite. Bindend ist das
# ERGEBNIS, nicht die konkrete Tastenbelegung oder ARIA-Attributnamen (beide
# ausdrücklich NICHT Contract); die normativen Tabellen stehen in Spec und Plan.
x-adw-template-behavior:
  tree:
    navigation: >-
      Die Baum-Spalte ist nach Client-Initialisierung genau EIN sequenzieller
      Tab-Halt, nicht einer je Zeile (E2); auch nativ fokussierbare Elemente
      innerhalb der Spalte erzeugen keinen zusätzlichen sequenziellen
      Tab-Halt. Über diesen Zugang sind die vorhandenen sichtbaren Zeilen per
      Tastatur navigierbar; Inhalte geschlossener Phasen, Gruppen und
      Wiederholungen werden übersprungen. Die vorhandenen Faltungen sind per
      Tastatur bedienbar; auf einer Zeile ohne Klappmechanik entsteht keine
      Zustandsänderung und kein Fehler. Tastenkombinationen mit Strg, Alt
      oder Meta werden nicht abgefangen.
    selection: >-
      Vorhandene auswählbare Knoten sind ohne Maus auswählbar — ohne ein
      einziges Klick-Ereignis — und zeigen denselben Detail-Pane wie bei
      einem Klick. Die Auswahl-Auslösung über die zweite gebundene Taste
      erreicht dieselbe Auswahl und scrollt die Seite dabei nicht. Reine
      Auf-/Ab-Bewegung löst KEINE Auswahl aus; es entstehen keine neuen
      auswählbaren Knoten. Der flüchtige Navigationszustand ist Teil der
      vorhandenen Client-Bedienung — kein neues Subsystem, keine Persistenz,
      kein Query-Parameter.
    rendering: >-
      Bei identischen Eingaben bleiben die Zahl serverseitig gerenderter
      Elemente und die Zahl vorhandener Baum-Eintragsmarker unverändert.
      Höchstens ein neuer serverseitiger Tastatur-Einstiegspunkt;
      zeilenbezogene Ergänzungen des Bedienmusters erfolgen clientseitig (E3).

  timeline:
    activation: >-
      Die ganze bestehende Timeline-Zeile einschließlich Beschriftung und
      Spur ist die bedienbare Einheit: anklickbar, in Darstellungsreihenfolge
      per Tastatur fokussierbar und auslösbar. Beschriftung, Balken und
      Tastaturauslösung wählen denselben Knoten — das Klickziel ist nicht
      mehr auf den schmalen Balken beschränkt. Der Balken selbst bleibt
      anklickbar und geometrisch unverändert.
    focus_navigation: >-
      Kann die Seite den Zielknoten nicht darstellen, führt auch die
      Tastaturauslösung zur bestehenden `?focus`-Navigation; Zielauflösung
      und Verhalten der anschließenden Landung bleiben unverändert.

  focus:
    visibility: >-
      Jedes fokussierbare Element erhält bei Tastaturnutzung einen
      einheitlichen sichtbaren Fokusindikator in BEIDEN Themes; er wird
      nirgends ersatzlos entfernt. Der Indikator ist nicht allein eine
      Farbänderung, sondern hat eine eigene Kontur. Auch die über den
      zentralen Baum-Einstieg angesteuerte Zeile bleibt sichtbar erkennbar.
      Unterdrückung bei reiner Mausnutzung ist Gestaltungsspielraum.
    contrast: >-
      Die Fokusfarbe ist ein eigenes, in beiden Themes definiertes Token und
      erreicht mindestens 3:1 Kontrast gegen Seiten- UND
      Oberflächenhintergrund. Die für „ein Mensch muss handeln" reservierte
      Signalfarbe wird NICHT verwendet (E5).

  tabs:
    semantics: >-
      Das angekündigte Registerkarten-Muster wird eingelöst, nicht durch
      Entfernen der Rolle aufgelöst (E4): jede vorhandene Gruppe bietet
      maschinenlesbar Registerkarten, Auswahlzustand und die Zuordnung zu
      ihren Panels. Genau eine Karte je Gruppe ist als ausgewählt markiert
      und ein sequenzieller Tab-Halt.
    switching: >-
      Tastatur- und Klickwechsel aktualisieren innerhalb derselben
      nächstgelegenen Gruppe gemeinsam aktive Karte, Auswahlzustand,
      Tab-Halt und sichtbares Panel; verschachtelte Gruppen bleiben
      unabhängig. Die bestehende aktive Auszeichnung und die serverseitige
      Vorauswahl bleiben; die maschinenlesbare Auszeichnung tritt daneben
      und ersetzt nichts.
    initial_state: >-
      Die bestehende serverseitige Vorauswahl wird übernommen —
      einschließlich einer Raw-Tab-Landung über `raw_from_seq` — und
      sichtbarer wie maschinenlesbarer Zustand stimmen bereits initial
      überein.

  selected_node:
    semantics: >-
      Der ausgewählte Knoten ist zusätzlich zur unveränderten visuellen
      Auszeichnung maschinenlesbar als ausgewählt erkennbar. Ein
      Auswahlwechsel nimmt die Auszeichnung am vorherigen Knoten zurück.
      Dies gilt für Baum wie Timeline, Maus wie Tastatur, die Initialauswahl
      und `?focus`-Landungen. Bloßer Navigationsfokus ist keine Auswahl.

  localization:
    text: >-
      Jeder neue sichtbare oder vorgelesene Text liegt in Deutsch und
      Englisch vor; beide Sprachkataloge haben identische Schlüsselmengen.
      Ein neuer sichtbarer Hinweisblock ist nicht erforderlich (E7).
      Lane-Namen, Knotenlabels und Balkennamen sind Inhalte und werden nicht
      übersetzt.

x-adw-contract-boundary:
  excluded:
    - Klassennamen.
    - ARIA-Attributnamen und -Werte.
    - Markup- und CSS-Wortlaut, Token-Namen.
    - Die konkrete Tastenbelegung.
    - Interne Helfer, Signaturen, Darstellungsdatentypen und flüchtige
      Client-Zustandsstrukturen.
  note: >-
    Die ausgeschlossenen Details werden nicht als Schnittstelle
    festgeschrieben. Die bindende Tastenbelegung, die konkreten ARIA-Namen,
    das DOM-Gewicht, die Fokus-Kontrastschranke und die Testabnahme aus Spec
    und Plan bleiben für Implementierung und Abnahme verbindlich — sie stehen
    dort, nicht in diesem Vertrag.

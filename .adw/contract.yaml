# Interface contract — Single-Lane project (`backend`).
#
# This delta contract pins ONLY the externally observable additions to the
# existing run-detail surface:
#   1. One additive, purely DERIVED `recovery` object on the JSON response of
#      GET /api/runs/{repo}/{run_id}. It is present EXACTLY when the run needs
#      human intervention (per the selection rule), and ABSENT otherwise — never
#      an empty object is forced. It projects the already-loaded run state
#      (`state.phase`), the existing run-status derivation, the event stream and
#      the server-resolved repository path; no new event, route, or persistence.
#   2. The observable rendering / read-only behavior on the run-detail page:
#      exactly one recovery card, its anchoring, the shell-safe command text, and
#      the promise that no command is ever executed.
#
# It does NOT pin internal helper signatures, internal dictionary keys, internal
# module layout, unchanged response fields, concrete markup, or CSS. No route or
# event is added or removed. The `escalation` event, `limit.hit`,
# `circuit_breaker` and the format of `escalation.md` are unchanged (E4). The
# events route GET /api/runs/{repo}/{run_id}/events is not touched and therefore
# not represented here (see x-behavior.unchanged_surfaces).

openapi: 3.1.0
info:
  title: ADW Run Inspector — recovery card at the causing node (delta only)
  version: 1.1.0

paths:
  /api/runs/{repo}/{run_id}:
    get:
      summary: >
        Existing run-detail route — unchanged except one additive derived
        `recovery` object, present only when the run needs human intervention.
      parameters:
        - name: repo
          in: path
          required: true
          description: Existing registry slug; never the real repository path.
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing run-detail object. It carries a `recovery` object exactly
            when the run needs human intervention (P1_presence); otherwise the
            key is absent. Missing or untypical event/payload data never yields a
            5xx and never invents substitute values (P7_robust). All other
            response fields keep their current shape and meaning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailRecoveryAddition"

  /runs/{repo}/{run_id}:
    get:
      summary: Existing server-rendered run-detail page.
      parameters:
        - name: repo
          in: path
          required: true
          description: Existing registry slug; never the real repository path.
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing HTML run-detail page. It renders AT MOST one recovery card,
            following the `recovery` object (P10_render): in the escalation case
            anchored at the node of the governing `escalation` event with reason,
            affected phase, the associated abort events, the new-run hint and the
            link to `escalation.md`; in the approve/resume case at run level with
            `state.phase` and the command text. No recovery object → no card. The
            card never executes anything (P11_readonly); the real repo path
            appears only in the card's command text, never in a URL (P8_no_path).
            Markup and CSS are not part of the contract.
          content:
            text/html: {}

components:
  schemas:
    RecoveryAbortEvent:
      type: object
      additionalProperties: true
      required:
        - type
        - payload
      description: >
        One `limit.hit` or `circuit_breaker` event associated with the governing
        escalation (P6_aborts). Its `payload` is carried VERBATIM — never
        rewritten, classified or interpreted (E3/E4).
      properties:
        type:
          type: string
          enum: [limit.hit, circuit_breaker]
        seq:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: >
            The event payload unchanged — `{limit, value, cap}` for `limit.hit`,
            `{keys, scope}` for `circuit_breaker`. Untypical/missing fields are
            passed through as-is, never filled with invented values (P7_robust).

    Recovery:
      description: >
        The derived recovery projection — exactly one of three variants, selected
        by `kind` per the rule of P1_presence/P2_selection evaluated on
        `state.phase` (never on the `escalation` event's `phase`). The variant
        shapes are structurally enforced: `approve`/`resume` MUST carry the
        finished, shell-safe `command`; `none` carries no command but the
        machine-readable new-run flag plus the escalation context.
      oneOf:
        - $ref: "#/components/schemas/ApproveRecovery"
        - $ref: "#/components/schemas/ResumeRecovery"
        - $ref: "#/components/schemas/EscalatedRecovery"
      discriminator:
        propertyName: kind
        mapping:
          approve: "#/components/schemas/ApproveRecovery"
          resume: "#/components/schemas/ResumeRecovery"
          none: "#/components/schemas/EscalatedRecovery"

    ApproveRecovery:
      type: object
      additionalProperties: true
      required:
        - kind
        - needs_new_run
        - command
      description: >
        Run paused at an approval gate
        (`awaiting_spec_approval`/`awaiting_approval`).
      properties:
        kind:
          type: string
          const: approve
        needs_new_run:
          type: boolean
          const: false
        command:
          type: string
          description: >
            The finished, copyable command in the existing CLI signature —
            `adw approve <run_id> --repo <path>` — with the run's real `run_id`
            and the real, server-resolved repository path from the registry, NOT
            the slug. Both values are rendered POSIX-shell-safely per
            `shlex.quote` semantics (P4_shell_safe). The command line is not
            translated.

    ResumeRecovery:
      type: object
      additionalProperties: true
      required:
        - kind
        - needs_new_run
        - command
      description: >
        Run aborted/crashed in a work phase (derived run-status not `running`).
      properties:
        kind:
          type: string
          const: resume
        needs_new_run:
          type: boolean
          const: false
        command:
          type: string
          description: >
            The finished, copyable command in the existing CLI signature —
            `adw resume <run_id> --repo <path>` — with the run's real `run_id`
            and the real, server-resolved repository path from the registry, NOT
            the slug. Both values are rendered POSIX-shell-safely per
            `shlex.quote` semantics (P4_shell_safe). The command line is not
            translated.

    EscalatedRecovery:
      type: object
      additionalProperties: true
      required:
        - kind
        - needs_new_run
        - command
        - anchor_seq
        - reason
        - phase
        - aborts
        - escalation_artifact
      description: >
        Run finally escalated (`state.phase == escalated`) — a NEW run is
        required, no continuation command is offered. The escalation-context
        fields are required; where the event log lacks usable data they are
        `null` (or an empty list), never invented (P7_robust).
      properties:
        kind:
          type: string
          const: none
        needs_new_run:
          type: boolean
          const: true
        command:
          type: "null"
          description: >
            Always `null` — no continuation command exists for a finally
            escalated run (P3_new_run_flag).
        anchor_seq:
          type:
            - integer
            - "null"
          description: >
            The integer `seq` of the governing `escalation` event (the one with
            the greatest `seq`, E5) at whose node the card is anchored
            (P10_render). `null` when the escalated run carries no usable
            `escalation` event (missing event log, P7_robust); the card then
            falls back to run level, never hidden.
        reason:
          type:
            - string
            - "null"
          description: >
            The `reason` verbatim from the payload of the governing `escalation`
            event (P5). Unchanged, unclassified. `null` when the payload lacks a
            usable reason (P7_robust).
        phase:
          type:
            - string
            - "null"
          description: >
            The affected/origin `phase` verbatim from the governing `escalation`
            event's payload (P5) — NOT `state.phase`, and never `escalated`.
            `null` when absent (P7_robust).
        aborts:
          type: array
          description: >
            The `limit.hit`/`circuit_breaker` events of THIS run that belong to
            the governing escalation — those with `seq` less than the governing
            `escalation` event's `seq` and greater than the `seq` of any prior
            `escalation` event (the immediately preceding ones, P6), listed in
            event order. An empty list when there are none.
          items:
            $ref: "#/components/schemas/RecoveryAbortEvent"
        escalation_artifact:
          type: string
          description: >
            A reference/identifier of the `escalation.md` artifact in the
            existing Artifacts tab (P9) — NOT its embedded content and no
            assertion that the file exists. If the artifact is unexpectedly
            absent, the Artifacts tab's existing "missing" behavior stays
            authoritative and the run detail stays usable.

    RunDetailRecoveryAddition:
      type: object
      additionalProperties: true
      description: >
        Existing run-detail object. This schema pins only the additive `recovery`
        projection; every other property (`run`, `phases`, `tree`,
        `latest_context`, `problems`, `raw`) keeps its current shape and meaning.
        The `recovery` key is present EXACTLY when the run needs human
        intervention (P1_presence) and ABSENT otherwise — never an empty object.
      properties:
        recovery:
          $ref: "#/components/schemas/Recovery"
      examples:
        - recovery:
            kind: none
            needs_new_run: true
            command: null
            anchor_seq: 128
            reason: "Lane backend: Gate-Fix-Iteration hat nichts verändert — Circuit-Breaker."
            phase: build
            aborts:
              - type: circuit_breaker
                seq: 127
                payload:
                  keys: ["ruff|1|…"]
                  scope: "lane:backend"
            escalation_artifact: escalation.md
        - recovery:
            kind: resume
            needs_new_run: false
            command: "adw resume 20260826-abcd1234 --repo '/home/me/proj dir'"

x-behavior:
  P1_presence:
    surface: "GET /api/runs/{repo}/{run_id} — derived recovery projection"
    rule: >
      The response carries a `recovery` object EXACTLY when the run needs human
      intervention, decided from `state.phase` and the existing run-status
      derivation of the run detail (open run span == running):
        - `state.phase == escalated`               → kind `none` (new run needed).
        - `state.phase` in {awaiting_spec_approval,
          awaiting_approval}                        → kind `approve`.
        - `state.phase` is a work phase (spec, plan, build, integration,
          codex_review, final_review, ci) AND the derived run-status is NOT
          `running`                                 → kind `resume`.
        - `state.phase == done`, a work phase with status `running`, or no
          loadable state                            → NO recovery object (the key
          is absent; an empty object is never forced).
      The `escalated` check strictly precedes all other branches. Each branch has
      a real producer in today's lifecycle: final escalation → `none`; an
      approval pause → `approve`; a transient agent abort / crash with a
      non-`running` derived status in a work phase → `resume`. The rest of the
      response keeps its semantics.

  P2_selection:
    rule: >
      The selection follows the P1 rule ONLY, evaluated on `state.phase` — never
      on the `escalation` event's `phase` field (which is always the origin phase
      and can never be `escalated`). The escalation reason, `limit.hit` and
      `circuit_breaker` do not influence the selection; there is never more than
      one command proposal. For an `escalated` run neither `adw resume` nor
      `adw approve` is ever proposed — consistent with `adw resume` itself
      refusing an escalated run and pointing to a new run.

  P3_new_run_flag:
    rule: >
      When the rule yields `none`, `recovery.command` is `null` and
      `recovery.needs_new_run` is `true` — the machine-readable signal that a new
      run is required. When it yields `approve`/`resume`, `needs_new_run` is
      `false` and `command` is the finished command text (P4_shell_safe). These
      combinations are structurally enforced by the schema variants; no other
      combination is schema-valid.

  P4_shell_safe:
    rule: >
      For `approve`/`resume`, `command` is the finished, copyable text in the
      existing CLI signature — `adw approve <run_id> --repo <path>` resp.
      `adw resume <run_id> --repo <path>` — with the real `run_id` and the real,
      server-resolved repository path from the registry, not the slug. `run_id`
      and path are rendered deterministically per `shlex.quote` semantics (values
      without special characters unchanged; otherwise single-quoted, embedded
      single quotes as `'\''`). Parsed by a POSIX shell, the text yields exactly
      the intended arguments — the path stays ONE `--repo` argument even with
      spaces, single quotes or shell metacharacters — and produces no extra
      command. The command line is not translated, independent of GUI language.

  P5_escalation_context:
    rule: >
      In the escalation case (`none`), `recovery.reason` and `recovery.phase` are
      taken VERBATIM from the payload of the `escalation` event with the greatest
      `seq` (E5). Nothing is rewritten, classified or interpreted. `phase` is the
      origin phase from the event, never `state.phase`.

  P6_aborts:
    rule: >
      In the escalation case, `recovery.aborts` lists the `limit.hit` and
      `circuit_breaker` events of the SAME run belonging to this escalation:
      exactly those with `seq` less than the governing `escalation` event's `seq`
      and greater than the `seq` of any earlier `escalation` event (the
      immediately preceding aborts), in event order. Their payloads
      (`{limit, value, cap}` resp. `{keys, scope}`) are carried unchanged. When
      there are none, the list is empty.

  P7_robust:
    rule: >
      Missing or unexpected data — an escalated run without an event log, missing
      or untypical payload fields of `escalation`, `limit.hit` or
      `circuit_breaker` — yields neither a 5xx nor invented substitute values; the
      remaining usable recovery data (in particular `kind` and `needs_new_run`)
      stays visible. The existing event log is the backstop.

  P8_no_path:
    rule: >
      The real repo path appears ONLY in `recovery.command` (and thus the card's
      command text). No existing or new URL/route carries the real path; the slug
      rule of §7.4 is unchanged.

  P9_artifact_link:
    rule: >
      In the escalation case, `recovery.escalation_artifact` references
      `escalation.md` as an artifact of the Artifacts tab (reference/identifier,
      no embedded content, no assertion that the file exists); the content is not
      duplicated. If the artifact is unexpectedly missing, the Artifacts tab's
      existing "missing" behavior stays authoritative and the run detail stays
      usable.

  P10_render:
    surface: "GET /runs/{repo}/{run_id} (HTML run detail)"
    rule: >
      The run detail renders EXACTLY one recovery card: in the escalation case
      anchored at the node of the governing `escalation` event (`anchor_seq`),
      with reason, affected phase, the associated abort events, the new-run hint
      and the link to `escalation.md`; in the `approve`/`resume` case (no
      `escalation` node exists) at run level of the detail pane, with
      `state.phase` and the command text. If, despite an escalated state, no
      anchorable `escalation` node exists (`anchor_seq == null`, missing event
      log), the still-usable card is rendered at run level — never hidden and
      never duplicated. Without a `recovery` object no card appears. The other
      detail-pane areas keep their behavior. All card labels are available in
      both English and German, following the GUI language; the command line,
      event values, `run_id` and repo path are not translated.

  P11_readonly:
    rule: >
      The GUI executes no command: rendering the recovery data spawns no
      subprocess and writes neither to state nor run artifacts nor the repo. The
      command text is pure display. This promise is part of the observable
      contract surface (E1).

  unchanged_surfaces:
    rule: >
      The `escalation` event, `limit.hit`, `circuit_breaker` and the format of
      `escalation.md` are unchanged (E4). No route or event is added or removed;
      the events route GET /api/runs/{repo}/{run_id}/events, the SSE surface,
      Timeline, Artifacts and the snapshot Diff tab keep their content and
      behavior. No new persistence is introduced, and run liveness stays decided
      by the existing observable status derivation (a crash it does not recognise
      shows no card). Internal helper signatures, internal module layout and
      concrete markup/CSS are not part of this contract.

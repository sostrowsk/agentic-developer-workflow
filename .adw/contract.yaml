# Interface contract — Single-Lane project (`backend`).
#
# This delta contract pins ONLY the externally observable additions for the
# "plan skeleton in the trace" feature:
#   1. One additive, purely DERIVED `plan_skeleton` array on the JSON response of
#      GET /api/runs/{repo}/{run_id}. It is PRESENT exactly when the run's
#      `plan.md` yields at least one `## Workstream:` section with at least one
#      `###` task, and ABSENT otherwise — an empty list is never forced. It is a
#      pure projection of the run's `plan.md` — which the implementation MAY
#      newly read while constructing the run detail, but only through the
#      existing whitelist- and boundary-enforced artifact resolution (no new
#      route, no new filesystem-access mechanism) — and of the already-loaded
#      event stream (for the coarse lane status); no new event, no new
#      persistence.
#   2. The two observable PARSE RULES that derive the skeleton from `plan.md`.
#   3. The observable FALLBACK behavior when `plan.md` is missing/empty/unreadable
#      or carries no matching section.
#
# It does NOT pin internal helper signatures, internal dictionary keys of other
# fields, internal module layout, unchanged response fields, concrete markup, or
# CSS. No route or event is added or removed. The recovery projection, the
# artifacts route, the events route GET /api/runs/{repo}/{run_id}/events, the SSE
# surface, Timeline, Artifacts and the snapshot Diff tab are unchanged.

openapi: 3.1.0
info:
  title: ADW Run Inspector — plan skeleton in the trace (delta only)
  version: 1.2.0

paths:
  /api/runs/{repo}/{run_id}:
    get:
      summary: >
        Existing run-detail route — unchanged except one additive derived
        `plan_skeleton` array, present only when `plan.md` yields a matching
        section with at least one task.
      parameters:
        - name: repo
          in: path
          required: true
          description: Existing registry slug; never the real repository path.
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing run-detail object. It carries a `plan_skeleton` array exactly
            when the run's `plan.md` yields at least one `## Workstream:` section
            with at least one `###` task (S1_presence); otherwise the key is
            absent — an empty list is never forced (S4_fallback). A missing,
            empty, unreadable or boundary-escaping `plan.md` never yields a 5xx and
            never invents values. All other response fields keep their current
            shape and meaning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailPlanSkeletonAddition"

  /runs/{repo}/{run_id}:
    get:
      summary: Existing server-rendered run-detail page.
      parameters:
        - name: repo
          in: path
          required: true
          description: Existing registry slug; never the real repository path.
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing HTML run-detail page. When `plan_skeleton` is present it
            renders, per workstream, a READ-ONLY task list beside/above the trace
            of the lane with the same name (S5_render), with a coarse
            pending/done marker. The list is NOT bound to an existing lane trace
            node: a not-yet-started lane still shows its `pending` skeleton without
            creating an empty or artificial trace node. No `plan_skeleton` → no
            list. The trace tree, its node structure and the other detail areas
            keep their behavior. Task texts are content and are not translated;
            markup and CSS are not part of the contract.
          content:
            text/html: {}

components:
  schemas:
    PlanSkeletonEntry:
      type: object
      additionalProperties: true
      required:
        - workstream
        - status
        - tasks
      description: >
        One workstream section of `plan.md` that has at least one `###` task,
        derived by the two parse rules of S2_parse. A section without a `###`
        task produces no entry.
      properties:
        workstream:
          type: string
          description: >
            The `<name>` verbatim from the `## Workstream: <name>` line — the text
            after the exact prefix `## Workstream: ` (S2_parse). In this
            single-lane project this is `backend`; the field is not constrained to
            that value.
        status:
          type: string
          enum: [pending, done]
          description: >
            The coarse LANE-LEVEL status (S3_status). `done` exactly when the
            `lane` span whose name equals `workstream` has a `lane` end with
            `completed: true`; otherwise `pending` — including a `lane` end
            without `completed: true` (`false` or missing) and a not-yet-started
            lane. There is no per-task and no per-node status.
        tasks:
          type: array
          minItems: 1
          description: >
            The task texts in document order (S2_parse). Each is the text after
            the exact `### ` prefix — the marker and exactly one separator space
            removed, otherwise VERBATIM: no split into identifier and title, no
            further trimming, no filtering of the heterogeneous forms
            (`### B1 — …`, `### 1. …`, `### A.1 — …`, `### Aufgabe A — …`,
            `### Aufgabe B1 — …`).
          items:
            type: string

    RunDetailPlanSkeletonAddition:
      type: object
      additionalProperties: true
      description: >
        Existing run-detail object. This schema pins only the additive
        `plan_skeleton` projection; every other property (`run`, `phases`,
        `tree`, `latest_context`, `problems`, `raw`, and the existing optional
        `recovery`) keeps its current shape and meaning. The `plan_skeleton` key
        is present EXACTLY when `plan.md` yields at least one matching section
        with a task (S1_presence) and ABSENT otherwise — never an empty list.
      properties:
        plan_skeleton:
          type: array
          minItems: 1
          description: >
            One entry per `## Workstream:` section with at least one `###` task,
            in `plan.md` document order.
          items:
            $ref: "#/components/schemas/PlanSkeletonEntry"
      examples:
        - plan_skeleton:
            - workstream: backend
              status: pending
              tasks:
                - "B1 — Parser: Skelett aus plan.md"
                - "1. Additives Feld in der Detail-Antwort"
        - plan_skeleton:
            - workstream: backend
              status: done
              tasks:
                - "Aufgabe A — Anzeige neben dem Trace"

x-behavior:
  S1_presence:
    surface: "GET /api/runs/{repo}/{run_id} — derived plan_skeleton projection"
    rule: >
      The response carries a `plan_skeleton` array EXACTLY when the run's
      `plan.md` — read only through the existing whitelist artifact path — yields
      at least one `## Workstream: <name>` section containing at least one `###`
      task. The array is ordered by `plan.md` document order, one entry per such
      section. A section with no `###` task contributes no entry. When no such
      section exists the key is ABSENT; an empty list is never forced. All other
      response fields keep their semantics; this addition is purely additive.

  S2_parse:
    rule: >
      The skeleton is derived by EXACTLY TWO rules, observable as a promise (no
      Markdown parser, no new dependency, no identifier pattern):
        (1) A workstream section starts at a line `## Workstream: <name>` and ends
            at the next `##` heading (any line starting with `##` that is not
            `###`) or at end of file. `<name>` is the text after the exact prefix
            `## Workstream: `.
        (2) A task line is every line within that section that starts with the
            exact prefix `### ` (the `###` marker followed by one space). The
            task text is the text after that prefix, VERBATIM — the marker and
            exactly one separator space are removed, nothing else; no split into
            identifier and title, no further trimming. A line that is exactly
            `###` with no following text yields no task. The heterogeneous forms
            (`### B1 — …`, `### 1. …`, `### A.1 — …`, `### Aufgabe A — …`,
            `### Aufgabe B1 — …`) are NOT filtered; each yields exactly one task
            with its full heading text.
      `###` lines outside any `## Workstream:` section, and `###` lines after the
      closing `##` heading, do not count.

  S3_status:
    rule: >
      Each entry carries exactly one coarse LANE-LEVEL status. `done` when the
      `lane` span whose name equals the entry's `workstream` has a `lane` end with
      `completed: true`; otherwise `pending` — including a `lane` end without
      `completed: true` (`false` or missing) and a lane that has not started
      (no lane node). There is no per-task status, no per-trace-node status, and
      no guessed task-to-node mapping (E1). The status is derived from the run's
      already-loaded event stream; no new event or reader.

  S4_fallback:
    rule: >
      A `plan.md` that is missing, empty, unreadable, or absent per the artifact
      path (not present, or a symlink escaping the run-directory boundary), or
      that contains no `## Workstream:` section with at least one `###` task,
      yields NO skeleton: `plan_skeleton` is absent (not an empty list), no error
      and no 5xx, no empty box, and the rest of the detail response and the
      existing run-detail view are unchanged.

  S5_render:
    surface: "GET /runs/{repo}/{run_id} (HTML run detail)"
    rule: >
      When `plan_skeleton` is present the run detail renders, per entry, a
      read-only task list beside/above the trace of the lane with the same name
      (mapping workstream → lane by equal name, currently `backend`), so that
      "done" (trace) and "planned" (skeleton) sit in one view without a tab
      switch, with a coarse pending/done marker (S3_status). The list is NOT bound
      to an existing lane trace node: a lane with no trace node yet still shows its
      `pending` skeleton, WITHOUT creating an empty or artificial trace node. No
      `plan_skeleton` → no list; no empty box. The trace tree and its node
      structure are unchanged. Chrome labels follow the GUI language; the task
      texts are content and are not translated. Markup and CSS are not part of the
      contract.

  S6_readonly:
    rule: >
      The skeleton is pure display: no checking off, no editing, no write route,
      no new persistence. `plan.md` is read only through the existing whitelist-
      and boundary-enforced artifact access behavior — no new route, no new
      filesystem-access mechanism, and URL segments are never used as a
      filesystem path. Deriving and rendering the skeleton mutates nothing:
      neither state nor run artifacts nor events are created or changed (E5).

  unchanged_surfaces:
    rule: >
      No route or event is added or removed. The recovery projection, the
      artifacts route and its whitelist, the events route
      GET /api/runs/{repo}/{run_id}/events, the SSE surface, Timeline, Artifacts
      and the snapshot Diff tab keep their content and behavior. The orchestrator,
      event schema and instrumentation are unchanged (E2); no per-task
      instrumentation is added. Internal helper signatures, internal module layout
      and concrete markup/CSS are not part of this contract.

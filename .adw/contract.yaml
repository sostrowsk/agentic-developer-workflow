# Interface contract — Single-Lane project (`backend`).
#
# Scope of this contract: ONLY externally observable surfaces of the change —
# the status VALUES in the JSON responses of the two read endpoints, and the
# observable template behavior that renders them. It does NOT pin internal
# helper signatures (`_node_status`, `_summary`, `_phase_bar`), dictionary keys
# beyond the response fields already present, `_WAITING_TYPES`' membership, or
# any markup/CSS wording. Existing response shapes are unchanged; this change
# only WIDENS the value domain of three already-present `status` fields and
# adds derivation rules for when those values appear. No routes or events are
# added or removed.

openapi: 3.1.0
info:
  title: ADW Run Inspector — waiting/awaiting status surfaces
  version: 0.8.1

paths:
  /api/runs:
    get:
      summary: List runs across all registered repos (unchanged shape).
      responses:
        "200":
          description: Array of run summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"

  /api/runs/{repo}/{run_id}:
    get:
      summary: Run detail (unchanged shape).
      parameters:
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Run detail object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"

components:
  schemas:

    RunSummary:
      type: object
      description: >
        Existing summary object. Only the `status` field's value domain and
        derivation change; all other fields keep their current meaning.
      properties:
        status:
          $ref: "#/components/schemas/RunStatus"
      # Other fields (run_id, repo, repo_exists, issue, phase, start,
      # duration, cost, event_count, has_trace) are unchanged and not re-pinned.

    RunDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/RunSummary"
        phases:
          type: array
          items:
            $ref: "#/components/schemas/PhaseCell"
        tree:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
      # Other detail fields (problems, raw) are unchanged and not re-pinned.

    PhaseCell:
      type: object
      properties:
        name:  { type: string }
        status:
          $ref: "#/components/schemas/PhaseStatus"
        duration:
          type: [number, "null"]

    TreeNode:
      type: object
      description: A trace-tree node (recursive via `children`, unchanged shape).
      properties:
        status:
          $ref: "#/components/schemas/NodeStatus"
      # Node type/label/seq/children/etc. are unchanged and not re-pinned.

    # --- Status value domains (the actual contract of this change) -------------

    RunStatus:
      description: >
        Run-level status. `awaiting_approval` already existed as a TERMINAL
        value from a closed `run` span's end payload; this change additionally
        makes it appear for an OPEN `run` span (see rule R2). Values are
        language-neutral and never translated. `null` for a state-only run
        outside the approval phases.
      oneOf:
        - type: "null"
        - type: string
          enum: [running, awaiting_approval, done, escalated]

    PhaseStatus:
      description: Status of a phase cell in the phase bar. `awaiting` is new (R3).
      type: string
      enum: [pending, active, awaiting, completed, failed]

    NodeStatus:
      description: >
        Status of a trace-tree node. `waiting` is new (R1); it is `null` for
        non-span nodes.
      oneOf:
        - type: "null"
        - type: string
          enum: [running, waiting, passed, failed, done]

  # --- Observable derivation rules & template behavior ------------------------
  # (Not OpenAPI schema; the binding behavioral contract both the code and the
  #  tests build against. No internal signature is implied.)
  x-behavior:
    R1_tree_waiting:
      applies_to: RunDetail.tree[*].status
      rule: >
        An OPEN (still-running) span whose event type is `ci.wait` or `gate`
        reports `waiting` instead of `running`. Any other open span (e.g.
        `agent.run`, codex spans) still reports `running`. A CLOSED
        `ci.wait`/`gate` span keeps its prior result (`gate` →
        `passed`/`failed`, otherwise `done`). The Timeline's existing
        `state: waiting|active` output is unchanged, and the same open
        `ci.wait`/`gate` span that the Timeline reports as waiting reports
        `waiting` in the tree — the two surfaces never disagree for the same
        span.

    R2_run_awaiting_approval:
      applies_to: [RunSummary.status, RunDetail.run.status]
      rule: >
        Event-log is authoritative when a trace exists. A run whose `run` span
        is OPEN (no matching `run` end) and whose most recent `approval` event
        is `event: awaited` with no later `event: granted` reports
        `awaiting_approval` instead of `running`. A later `granted` returns the
        still-open run to `running`. A CLOSED `run` span's status is unchanged
        (from its end payload: `done`/`escalated`/`awaiting_approval`); this
        derivation never alters a terminal result.
        Fallback WITHOUT a trace: a run whose state phase is `awaiting_approval`
        or `awaiting_spec_approval` reports `awaiting_approval`. With a trace,
        the event log wins — the state phase never overrides a later `granted`.
        A state-only run outside those two phases stays statusless (`null`),
        never a false `running` or `awaiting_approval`.
      cross_endpoint: >
        Both endpoints report the SAME status for the same run in the same
        existing `status` field.

    R3_phase_awaiting:
      applies_to: RunDetail.phases[*].status
      rule: >
        For a run paused at an approval gate, the waiting business phase reports
        `awaiting` instead of `active`:
        spec gate (`approval` event `gate: spec`; fallback state phase
        `awaiting_spec_approval`) → phase `spec`;
        plan gate (`approval` event `gate: plan`; fallback state phase
        `awaiting_approval`) → phase `plan`.
        The awaiting phase is not simultaneously `active`/`pending`/`completed`;
        no other phase is `active` at the same time; the other phases keep their
        previously derived states. After the matching `granted`, `awaiting`
        disappears and the bar follows the normal phase progression.
        `RunDetail.phases` retains its existing seven business-phase cells: no
        additional approval-phase cell appears in the response, and none is
        rendered by the phase bar.

    R4_presentation:
      rule: >
        `waiting` (tree node), `awaiting_approval` (run status) and `awaiting`
        (phase) are rendered visually distinguishable from `running`; the
        styling is additive — every existing status presentation remains.
        Labels for the newly visible states exist in English and German,
        semantically equivalent in both languages. `awaiting_approval` carries
        the strongest visual emphasis of all states (only state requiring human
        action). JSON status values stay language-neutral and untranslated.
      template_surfaces: >
        The run list's status column and the run-detail header both render the
        derived run status (R2): while a run awaits approval, BOTH surfaces
        show `awaiting_approval` with its label and the strongest visual
        emphasis; the phase bar renders the derived phase status (R3) and the
        trace tree renders the derived node status (R1). No markup, CSS
        selectors, or helper functions are prescribed.

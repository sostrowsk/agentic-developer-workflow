# Interface contract — Single-Lane project (`backend`).
#
# This feature has NO HTTP surface: it adds two configurable breakpoints that
# pause an ADW run via the EXISTING approval path. The contract therefore pins
# only the externally observable, non-HTTP surfaces (config, CLI exit + approve,
# persisted state field, event log):
#   1. The `breakpoints:` config key: the exactly-two allowed values, the empty
#      default, and that any other value is a config error that stops the run
#      from starting (C1_config).
#   2. The pause behavior: persisted phase `awaiting_approval`, process exit
#      code 2, continuation via `adw approve <run_id> --repo <path>`, and the two
#      boundaries at which each breakpoint pauses (C2_pause, C3_boundaries).
#   3. The new persisted state field `pending_breakpoint` (which breakpoint
#      waits) — NOT a new `Phase` value (C4_state).
#   4. The `approval` event with `gate` = breakpoint name and
#      `event` = awaited/granted, and the idempotency of holds (C5_event,
#      C6_idempotency).
#   5. The effect of `--no-approval` (`skip_approval`) on breakpoints
#      (C7_no_approval).
#
# It does NOT pin internal helper signatures, module layout, the order of
# orchestrator steps, or any dictionary/internal key. Implementation constraints
# (no new `Phase` literal — E3b, no second pause mechanism — E3, the untouched
# diff/snapshot/retention path) live in `.adw/plan.md` and its Definition of
# Done, not here. No existing route, phase value, or event type is added or
# removed; `breakpoints` (config), `pending_breakpoint` (state) and the two new
# `gate` values are the only observable additions.

openapi: 3.1.0
info:
  title: ADW Breakpoints — configurable holds as a generalized approval (delta only)
  version: 1.0.0

# No `paths`: the observable surfaces of this feature are the target-repo config,
# the CLI process contract, the persisted run state, and the event log — pinned
# below as schemas and as x-adw-behavior rules.

components:
  schemas:
    BreakpointName:
      description: >
        The closed, enumerated set of breakpoints. Exactly these two string
        values are allowed anywhere a breakpoint is named — the config list,
        the `pending_breakpoint` state field, and the `approval` event `gate`.
      type: string
      enum:
        - before_integration
        - before_push

    AdwConfigBreakpointsAddition:
      description: >
        The additive, OPTIONAL top-level `breakpoints:` key of
        `.adw/config.yaml`. This schema pins only this key; every existing
        config key keeps its current shape and meaning. Absent or empty →
        today's behavior, no extra holds (C1_config).
      type: object
      properties:
        breakpoints:
          description: >
            List of active breakpoints. Each element MUST be a `BreakpointName`.
            Default when the key is absent: the empty list. Any other value (an
            unknown string such as `after_round:2`, a typo, a wrong type such as
            a mapping or a boolean element) is a config error under the existing
            strict validation and the run does NOT start (C1_config). Element
            order and repetition carry no meaning: the breakpoints act as an
            enabled set, and no breakpoint holds more than once.
          type: array
          items:
            $ref: "#/components/schemas/BreakpointName"
      examples:
        - breakpoints: []
        - breakpoints: [before_integration]
        - breakpoints: [before_integration, before_push]

    RunStateBreakpointAddition:
      description: >
        Existing persisted run state (`.adw/runs/<run_id>/state.json`), plus one
        additive field `pending_breakpoint`. Every other state field keeps its
        current shape and meaning; the `phase` field's set of values is
        UNCHANGED (no new `Phase` literal — C4_state). The field persists across
        crash, `resume` and `approve`.
      type: object
      properties:
        pending_breakpoint:
          description: >
            Which breakpoint the run is currently waiting at, or null when it is
            not waiting at a breakpoint. Set exactly while the run is paused at a
            breakpoint (with `phase == "awaiting_approval"`); cleared on
            `approve`. Old states without the field load as null (C4_state).
          oneOf:
            - $ref: "#/components/schemas/BreakpointName"
            - type: "null"

    ApprovalGate:
      description: >
        The closed set of `approval` event gate names after this change. The
        existing gates keep the values `spec` and `plan`; the two breakpoint
        names are the only additions.
      type: string
      enum:
        - spec
        - plan
        - before_integration
        - before_push

    ApprovalEvent:
      description: >
        The existing `approval` event, now also emitted for breakpoints. Same
        shape as the existing `spec`/`plan` gate events; GUI and timeline render
        a breakpoint with no special case (C5_event).
      type: object
      additionalProperties: true
      required:
        - gate
        - event
      properties:
        gate:
          $ref: "#/components/schemas/ApprovalGate"
        event:
          description: >
            `awaited` when the run actually enters the wait; `granted` when the
            hold is released. Only actually-entered states are logged — no
            fabricated `awaited`/`granted` for a breakpoint the run did not wait
            at (C5_event).
          type: string
          enum:
            - awaited
            - granted

x-adw-behavior:
  C1_config:
    surface: ".adw/config.yaml — key `breakpoints`"
    rule: >
      `.adw/config.yaml` accepts an OPTIONAL top-level key `breakpoints` as a
      list. The only allowed elements are the two strings `before_integration`
      and `before_push`. When the key is absent or the list is empty, ADW
      behaves exactly as today: no additional holds arise, and the existing spec
      and plan approvals keep their phases, exit codes, CLI continuation and
      their `approval` events with gates `spec`/`plan`. Any other value — an
      unknown string (e.g. `after_round:2`), a typo, or a wrong type — is a
      config error with a clear message, consistent with the existing strict
      validation; the run does NOT start and the value is never silently
      ignored.

  C2_pause:
    surface: "adw run / adw resume — process contract"
    rule: >
      At an ACTIVE breakpoint the run pauses via the existing approval path: the
      persisted state phase is `awaiting_approval`, the process exits with code
      2, and the run continues with `adw approve <run_id> --repo <path>`. No new
      pause mechanism is introduced and no new `Phase` literal is added; which
      breakpoint waits is recorded solely in `pending_breakpoint`. `adw approve`
      on a run that is waiting at a breakpoint releases it and continues from
      exactly that point, without repeating already-completed phases. `adw
      approve` on a run that is NOT waiting for approval is a clean error with a
      clear message, without changing the run.

  C3_boundaries:
    rule: >
      Each active breakpoint pauses the run at most once, at a boundary defined
      by OBSERVABLE work:
        `before_integration` — pauses after all build lanes have passed their
          gates green, and before any integration/merge work or any subsequent
          review work has begun. In single-lane operation (no separate merge
          work) this means: after the build lane completes, before
          `codex_review` work begins.
        `before_push` — pauses after the final review completes and before ANY
          work of the CI phase begins: no push, no CI preparation (including the
          integration/E2E preparation that parallel mode performs at the start
          of the CI phase), and no forge/CI polling. At the hold nothing has
          been pushed. This holds for both single-lane and parallel
          orchestration, for both paths that reach the breakpoint.

  C4_state:
    surface: ".adw/runs/<run_id>/state.json — field `pending_breakpoint`"
    rule: >
      The waiting breakpoint is held in a dedicated state field
      `pending_breakpoint` with the value `before_integration` or `before_push`
      while the run is paused at that breakpoint, and null otherwise. The
      `Phase` set of values is NOT extended (E3b): the hold reuses
      `awaiting_approval`, so the phase bar, retention and the recovery card stay
      unchanged. The field is persisted and survives crash, `resume` and
      `approve`; an old state without the field reads as null.

  C5_event:
    surface: "event log — `approval` event"
    rule: >
      Every breakpoint is logged as an `approval` event: `gate` = the breakpoint
      name (`before_integration` or `before_push`), `event` = `awaited` when the
      wait is entered and `event` = `granted` on release — exactly the shape of
      the existing `spec`/`plan` gate events, so GUI and timeline render the
      breakpoint with no special case. Only actually-entered states are logged:
      no fabricated `awaited`/`granted` for a breakpoint the run did not wait at
      (in particular under `--no-approval`, or for a disabled or already granted
      breakpoint). Per actual entry into a breakpoint wait, exactly ONE logical
      `awaited` event ends up in the log — this holds even if the process
      crashes between persisting the waiting state and writing the event log
      (the missing event is caught up on the next `resume`), and a repeated
      `adw resume` of a run already waiting at an ungranted breakpoint still
      exits with code 2 but appends no duplicate `awaited` event. The GUI shows
      the waiting run and the recovery hint
      `adw approve <run_id> --repo <path>` as for the existing approval gates,
      with no new write path and no new phase value; the GUI stays read-only.

  C6_idempotency:
    rule: >
      A breakpoint that has been granted does not hold the run a second time —
      not even if the run then crashes and is continued with `adw resume`:
      `resume` after a granted release runs through without stopping again. An
      `adw resume` on a run waiting at a NOT-yet-granted breakpoint runs no work
      behind the breakpoint — the run stays in the waiting state, as with the
      existing approval gates. When both breakpoints are active, the run holds
      once at each in turn: after `before_integration` is granted it continues to
      `before_push` and holds there again with exit code 2; after that is granted
      it runs through. No breakpoint holds twice.

  C7_no_approval:
    surface: "adw run --no-approval / --gates"
    rule: >
      `--no-approval` (`skip_approval`, also when set via a `--gates` mode) ALSO
      skips the breakpoints: a run with this switch holds at no configured
      breakpoint. It is ONE switch for "no human approval in this run", not two
      separate ones. The skipping survives crash + resume, exactly as the
      existing `skip_approval` is pinned in the state, and it emits no fabricated
      breakpoint events (C5_event).

# Interface contract — Single-Lane project (`backend`).
#
# This contract pins ONLY the externally observable additions to the existing
# run-detail surfaces: per-node `context` and top-level `latest_context` in the
# JSON response of GET /api/runs/{repo}/{run_id}, their cutoff/null semantics
# (null instead of a fabricated 0), and the observable behavior of the read-only
# context panel on the existing run-detail page. It does NOT pin internal helper
# signatures, internal dictionary keys, unchanged response fields, concrete
# markup, CSS, or event schemas. No route or event is added or removed.

openapi: 3.1.0
info:
  title: ADW Run Inspector — node-time run context (delta only)
  version: 1.0.0

paths:
  /api/runs/{repo}/{run_id}:
    get:
      summary: Existing run-detail route — unchanged except two additive fields.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing run-detail object, now including `context` on every
            existing trace node and top-level `latest_context`. No new error
            surface: a run without a trace or without the relevant events
            yields 200 with null fields, never a 5xx.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailContextAdditions"

  /runs/{repo}/{run_id}:
    get:
      summary: Existing server-rendered run-detail page.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            Existing HTML run-detail page, with the read-only context field
            list and selection behavior pinned by P1_context_panel. Markup and
            CSS are not part of the contract.
          content:
            text/html: {}

components:
  schemas:
    RunContext:
      type: object
      description: >
        The fixed, read-only six-field run context at a given seq cutoff.
        Exactly these six keys — never more, never fewer. Every absent datum
        is null, never a fabricated 0.
      additionalProperties: false
      required:
        - phase
        - round
        - limit_hits
        - circuit_breakers
        - cost_usd
        - followups
      properties:
        phase:
          type:
            - string
            - "null"
          description: >
            Latest valid phase observation at or before the applicable cutoff
            (see C3_phase), or null when no such observation exists.
        round:
          oneOf:
            - $ref: "#/components/schemas/RoundContext"
            - type: "null"
          description: >
            Innermost recorded enclosing round (see C4_round), or null outside
            any recorded round.
        limit_hits:
          type:
            - integer
            - "null"
          minimum: 1
          description: >
            Count of `limit.hit` events recorded through the cutoff; null
            (never 0) when none has been recorded by then.
        circuit_breakers:
          type:
            - integer
            - "null"
          minimum: 1
          description: >
            Count of `circuit_breaker` events recorded through the cutoff;
            null (never 0) when none has been recorded by then.
        cost_usd:
          type:
            - number
            - "null"
          description: >
            Cumulative USD cost recorded by completed `agent.run` events
            through the cutoff; null (never 0) when no usable cost value has
            been recorded by then. Invalid values are not invented as cost.
        followups:
          type:
            - integer
            - "null"
          minimum: 1
          description: >
            Count of `followup` events recorded through the cutoff; null
            (never 0) when none has been recorded by then.

    RoundContext:
      type: object
      additionalProperties: false
      required:
        - loop
        - n
        - cap
      properties:
        loop:
          type:
            - string
            - "null"
        n:
          type:
            - integer
            - "null"
        cap:
          type:
            - integer
            - "null"
      description: >
        Exactly the recorded `{loop, n, cap}` values of the applicable round.
        Missing individual values remain null and are never filled in,
        estimated, or inferred.

    TraceNodeContextAddition:
      type: object
      description: >
        Existing trace-node object at ANY depth of the tree. This schema pins
        only the new `context` property and the recursion through the existing
        `children` collection; all other existing node properties (including
        `seq`/`end_seq`) retain their current shape and meaning. Every trace
        node, at every nesting level, carries a `context`.
      required:
        - context
      properties:
        context:
          $ref: "#/components/schemas/RunContext"
        children:
          type: array
          description: >
            Existing child collection (present on span nodes; other child
            fields remain unconstrained). Each child is itself a trace node
            and therefore carries its own `context`.
          items:
            $ref: "#/components/schemas/TraceNodeContextAddition"

    RunDetailContextAdditions:
      type: object
      description: >
        Existing run-detail object. This schema pins only top-level
        `latest_context` and the `context` addition on every existing node in
        `tree`; all other properties retain their current shape and meaning.
        `latest_context` is present on every 200 response, INCLUDING a run
        with no trace (then all six fields are null).
      required:
        - tree
        - latest_context
      properties:
        tree:
          type: array
          items:
            $ref: "#/components/schemas/TraceNodeContextAddition"
        latest_context:
          $ref: "#/components/schemas/RunContext"

x-behavior:
  C1_node_cutoff:
    rule: >
      Every existing trace node has exactly one `context`. For a point-event
      node, the cutoff is that event's `seq`. For a span node, the cutoff is
      the node's already exposed `end_seq` (subtree maximum); for a running
      span this is the highest seq observed so far in its subtree. Only events
      with `seq` less than or equal to the cutoff participate — a span context
      thus includes qualifying events inside the span after its start but
      excludes later events. Changing node selection exposes the selected
      node's historical context (time travel).

  C2_latest_cutoff:
    rule: >
      Top-level `latest_context` is derived from all events through the
      greatest observed `seq`. Existing live-update mechanisms refresh it; the
      SSE protocol is unchanged.

  C3_phase:
    rule: >
      `phase` is derived from exactly two existing sources: a non-empty `name`
      in a `phase` span's start payload, and a non-empty `phase` in a
      `state.saved` event payload; empty or absent values are not
      observations. The valid observation with the greatest event `seq` at or
      before the cutoff wins (seqs are unique — no tie). `state.saved` is
      interpreted only according to its existing `{seq, phase}` payload and is
      neither treated as a state dump nor extended. If no valid observation
      exists, `phase` is null.

  C4_round:
    node_context: >
      If a node lies inside a recorded `round` span, or is itself that round
      node, `round` contains the nearest enclosing round's recorded
      `{loop, n, cap}` values. Outside any recorded round it is null.
    latest_context: >
      For `latest_context`, `round` is the innermost recorded round whose span
      contains the event with the greatest `seq`. The round's start and end
      events count as contained, so a just-starting or just-ending round is
      still shown; once the latest event is outside every round (e.g. after
      its end), `round` is null.
    missing_values: >
      Missing individual round values remain null and are never completed,
      estimated, or inferred.

  C5_counts_and_cost:
    rule: >
      `limit_hits`, `circuit_breakers`, and `followups` count, respectively,
      recorded `limit.hit`, `circuit_breaker`, and `followup` events through
      the applicable cutoff. A count is null, never zero, if no event of its
      type has been recorded by that cutoff. `cost_usd` is the cumulative
      USD cost recorded by completed `agent.run` events through the cutoff.
      If no usable cost value has been recorded by then, `cost_usd` is null;
      invalid values do not create a cost.

  C6_empty_or_incomplete_trace:
    rule: >
      A run without a trace has no trace nodes, no synthetic node, and no
      top-level field named `context`. It still has `latest_context`, with
      exactly the six required fields all null, and never fails with HTTP 5xx.
      Missing event types or incomplete payloads leave only the affected
      fields null rather than creating zero values or an error.

  P1_context_panel:
    surface: "GET /runs/{repo}/{run_id} (HTML run detail)"
    rule: >
      Beside the existing detail pane, the page displays a read-only fixed
      field list for `phase`, `round`, `limit_hits`, `circuit_breakers`,
      `cost_usd`, and `followups` — a field list only, no chart or curve.
      Selecting a trace node displays that node's complete `context`; changing
      the selection updates every field (time travel). With no node selected,
      the panel displays `latest_context`, including during a live run. Null
      fields are rendered empty — never as numeric zero or an inferred value.
      Existing detail-pane tabs keep their content and behavior. Concrete
      markup and CSS are not prescribed.

  unchanged_surfaces:
    rule: >
      Existing response fields and routes retain their semantics; no route is
      added or removed. The SSE protocol and the event schemas are unchanged.
      Timeline, Artifacts, Raw, and Diff keep their content and behavior. The
      panel offers no configurable field set and no selection persistence.

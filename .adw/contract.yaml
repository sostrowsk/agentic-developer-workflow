# Contract — R4: ADW liest das CI-Ergebnis richtig (Single-Lane).
# Bindet nur extern beobachtbares Phase-7-Verhalten: done/Eskalation, Meldungen,
# bestehendes ci.wait-End-Payload. Keine HTTP-Routen, Templates oder neuen Event-Typen.
# Interne Helper-Signaturen (poll_until, _evaluate, _jobs, _failed_logs, ...) sind kein Contract.
version: 1
scope: phase7-ci
workstreams: [backend]

phase_7:
  github:
    workflow_runs:
      green_conclusions: [success, skipped, neutral]   # unverändert, nur für Runs
      subsequent_pages: >-
        Runs auf Folgeseiten zählen gleichwertig: ein roter Run macht das Ergebnis rot,
        ein laufender Run verhindert den vorzeitigen Abschluss.
    staging_job:
      applies_when: ci.staging_job ist konfiguriert
      matching: exakte Gleichheit des Jobnamens (Jobs auf Folgeseiten zählen mit)
      green_only_if: conclusion == "success"
      not_green_includes: [skipped, neutral]
      on_not_green: wie roter Staging-Job heute (Log-Auszug der Runs, kein done)
    pagination:
      collections: [workflow_runs, jobs_per_run]
      filters: head_sha bzw. branch bleiben auf jeder Seite erhalten
      max_pages: 10
      on_limit_exceeded:
        outcome: escalated
        message_prefix: "CI-Monitoring fehlgeschlagen: "
        message_requirement: nennt das Seitenlimit; kein done aus Teildaten
    log_evidence:
      usable: Log-Inhalt ist nach strip() nicht leer
      empty_or_whitespace_log: Run trägt nichts bei (keine Überschrift)
      log_fetch_error: Run wird übersprungen, übrige rote Runs werden gesammelt, poll_ci scheitert nicht
      all_empty:
        excerpt: ""
        condition: rotes Ergebnis, Re-Entry-Budget noch nicht verbraucht
        outcome: escalated
        message: "Pipeline rot ohne verwertbare Job-Logs (Pipeline <ID>) — Mensch übernimmt"
        log_analyst: false
        reentry: false

  timeout:
    providers: [github, gitlab]
    budget: ci.timeout
    measurement: monotone Deadline ab Beginn des Wartens (Fetch + Auswertung + Schlaf)
    sleep_cap: jede Schlafdauer ist auf die unmittelbar davor verbleibende Restzeit begrenzt
    non_final_after_deadline:
      outcome: escalated
      message_prefix: "CI-Timeout: "
      further_fetch: false
      further_sleep: false
    final_after_deadline: wird ausgewertet, nicht als Timeout gemeldet
    running_cli_call: wird nicht hart abgebrochen; _CLI_TIMEOUT (120 s) bleibt der Backstop

  gitlab_manual:
    trigger: Pipeline-Status manual
    final: true
    outcome: escalated
    message_with_job: "Pipeline wartet auf einen manuellen Job (<Name>) — Mensch übernimmt"
    message_without_job: "Pipeline wartet auf einen manuellen Job — Mensch übernimmt"
    job_name: aus einem Pipeline-Job mit Status manual, soweit ermittelbar
    permitted_prefix: "CI-Monitoring fehlgeschlagen: "   # falls über den bestehenden CiError-Handler
    further_polling: false
    timeout_message: false
    log_analyst: false
    reentry: false

events:
  ci.wait:
    kind: end
    payload:
      status: {type: string, description: bestehender Ergebnisstatus; bei Timeout "timeout"}
      polls: {type: integer, description: Anzahl der abgeschlossenen Fetches (unverändert)}
      duration:
        type: number
        unit: seconds
        description: >-
          Mit der monotonen Uhr gemessene Gesamtzeit bis zum Verlassen der Spanne
          (Fetches, Auswertung, Schlafen), auch bei Timeout oder Eskalation.
          Feldname bleibt duration.
    compatibility: Event-Hülle, ci.poll-Punkte und übrige Event-Strukturen unverändert

files:
  CHANGELOG.md: "## [0.36.2] — Unreleased / ### Fixed (je ein Eintrag C19–C23)"
  CHANGELOG.de.md: inhaltlich synchron zu CHANGELOG.md
  pyproject.toml: version bleibt 0.36.1

preserved:
  - Phase-7-Ablauf (Push, Polling, Log-Analyst, höchstens ein Re-Entry, dann Mensch); Ausnahme nur gitlab_manual
  - SHA-Bindung des Pollings an den gepushten Commit
  - Bedeutung und Defaults von ci.timeout, ci.poll_interval, ci.staging_job
  - bestehende GitLab-Jobs-Pagination und Forge-Erkennung

# Interface contract — W1: Jeder Agent-Lauf hat eine Grenze, jeder Abbruch eine Ursache
#
# Single-Lane-Projekt (nur `backend`, siehe .adw/config.yaml). Gemäß Spec
# („Contract (Single-Lane, nur extern beobachtbare Flächen)") pinnt dieser
# Contract ausschließlich:
#   1. das `agent.run`-Start-Payload (zwei neue Felder),
#   2. das `agent.run`-End-Payload bei Grenz-/Ursachen-Abbruch,
#   3. die Ursachen-Meldungstexte,
#   4. das CLI-Verhalten bei AgentRunError und bei git-Fehlern in context._git.
#
# NICHT Teil des Contracts: interne Helfer und ihre Signaturen (`_collect`,
# `_collect_into`, Meldungs-/Payload-Helfer, `context._git`), die Grenzwerte
# je Agent (bindend über .adw/spec.md Scope 1 / Issue E1, aber keine
# Vertragsfläche), Ausnahmeklassen. Keine HTTP-Routen, keine neuen Event-Typen.

version: 1
scope: W1
workstreams:
  - backend

events:
  agent.run:
    start:
      added_fields:
        max_turns: {type: integer, required: true, source: AgentSpec.max_turns}
        timeout_s: {type: integer, required: true, source: AgentSpec.timeout_s}
      existing_fields: unchanged  # agent, model, tools, allowed_tools, cwd, resume_session, prompt, system_append
      applies_to: [real runner, mock runner]
    end:
      on_cause_abort:
        triggers: [timeout, max_turns, sdk_exception]
        emitted: true
        is_error: true
        added_fields:
          error: {type: string, required: true, value: identisch mit der AgentRunError-Meldung}
        existing_fields: unchanged  # session_id, result_text, usage, cost_usd, is_error
        partial_data: bereits gemeldete session_id sowie bis dahin bekannte usage/cost_usd bleiben erhalten (keine leeren Defaults)
      otherwise: unchanged

messages:
  timeout: "<agent>: Zeitlimit <timeout_s> s überschritten"
  max_turns: "<agent>: max_turns <n> erreicht"   # n = max_turns des Agents
  sdk_exception: "<ExceptionTypeName>: <exception text>"  # Typname und Text der Ursache; bestehende AgentRunError-Meldung unverändert
  codex_code_review:
    contains: [Ursache des CodexError, einschließlich Codex-Timeout]
  git_execution:
    applies_to: context._git   # nur dieser Helfer
    contains: [ausgeführtes git-Kommando, Ursache]

cli:
  agent_run_error:
    triggers: [timeout, max_turns, sdk_exception, codex_error_in_code_review]
    stream: stderr
    message: |-
      Agent-Lauf abgebrochen (z. B. Plan-Limit erschöpft): <Ursache>
      Der Run <run_id> bleibt in Phase '<phase>' — später fortsetzen mit: adw resume <run_id>
    exit_code: 1
    traceback: false
    escalation_md_created: false
    phase_changed: false        # insbesondere nicht `escalated`
    resumable: true             # zuvor gemeldete session_id wird fortgesetzt
    automatic_retry: false
  git_error_in_orchestrator:
    triggers: [subprocess.TimeoutExpired, OSError]  # nur context._git
    stream: stderr
    message: |-
      Eskalation: <Ursache>
      Report: .adw/runs/<run_id>/escalation.md
    cause_contains: [git-Kommando, Ursache]
    exit_code: 1
    traceback: false
    escalation_md_created: true
    phase: escalated

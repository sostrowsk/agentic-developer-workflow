# Interface contract — R5 (Single-Lane). Nur extern beobachtbare Flächen;
# interne Helper-Signaturen (record_triage, abort-Event, Puffer-Locks) sind kein Contract.
version: 1
scope: r5-cli-escalation
workstreams:
  - backend

cli:
  run_parallel_invalid:
    command: "adw run --parallel"
    condition: Die geladene Config ist nicht parallelfähig (config.is_parallel_capable ist false).
    exit_code: 1
    message:
      required: true
      semantics: Erklärt, dass --parallel mit der konfigurierten Lane-Auswahl nicht möglich ist.
      exact_wording: nicht festgelegt
    effects:
      new_run_directory: false
      persisted_escalated_run: false

  prune_negative_older_than:
    command: "adw runs prune --older-than <n>"
    condition: n < 0
    exit_code: 2
    message:
      stream: stderr
      required: true
      semantics: Benennt --older-than und den zulässigen Wertebereich (n >= 0).
      style: Wie die vorhandene Fehlermeldung zu --keep.
      exact_wording: nicht festgelegt
    effects:
      run_data_modified: false

artifacts:
  escalation.md:
    location: Im jeweiligen Run-Verzeichnis.
    first_escalation:
      behavior: Datei nur anlegen, wenn sie noch nicht existiert.
      format: Unverändert gegenüber 0.36.2 (Titel, Issue, Phase, Lanes).
      reason_heading: "## Grund"
      reason: Der erste Eskalationsgrund steht unter dieser Überschrift.
    subsequent_escalations:
      behavior: Pro weiterer Eskalation einen Abschnitt anhängen.
      preserve_existing_content: true
      heading_template: "## Weitere Eskalation (<Lane/Phase>)"
      heading_context: "<Lane/Phase> bezeichnet die Herkunft der weiteren Eskalation."
      body: Der Grund dieser weiteren Eskalation.
      separation: Leerzeile vor der neuen Abschnittsüberschrift und vor ihrem Grund.
    concurrent_escalations: Kein bereits geschriebener Grund wird überschrieben oder geht verloren.
    ledger_reason: Weiterhin der erste Absatz unter "## Grund" (der erste Grund).

events:
  escalation:
    emitted: Genau einmal pro tatsächlicher Eskalation, auch für jede weitere.
    not_emitted: Für eine Lane, die nur wegen des Abbruchsignals zurückkehrt.
  triage.decision:
    emitted: Genau einmal pro Finding des finalen Reviews (kein zweites Event aus dem Fix-Dispatch).

# Interface contract — Snapshots + Instrumentierungs-Nachzügler
#
# Single-Lane-Projekt (nur Workstream "backend"): kein HTTP, keine zweite
# Lane. Gepinnt wird AUSSCHLIESSLICH die extern beobachtbare Flaeche:
# die oeffentliche API von adw/snapshots.py, das Ref-Namensschema, die
# snapshot-Events an den vier Punkten sowie — fuer Aufgabe B — die im
# Dry-Run wie im Echt-Lauf beobachtbare agent.run/codex.review-Span-Flaeche
# nach GUI-SPEC §4.4 (Spec-ACs 2–4). Interne Helper-Signaturen und
# Mechanik-Details (Index-Handhabung, Reihenfolge der git-Kommandos, wie das
# Span-Handle an die Runner gereicht wird, Signatur des argv-Builders) sind
# NICHT Bestandteil des Kontrakts.

version: 1

scope:
  workstreams:
    - backend
  externally_observable_surfaces:
    - public_snapshot_api
    - snapshot_refs
    - snapshot_events
    - instrumentation_span_events

public_snapshot_api:
  module: adw.snapshots
  callable: capture
  signature: "capture(ctx, worktree, label)"
  params:
    ctx: "RunContext (traegt u. a. emitter, state.run_id, git-Umgebung)"
    worktree: "Path — der zu snapshottende Lane-Worktree"
    label: "str — einer von: before_agent | after_agent | after_gates | red"
  returns: "None"
  raises: "nie (fail-open) — jeder Fehler unterbleibt still mit einer Warnung"
  behavior:
    success:
      - "Der Worktree-Stand wird ueber ein Tree-Objekt als Git-Commit
         festgehalten; realer Index, Worktree-Dateien, aktueller Branch und
         HEAD bleiben unveraendert."
      - "Eine frische Ref refs/adw/<run_id>/<seq> wird gesetzt."
      - "Genau ein snapshot-Event wird emittiert."
    failure:
      - "Fehler vor oder beim Setzen der Ref (scheiterndes git-Kommando):
         keine Ref, kein snapshot-Event."
      - "Fehler des Event-Appends NACH erfolgreich gesetzter Ref: fail-open
         wie beim Emitter — die Ref bleibt als nutzbarer Snapshot bestehen,
         kein Rollback, keine Recovery-Mechanik."
      - "In jedem Fehlerfall eine Warnung; der Lauf und seine fachliche
         Exception-Semantik bleiben unveraendert (keine verdeckte/ersetzte
         Exception)."

snapshot_refs:
  pattern: "refs/adw/<run_id>/<seq>"
  target: git_commit
  commit:
    tree: "vollstaendiger Worktree-Stand einschliesslich untracked, ohne
           ignored Dateien"
    parent: "<base_sha> — der fuer die Lane gepinnte Fork-Point"
    message: "adw snapshot <label>"
  invariants:
    - "Nach jedem erfolgreichen Snapshot existiert die Ref und zeigt auf
       dessen Commit; die Ref haelt die Objekte gegen git gc am Leben."
    - "<seq> unterscheidet die Snapshots eines Laufs eindeutig."
    - "Bereits vorhandene Refs desselben Laufs werden niemals ueberschrieben,
       auch nicht nach resume in einem neuen Prozess (frische Sequenzen)."
  not_pinned:
    - "Interne Ermittlung von <seq> (Ableitung aus vorhandenen Refs)."
    - "Reihenfolge/Wortlaut der git-Kommandos und die Index-Handhabung."

snapshot_events:
  snapshot:
    kind: point
    payload:
      lane:
        type: string
        description: "Name der Build-Lane."
      tree:
        type: string
        description: "SHA des erzeugten Tree-Objekts."
      ref:
        type: string
        pattern: "^refs/adw/[^/]+/[^/]+$"
        description: "Die fuer diesen Snapshot gesetzte Ref."
      label:
        type: string
        enum:
          - before_agent
          - after_agent
          - after_gates
          - red
    invariants:
      - "Genau ein snapshot-Event pro erfolgreichem Snapshot (vorbehaltlich
         der fail-open-Emitter-Semantik: ein fehlschlagender Event-Append
         laesst die bereits gesetzte Ref bestehen, siehe
         public_snapshot_api.behavior.failure)."
      - "tree und ref entsprechen dem erzeugten Tree bzw. der gesetzten Ref."
      - "Ein vor oder beim Setzen der Ref fehlgeschlagener Snapshot
         emittiert kein Event."
    occurrence:
      before_agent: "Unmittelbar vor jedem Agent-Lauf der Build-Lane
                     (Gate-Loop in _run_lane, _run_test_only_pass)."
      after_agent: "Unmittelbar nach jedem NORMAL zurueckkehrenden Agent-Lauf
                    der Build-Lane; entfaellt bei Agent-Exception, der
                    before_agent-Snapshot bleibt erhalten (AC 10)."
      red: "Nach dem TDD-RED-Test-only-Lauf."
      after_gates: "Nach jeder Gate-Iteration, unabhaengig vom Gate-Ausgang."
    exclusions:
      - "Keine snapshot-Events fuer Agent-Laeufe der Authoring-/Review-Phasen."
      - "Keine snapshot-Events an anderen Schrittgrenzen als den vier aus
         GUI-SPEC §5."

# --- Aufgabe B: agent.run/codex.review-Spans (GUI-SPEC §4.4) ----------------
# Die Spans liegen an der Aufrufstelle in phases.py (nicht mehr im Runner)
# und erscheinen daher auch im Dry-Run (Mock-Runner). Payload-Schema
# unveraendert gegenueber §4.4 — hier gepinnt, weil das Erscheinen im
# Dry-Run neue, extern beobachtbare Flaeche ist. Wie das Handle an die
# Runner gereicht wird und wie das argv gebaut wird, ist Mechanik.
instrumentation_span_events:
  agent.run:
    kind: span
    start_payload:  # an der Aufrufstelle bekannt — auch im Dry-Run Pflicht
      - agent
      - model
      - tools          # list
      - allowed_tools  # list
      - cwd
      - resume_session
      - prompt
      - system_append
    end_payload:    # tatsaechlich zurueckgegebene Ergebnisfelder — auch im Dry-Run Pflicht
      - session_id
      - result_text
      - is_error
    runner_only:    # NUR bei echten Laeufen; im Dry-Run zu Recht abwesend
      - usage
      - cost_usd
      - "agent.message / agent.tool.call / agent.tool.result (Stream, Point-Events)"
    invariants:
      - "Jede ctx.agents.run(...)-Aufrufstelle in phases.py ist von genau
         einem agent.run-Span umschlossen — Mock- wie Echt-Runner."
      - "Start- und End-Event eines Spans tragen dieselbe Span-ID."
      - "Ein Dry-Run enthaelt mindestens einen vollstaendig geschlossenen
         agent.run-Span (start + end, gleiche Span-ID)."
      - "Im Dry-Run werden keine Stream-Events und keine synthetischen
         Usage-/Kostenwerte erfunden."
  codex.review:
    kind: span
    start_payload:  # an der Aufrufstelle bekannt — auch im Dry-Run Pflicht
      - kind
      - argv          # list — das vollstaendige, vom Runner tatsaechlich ausgefuehrte argv
      - cwd
      - custom_prompt
    end_payload:    # tatsaechlich zurueckgegebene Ergebnisfelder — auch im Dry-Run Pflicht
      - findings
      - raw_stdout
      - parse_ok
    invariants:
      - "Jede ctx.codex.review(...)-Aufrufstelle in phases.py ist von genau
         einem codex.review-Span umschlossen — Mock- wie Echt-Runner."
      - "Start- und End-Event eines Spans tragen dieselbe Span-ID."
      - "Ein Dry-Run enthaelt mindestens einen vollstaendig geschlossenen
         codex.review-Span (start + end, gleiche Span-ID)."
      - "argv liegt vollstaendig im Start-Event (kein nachtraegliches
         Befuellen); beim Echt-Lauf identisch mit dem ausgefuehrten argv."
    exclusions:
      - "ctx.codex.author(...) erhaelt KEINEN Span — §4.4 kennt keinen
         author-Event-Typ; AC 4 nennt nur agent.run und codex.review."

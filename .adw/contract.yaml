openapi: 3.1.0
info:
  title: ADW Read-only GUI — response time (bounded DOM, supersession, adw:artifact)
  version: 8.0.0
  description: |
    Minimal external contract for the single backend workstream of this run.
    Per the issue's contract note, exactly three externally observable surfaces
    are pinned:
      (1) the bound on materialised entry nodes and the reachability of every
          entry (A1/A2/A3);
      (2) the supersession behaviour of node selection (B1/B2);
      (3) the names and observable completion semantics of the three
          performance measures adw:select, adw:tab, adw:artifact.
    Nothing else is pinned. In particular, verification and documentation
    policy — fixture sizes and shapes, counting selectors and marker strategy,
    what the guide documents, which tests exist and what they navigate to —
    lives exclusively in the spec and plan, as do implementation technique,
    tooling, dependency and packaging constraints, and the unchanged
    pre-existing routes. This run adds no new HTTP route.

servers:
  - url: http://127.0.0.1:8765

paths: {}

x-adw-scope:
  workstreams:
    - backend
  surfaces:
    - template_behavior
    - dom_state
    - performance_user_timing

# --- (1) Bounded entry-node DOM and reachability --------------------------------
x-adw-bounded-rendering:
  scope: run detail view
  pinned:
    entry_node_bound:
      rule: "The number of entry nodes materialised in the DOM is bounded by a
        hard cap of AT MOST 200 per collection, independent of the total number
        of entries in the collection. The cap is global per collection over the
        complete document — not per subtree, per sibling group or per pane —
        and for tool entries it covers every tool entry present anywhere in the
        detail-pane DOM, including hidden/non-active panes."
      cap_max: 200
      holds: "On initial render AND throughout navigation (after paging,
        scrolling, expansion or jumping); the bound is not an
        initial-render-only property."
    reachability:
      rule: "Every trace-tree entry and every tool entry remains reachable
        through the existing views, including entries outside the currently
        materialised subset. Reaching an entry brings it into the DOM and it
        renders correctly; reaching any entry does not require materialising
        all preceding entries; no entry is dropped or made permanently
        unreachable."
    presentation_fidelity:
      rule: "Bounded rendering changes presentation only: displayed entries
        appear in the underlying order, displayed content is not truncated or
        reordered relative to the data served — tool entries keep their
        call/result identity — and the complete payload of every entry stays
        reachable."
  not_pinned:
    - "The choice of windowing vs. paging vs. expand-on-demand and every other
       mechanism or markup detail."
    - "How the bound is counted or evidenced (markers, selectors, fixture sizes,
       navigation test scenarios, guide documentation) — verification policy in
       the spec and plan."

# --- (2) Latest-interaction-wins / supersession ---------------------------------
x-adw-supersession:
  scope: node selection and its asynchronously loaded detail content
  pinned:
    correct_final_content:
      rule: "Given a quick succession of two node selections (A then B), the detail
        pane ends showing node B's content. A superseded selection's late-returning
        fetch does NOT write its content into the DOM while a newer node is
        selected (B1). This holds whether the supersession happens before or
        after the earlier selection's fetch was dispatched."
    no_measure_for_superseded:
      rule: "A superseded interaction records no end mark and produces NO measure;
        only the winning (latest) interaction is measured. Start and end marks from
        different selections are never paired into one measure (B2)."
  not_pinned:
    - "The internal cancellation/generation strategy; cancellation is not a
       separately exposed product state or interface. The only observable
       requirement is that obsolete results have no observable effect."

# --- (3) The three performance measure names and completion outcomes -------------
x-adw-measures:
  completion_semantics:
    rule: "Each measure's end mark is recorded only once the interaction is
      observably complete: the resulting content is in the DOM AND the browser
      has painted it."
    async_content_counts: "Asynchronously fetched content counts toward the
      measure: a loading indicator, request dispatch or response arrival is not
      completion."
  measures:
    node_selection:
      start_mark: "adw:select:start"
      end_mark: "adw:select:end"
      measure: "adw:select"
      completes_when: "The detail pane for the selected node is painted."
    tab_switch:
      start_mark: "adw:tab:start"
      end_mark: "adw:tab:end"
      measure: "adw:tab"
      completes_when: "The target tab's content is painted."
    artifact_open:
      start_mark: "adw:artifact:start"
      end_mark: "adw:artifact:end"
      measure: "adw:artifact"
      completes_when: "The opened artifact's content is painted."
      note: "New in this run. If the artifact display is bounded, the complete
        artifact content stays reachable."
  not_pinned:
    - "The internal completion technique (e.g. the rAF -> task construction) —
       an implementation requirement stated in the plan, not contract surface."
    - "Thresholds, measurement procedure and evidence recording — verification
       policy in the spec, plan and guide."

# Contract — W15.1 (Single-Lane: backend)
# Pinnt nur extern beobachtbare Flächen. Interne Signaturen (_brief, _commit, ...) sind frei.
# Keine HTTP-Routen, keine neuen Events, keine Schema-Änderungen.
version: 1
workstreams: [backend]

cli:
  command: adw improve
  unchanged: [flags, exit_codes, stdout_lines, brief_conditions]  # --no-brief, BRIEF_CAUSES, MIN_RUNS

agent_answer:
  role: improve_agent
  format: markdown            # kein JSON; Auftrag (_brief) und Rollentext (agents.py) verlangen das ausdrücklich
  first_line: "H1 heading = brief title"
  outer_fence: >-
    Höchstens ein einzelner umschließender ```markdown … ```-Block wird toleriert und
    entfernt (nur wenn er die gesamte getrimmte Antwort umschließt); keine rekursive
    Entpackung, innere Codeblöcke bleiben.
  required_headings: [Ausgangslage, Aufgabe, Vorentscheidungen, Deferred, Akzeptanzkriterien]
  headings_check: unchanged   # _missing_headings inkl. Ausschluss von Überschriften in Codeblöcken

ledger_files:                 # <week> = <Jahr>-W<zweistellige ISO-Woche>, wie bisher
  root: "<ledger>/reports"
  report: "<week>.md"
  brief: "<week>-brief.md"
  rejected: "<week>-brief.rejected.md"

outcomes:
  accepted:
    brief_file: "Brief ohne äußeren Codeblock"
    rejected_file: removed    # lokal und im committeten Stand
    report_note: "Brief-Entwurf (<cause>): <H1-Titel>"   # Titelaufbereitung wie bisher (_cut)
  rejected:                   # Gründe: fehlende H1, fehlende Pflichtüberschrift(en)
    brief_file: absent        # ein veralteter Brief derselben Woche wird wie bisher entfernt
    rejected_file: "Rohantwort unverändert (inkl. etwaigem äußeren Codeblock und Zeilenumbrüchen)"
    report_note: "beginnt mit 'Brief-Entwurf verworfen: ', nennt Grund und Dateiname <week>-brief.rejected.md"
  agent_exception:            # keine Antwort (Exception/Timeout)
    brief_file: absent
    rejected_file: not_written
    report_note: unchanged    # "Brief-Entwurf verworfen: <Typ>: <exc>"
    retry: false

commit:
  message: "improve <week>"   # unverändert
  includes: [report, brief, rejected]   # Hinzufügen und Entfernen im selben Commit
  error_behavior: unchanged   # Warnung, Artefakte bleiben lokal; Push wie heute

retro_task:
  function: adw.retro._task (Text)
  must_state:
    - "seq:<n> = Top-Level-Feld seq des Event-Records (Zeile in events.jsonl beginnt mit {\"seq\": <n>, …)"
    - "seq-Werte in einer payload (z. B. state.saved) sind keine Belege"
  evidence_check: unchanged   # _SEQ, _event_seqs, _valid_evidence

changelog:
  files: [CHANGELOG.md, CHANGELOG.de.md]
  section: "## [0.37.1] — Unreleased / ### Fixed"
  pyproject_version: "0.37.0"

openapi: 3.1.0
info:
  title: ADW CLI — der `--gates`-Schalter für die Freigabe-Gates
  version: 1.0.0
  description: |
    Minimaler externer Vertrag für den einzelnen Workstream backend.
    Dies ist ein CLI-Feature: es gibt KEINE HTTP-Oberfläche, `paths` ist
    leer; die gepinnte Fläche liegt in den `x-adw-*`-Erweiterungen.

    Gemäß Contract-Hinweis des Issues werden genau diese extern
    beobachtbaren Flächen gepinnt:
      (1) die vier zulässigen `--gates`-Werte und ihre Haltepunkte;
      (2) der Default `plan`;
      (3) die drei Altflag-Alias-Äquivalenzen;
      (4) die Ablehnung von Widerspruch und ungültigem Wert —
          Nichtnull-Exit, kein persistenter Run;
      (5) die Zusage, dass bestehende Run-States unverändert resumier-
          und approvebar bleiben.

    Nicht gepinnt sind insbesondere: der Meldungswortlaut (jenseits von
    "klare Meldung vorhanden; beim ungültigen Wert nennt sie die vier
    zulässigen Werte"), die interne State-Abbildung (bestehende Felder
    wiederverwenden vs. eigenes Feld), Helper-Signaturen, der genaue
    Wortlaut der Start-Ausgabe sowie Testanzahl und Fixtures. Dieses
    Vorhaben fügt keine HTTP-Route, kein Event und keinen Config-Key hinzu.

servers: []

paths: {}

x-adw-scope:
  workstreams:
    - backend
  surfaces:
    - cli_option
    - cli_exit_code
    - cli_stdout
    - run_state_compat
  added_http_routes: []
  added_events: []

x-adw-cli:
  command: adw run
  options:
    gates:
      spelling: "--gates <modus>"
      allowed_values:
        - none
        - spec
        - plan
        - both
      implicit_default: plan
    legacy:
      no_approval:
        spelling: "--no-approval"
        status: supported
        deprecated: false
      spec_approval:
        spelling: "--spec-approval"
        status: supported
        deprecated: false

  modes:
    none:
      spec_gate: false
      plan_gate: false
      successful_run:
        final_state: done
        exit_code: 0
      escalation_exit_code: 1
      note: "Läuft durch bis done; das Einzige, was ihn anhält, ist eine
        Eskalation."
    spec:
      spec_gate: true
      plan_gate: false
      note: "Stopp nach der Spec, vor dem Plan; nach der Spec-Freigabe KEIN
        Halt am Plan-Gate."
    plan:
      spec_gate: false
      plan_gate: true
      note: "Stopp nur vor dem Build. Default — beobachtbar identisch zum
        heutigen `adw run` ohne Flags."
    both:
      spec_gate: true
      plan_gate: true
      note: "Stopp zuerst nach der Spec und nach deren Freigabe erneut vor
        dem Build."

  legacy_resolution:
    rule: |
      Sobald mindestens ein Altflag angegeben ist, wird die vollständige
      Kombination beider Altflags ausgewertet; ein nicht angegebenes
      Altflag zählt als nicht gesetzt. Keine Altflag-Kombination löst zu
      `plan` auf — `plan` ist nur über `--gates plan` oder gar kein Flag
      erreichbar.
    map:
      neither: plan
      "--no-approval": none
      "--spec-approval": both
      "--no-approval --spec-approval": spec
    alias_equivalence: |
      Jeder Altflag-Aufruf ist beobachtbar äquivalent zu dem `--gates`-
      Modus, auf den er abbildet: erreichte Gate-Zustände und weiterer
      Laufverlauf stimmen überein. Für bestehende Altflag-Aufrufe ändert
      sich nichts.

  mixed_option_validation:
    rule: |
      Ist `--gates` zusammen mit mindestens einem Altflag angegeben, ist
      der Aufruf genau dann gültig, wenn der explizite Wert dem durch die
      vollständige Altflag-Kombination aufgelösten Modus entspricht.
      Andernfalls Ablehnung mit Nichtnull-Exit und klarer Meldung, BEVOR
      ein Run angelegt oder persistenter Run-State geschrieben wird —
      reihenfolgeunabhängig, keine Vorrangregel, kein "das letzte gewinnt".
      `--gates` ohne Altflags ist immer widerspruchsfrei.
    accepted_examples:
      - "--gates none --no-approval"
      - "--gates spec --no-approval --spec-approval"
      - "--gates both --spec-approval"
    rejected_examples:
      - "--gates spec --spec-approval"   # Altflags lösen zu both auf
      - "--gates none --spec-approval"
      - "--gates both --no-approval"
      - "--gates plan --no-approval"     # nichts löst zu plan auf
      - "--gates plan --spec-approval"
    conflicting_combination:
      accepted: false
      exit: nonzero
      error: clear_conflict_message
      persistent_run_created: false
      persistent_run_state_written: false

  invalid_mode:
    accepted: false
    exit: nonzero
    error_must_name_allowed_values:
      - none
      - spec
      - plan
      - both
    persistent_run_created: false
    persistent_run_state_written: false

  valid_run_output:
    rule: |
      Beim Start jedes gültigen neuen Runs wird der wirksame Gate-Modus
      als genau einer der Werte `none`, `spec`, `plan` oder `both`
      ausgegeben. Dies gilt für explizite `--gates`-Werte, reine
      Altflag-Aufrufe, zulässige Mischformen und den impliziten Default.
      Der genaue Wortlaut ist nicht gepinnt.

  help:
    command: adw run --help
    must_describe:
      - "die vier Werte none, spec, plan und both"
      - "plan als Default"
      - "den Spec- und Plan-Haltepunkt jedes Modus"
      - "die weiterhin gültige Bedeutung von --no-approval"
      - "die weiterhin gültige Bedeutung von --spec-approval"

x-adw-existing-state-compatibility:
  persisted_fields:
    - skip_approval
    - spec_approval
  rule: |
    Ein Run-State im bisherigen Format wird ohne Migration oder manuelle
    Änderung geladen. `adw resume` und `adw approve` setzen ihn fort; sein
    Gate-Verhalten richtet sich weiterhin nach den gespeicherten
    Boolean-Werten.
  not_pinned: |
    Ob ein neues State-Feld hinzukommt, ist Umsetzungsentscheidung; falls
    ja, muss es bei Abwesenheit auf die gespeicherten Booleans
    zurückfallen.

x-adw-unchanged:
  gate_mechanics:
    - phase_order
    - approval_states
    - approve_command
    - resume_command
    - resume_semantics
  exit_codes:
    done: 0
    awaiting_approval: 2
    escalation_or_error: 1
  rule: |
    Die Gate-Mechanik bleibt unangetastet: dieser Lauf baut die
    Eingabefläche, nicht das Verhalten.

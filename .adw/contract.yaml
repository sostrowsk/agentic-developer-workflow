# Contract — R3 (Single-Lane: nur extern beobachtbare Flächen, keine Helper-Signaturen)
openapi: 3.1.0
info:
  title: ADW GUI — R3 Live-Stream, Host-Prüfung, Template-Verhalten
  version: 0.36.1
  description: >-
    Ergänzender Minimal-Contract. Bestehende Routen, JSON-Antwortfelder, gültige Werte
    und Event-Record-Strukturen bleiben unverändert.

paths:
  /api/runs/{repo}/{run_id}/stream:
    get:
      summary: SSE-Live-Stream eines Laufs
      parameters:
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: run_id, in: path, required: true, schema: {type: string}}
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
          description: >-
            Zuletzt bestätigte Seq (Integer). Ein gültiger Wert hat Vorrang vor last_id.
            Begrenzt nur die Ausgabe.
        - name: last_id
          in: query
          required: false
          schema: {type: string}
          description: >-
            Startpunkt (Integer, gleiche Semantik wie Last-Event-ID), wirksam ohne
            gültigen Header. Ohne gültigen Cursor beginnt die Ausgabe am Log-Anfang.
      responses:
        "200":
          description: text/event-stream, siehe x-sse.
          content:
            text/event-stream:
              schema: {type: string}
        "400":
          description: Host nicht in der Allowlist (oder bestehender Validierungsfehler).
        "404":
          description: Repository/Lauf nicht auflösbar (unverändert).
      x-sse:
        record:
          frame: "id: <seq>\ndata: <Event-Record als JSON>\n\n"
          order: Log-Reihenfolge
          filter: nur Records mit seq > Cursor
        problem:
          frame: "event: problem\ndata: <bestehendes Problemformat>\n\n"
          behavior: beendet den Stream nicht (unverändert)
        ping:
          frame: ": ping\n\n"
          behavior: bei jedem leeren Poll einer weiterhin offenen Verbindung
        closed:
          frame: "event: closed\ndata: {}\n\n"
          behavior: genau einmal, als letztes Frame jedes regulären Stream-Endes
        completion:
          live_log: >-
            Ein run-Ende beendet den Stream nur, wenn es zur letzten bisher gestarteten
            Run-Spanne gehört (Span-ID, Ende nach Start) und der Run-State nicht auf
            Approval wartet (awaiting_approval / awaiting_spec_approval). Enden früherer
            Spannen beenden ihn nicht.
          awaiting_approval: >-
            Verbindung bleibt offen; spätere approve-/resume-Events aus demselben Log
            kommen über dieselbe Verbindung.
          cursor_independence: >-
            Die maßgebliche Spanne wird aus dem gesamten Log bestimmt. Liegt ihr Ende
            auf/unter dem Cursor und wartet der Lauf nicht auf Approval, folgt sofort
            closed ohne erneute Record-Ausgabe.
          no_trace: sofort closed
          gzip: ausstehende Events einmal, dann closed auch ohne End-Record
          disconnect: Client-Abbruch beendet Generator und Polling (kein belegter Thread)
          open_without_end: ohne maßgebliches Ende weiter auf Events warten

x-host-policy:
  applies_to: alle GUI- und /api-Anfragen, vor Auslieferung von Inhalten
  allowed: ["127.0.0.1", "localhost", "::1", "[::1]"]
  port_in_host_header: erlaubt (z. B. 127.0.0.1:<port>)
  cli_extension: >-
    Bei --i-know und einem anderen --host wird genau dieser Host zusätzlich erlaubt.
    Keine Wildcard. Bind-Prüfung und --i-know-Bedeutung unverändert.
  foreign_host: 400

x-template-behavior:
  run_detail:
    path: /runs/{repo}/{run_id}
    body_attributes:
      data-run-status: gerenderter Run-Status
      data-last-seq: >-
        höchste gültige Seq des für den Snapshot geladenen Logs (unabhängig von
        Raw-/Tools-Filtern und Pagination); 0 ohne gültige Seq
    event_source:
      skip_when_status: [done, escalated]
      initial_cursor: "?last_id=<data-last-seq>"
      on_run_end: finaler Refresh wie bisher; Verbindung bleibt offen
      on_closed: EventSource schließen
    tools_navigation:
      behavior: >-
        Prev/Next entstehen aus dem aktuellen Query-String mit ersetztem tools_offset;
        ein vorhandener focus wird nicht überschrieben.
      preserved_parameters: [limit, raw_q, raw_type, raw_from_seq, raw_to_seq, focus]

x-unchanged:
  - Felder und Werte aller /api-Antworten
  - Resume-Semantik von Last-Event-ID (Seq-Cursor)
  - Falsch typisierte E6-Felder (type, kind, span, parent, ts als Nicht-String;
    payload als Nicht-Dict; payload.status als Nicht-String) gelten als fehlend und
    erzeugen ein Problem im bestehenden Format; / und /api/runs antworten 200

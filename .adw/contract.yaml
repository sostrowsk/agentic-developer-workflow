openapi: 3.1.0
info:
  title: ADW Read-only GUI — Lauf 5 (GUI polish)
  version: 5.0.0
  description: |
    Minimal external contract for the single backend workstream of GUI-polish
    run 5. The GUI web app already exists (built in run 4b) and stays a strictly
    read-only inspector. This run corrects seven narrowly scoped issues (A–G) in
    the web layer only.

    Pinned here are ONLY the externally observable surfaces named in the issue's
    contract note: (1) the corrected run-status semantics, (2) the presence of
    the agent.run detail tabs, (3) the readability of tool-call tree entries,
    (4) the behavior for runs without an event log, and (5) the assurance that
    selecting a node does not block the UI (including that any HTTP route added
    for it is read-only). NOT pinned: internal helper signatures, the span-tree
    serialization mechanics, template/CSS/JS file structure and markup, the
    concrete rendering/loading mechanism for task B (including whether a new
    route exists and its exact path), and the display formatting details of
    tasks E/F (spec acceptance criteria cover those; they are not contract
    surface). Implementation and scope guardrails — the named source files that
    must remain unchanged, dependency/tooling constraints, and the filesystem
    containment / RUN_ID_RE / slug enforcement mechanisms — live in the spec and
    plan, not in this contract. Field lists are minimum requirements; JSON
    objects may carry additional fields.

    The full observable surface pinned in run 4b (the `/`, `/runs/{repo}/{run_id}`,
    `/api/runs`, `/api/runs/{repo}/{run_id}`, `/api/runs/{repo}/{run_id}/events`
    and `/api/runs/{repo}/{run_id}/stream` routes, their response/SSE formats, the
    CLI, the packaging boundary and the read-only invariants) remains in force
    unchanged except where corrected below.

servers:
  - url: http://127.0.0.1:8765

x-adw-scope:
  workstreams:
    - backend
  read_only: true
  externally_observable_surfaces:
    - http
    - json
    - template_behavior
  invariants:
    - "The GUI exposes no write or control route and stays strictly read-only."
    - "No route is added beyond what task B strictly requires. The plan's
       preferred mechanism reuses the existing read-only events route, in which
       case NO new route exists. If one is added after all, it is read-only and
       never returns 5xx on the pinned error cases (unknown slug, invalid
       run_id, absent run_id). The exact route path is not contractual."

# --- (A) Corrected run-status semantics -----------------------------------------
x-adw-status-semantics:
  applies_to:
    - "GET /api/runs and GET / (run list)"
    - "GET /api/runs/{repo}/{run_id} and GET /runs/{repo}/{run_id} (run detail)"
  rules:
    - "For a run whose events.jsonl contains several `run` spans, the reported
       status is that of the LAST `run` span in log order — identical in the run
       list and the run detail. Earlier finished or waiting `run` spans never
       override the visible status."
    - "If the last `run` span has no `end` record, the run is reported as
       `running`."
    - "Example: three `run` spans with the last one `status=done` is reported as
       `done`, not `awaiting_approval`, in list and detail alike."

# --- (G) Runs without an event log ----------------------------------------------
x-adw-runs-without-log:
  rules:
    - "A run with state.json but no events.jsonl appears in the run list (GET
       /api/runs and GET /) with the metadata available from its state; values
       not derivable from the state stay empty."
    - "Such a run carries a clear indication that no trace exists; how this
       indication is embedded (field name / markup) is not contractual."
    - "Opening the detail of such a run (GET /runs/{repo}/{run_id} and GET
       /api/runs/{repo}/{run_id}) never produces an error; the existing events
       surface answers for such a valid run without a server error (empty
       event list)."

# --- (B) Selecting a node does not block the UI ---------------------------------
x-adw-detail-responsiveness:
  guarantee:
    - "Selecting an agent.run node keeps the UI usable — even for an agent.run
       with very many and very large tool results. The manual measurement
       (click on the agent.run node, immediately followed by a tab switch, until
       the chosen tab is visibly active and shows content) is at most 2 seconds,
       verified per the documented manual browser check (not automated — an
       automated browser / performance harness is deferred)."
    - "The user can reach every full content — the full prompt, the full answer,
       every tool-call input and every tool result; not necessarily immediately
       and all at once, but reachable."
  notes:
    - "The concrete mechanism (truncate/collapse in the display, section
       loading, render only the visible slice, or receiving the data while
       avoiding synchronous DOM materialization) is an implementation decision
       and not contractual; the spec's acceptance criteria define what the
       automated tests must show for the chosen mechanism."
    - "Trimming / collapsing / section-loading in the DISPLAY is explicitly
       permitted (spec E8); it is not a violation of the log's 'no payload
       truncation' rule."

# --- Observable template behavior corrected by this run -------------------------
x-adw-template-behavior:
  run_detail:
    detail_pane:
      agent.run:
        tabs:
          - Prompt
          - Antwort
          - Tools
        notes:
          - "(D) Exactly these three tabs, labelled per spec D1, presented as
             switchable tabs (exactly one visible/active at a time) rather than
             stacked sections. No Diff tab in this run (and no
             Raw/Artifacts/Timeline tab either)."
          - "Prompt: the full task string including the system append."
          - "Antwort: the final text plus intermediate assistant messages."
          - "Tools: chronological tool calls with the readable labels below;
             full input and full result remain reachable via the task-B
             mechanism."
    trace_tree_tool_entries:
      # (C) Readability of tool-call / tool-result entries in the trace tree.
      agent.tool.call:
        - "Shows the tool name and the tool-specific main argument from the
           payload. Field priority for the named cases: Read -> file path,
           Bash -> command line (may be shortened), Grep -> search pattern (e.g.
           'Read models.py', 'Bash pytest -x -q', 'Grep RUN_ID_RE')."
        - "For other tools: tool name plus a main argument when one is
           unambiguously identifiable in the payload, otherwise the tool name
           alone. Nothing beyond the payload content is required."
      agent.tool.result:
        - "Shows its outcome compactly (error / success; for Bash the exit code
           when present in the payload)."
      fallbacks:
        - "Nothing is invented. If the tool NAME is missing, the entry keeps the
           unchanged type name (agent.tool.call / agent.tool.result)."
        - "If the tool name is present but the main argument is missing, only the
           tool name is shown — no substitute value."
        - "If a result lacks its outcome fields, it keeps the type name."
  not_pinned:
    - "Template/CSS/JS file structure and markup details."
    - "The concrete rendering / loading mechanism for task B, including whether
       a new read-only route exists and its exact path."
    - "How the 'no trace' indication and the readable tool labels are embedded
       beyond the observable behavior described above."
    - "The display formatting of durations, costs, timestamps and the overflow
       behavior (tasks E/F) — covered by spec acceptance criteria, not pinned
       as contract surface."

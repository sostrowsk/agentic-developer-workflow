# Interface contract — W3: `adw kpis` — Kennzahlen über alle Läufe aus dem Ledger
#
# Single-Lane-Projekt (nur `backend`, siehe .adw/config.yaml). Gemäß Spec (DoD)
# pinnt dieser Contract ausschließlich extern beobachtbare Flächen:
#   1. CLI `adw kpis` (Optionen, Exit-Codes, Ströme, Seiteneffekte),
#   2. JSON-Struktur der Ausgabe mit `--json`,
#   3. Kandidaten-Regelnamen und -Reihenfolge,
#   4. die Wertänderung im run-record.json (A0).
#
# NICHT Teil des Contracts: interne Helfer und ihre Signaturen, das exakte
# Textlayout ohne `--json`, Formulierung der stderr-Meldungen (nur ihr
# Vorhandensein inkl. Pfad). `compute_kpis(records, since=None, repo_slug=None)`
# legt die Spec selbst fest; hier steht nur ihr beobachtbares Ergebnis.
# Keine HTTP-Routen, keine Events, kein Config-Feld.

version: 1
scope: W3
workstreams:
  - backend

cli:
  "adw kpis [--since <tage>] [--repo-slug <slug>] [--json]":
    level: top-level                          # nicht unter `adw ledger`
    source: "$ADW_LEDGER/runs/*/*/run-record.json (Default ~/.adw/ledger, ~ expandiert); kein Run-Ordner-Fallback"
    options:
      --since: "int >= 0, Default keiner; nur Läufe mit started_at >= jetzt − N Tage (inklusive, Vergleich als Zeitpunkte); ohne/unlesbares started_at → ausgeschlossen; negativ → Meldung, Exit != 0, kein Ledger-Zugriff"
      --repo-slug: "str, Default keiner; exakter Vergleich mit record.repo_slug (Form 'acme/widget')"
      --json: "Flag; genau ein JSON-Objekt auf stdout (Struktur siehe json_output)"
    filters: "UND-verknüpft; wirken vor Gruppierung, total, Kandidatenauswahl und Kosten-Median; Filter-Ausschlüsse zählen nicht in skipped"
    exit:
      0: "Erfolg, auch bei Ledger ohne Records (leeres Ergebnis, siehe empty_result) oder übersprungenen Records"
      1: "kein Ledger (Pfad kein Verzeichnis oder ohne .git) oder Git-Probe scheitert; Meldung mit Pfad auf stderr, kein Traceback"
      nonzero: "--since negativ; Meldung über ungültigen Optionswert"
    skipped_records: "kein gültiges JSON, kein JSON-Objekt, schema_version != 1 oder fehlend → gezählt in skipped (beim Lesen, vor Filtern), kein Traceback, Exit bleibt 0"
    side_effects: none                        # keine Schreibzugriffe (Ledger, Repo, Run-Ordner), keine Modellaufrufe, keine neue Dependency
    text_output: "ohne --json: Texttabelle ohne Farben; eine Zeile je Version plus 'gesamt'; Spaltenfolge Version, Läufe, done/escalated/sonstige, Eskalationsanteil, Review-Runden Median/Max, Fix-Zyklen Median/Max, Gate-Iterationen Median/Max, Dauer-Median, Kosten Summe/Median, Circuit-Breaker, Approvals-Median; variable Kennzahlen als sortierte schlüssel=wert-Paare; Kandidatenzeilen mit allen candidate-Feldern und Regelnamen; Zeile '<n> übersprungen'; null als '-', Anteile ggf. in Prozent, Rundung nur zur Anzeige; exaktes Layout nicht gepinnt, Werte identisch zur JSON-Ausgabe"

json_output:
  groups: "list[group]"                       # aufsteigend: numerisch je Punkt-Komponente, dann nicht-numerisch lexikalisch, null zuletzt
  total: metrics                              # über alle gefilterten Läufe, direkt aus den Records (nicht aus Gruppenwerten); ohne adw_version
  candidates: "list[candidate]"               # sortiert nach started_at, dann run_id
  skipped: "int >= 0"

  group: "{adw_version: str | null, ...metrics}"   # gruppiert nach adw_version (nicht adw_versions); null bildet eigene Gruppe
  metrics:
    # null = kein verwertbarer Wert (nie eine erfundene 0; gemessene 0 bleibt gültig);
    # nicht-numerische/null-Werte werden ignoriert; Median statistisch (gerade Anzahl → Mittel);
    # Anteile 0..1, ohne Nenner null; Werte ungerundet
    runs: "int >= 0"
    phase_shares: "{done: float|null, escalated: float|null, other: float|null}"   # Nenner runs
    escalation_share: "float | null"          # phase == escalated ODER escalation_reason != null
    review_rounds: "{median: number|null, max: number|null}"
    fix_cycles: "{median: number|null, max: number|null}"
    gate_iterations: "{median: number|null, max: number|null}"   # je Lauf Summe über alle Lanes; ohne Lane-Werte zählt der Lauf nicht
    duration_s: "{median: number|null}"
    cost_usd: "{sum: number|null, median: number|null}"
    agent_cost_shares: "{<agent>: float | null}"   # Anteil an der Summe bekannter agents[].cost_usd; {} ohne Einträge; Nenner 0 → null je Agent
    circuit_breakers: "int | null"            # Summe
    approvals: "{median: number|null}"
    findings_by_severity: "{<severity>: int}"
    findings_by_action: "{<action>: int}"
  candidate:
    run_id: str
    repo_slug: "str | null"
    adw_version: "str | null"
    rules: "list[rule], nie leer"             # in der Reihenfolge von candidate_rules
    issue_title: "str | null"
  empty_result:                               # Ledger vorhanden, keine (gültigen/gefilterten) Records
    groups: []
    total: "alle metrics-Schlüssel vorhanden: runs 0, Anteile und Messwerte null, agent_cost_shares und Findings-Maps leer"
    candidates: []
    skipped: "Anzahl beim Lesen übersprungener Dateien"

candidate_rules:                              # fest, nicht konfigurierbar; ein Lauf höchstens einmal Kandidat; Reihenfolge stabil
  - escalated: 'phase == "escalated"'
  - review_rounds: "numerischer review_rounds >= 4"
  - gate_iterations: "gate_iterations einer einzelnen Lane >= 5 (nicht die Summe)"
  - circuit_breakers: "numerischer circuit_breakers > 0"
  - cost_usd: "cost_usd > 1.5 × Median cost_usd aller gefilterten Läufe (über Versionsgruppen hinweg); ohne cost_usd nie"

run_record:                                   # Änderung gegenüber W13 (A0); Form sonst gleich
  schema_version: 1                           # unverändert
  issue_title: "ist die erste nicht-leere Zeile die ADW-Kopfzeile ('# Issue (ADW-generiert …'), gilt der Rest danach; darin erste Markdown-Überschrift ohne '#', sonst erste nicht-leere Zeile, sonst null"
  findings: "list[{finding_key, severity, action, reason, phase, round, loop}]"
  review_counts: "list[{phase, round, loop, n}]"
  phase_round_loop_source: "Span-Hierarchie (triage.decision: Spanne aus `span`; codex.review: eigene Spanne, dann parent-Kette): nächste round-Spanne → round = payload.n, loop = payload.loop; nächste phase-Spanne → phase = payload.name; kein Vorfahr/kein Start-Event → null; nie aus Top-Level-Eventfeldern"

unchanged:
  - Ledger-Layout und Export-Mechanismus (`adw ledger export`, Export nach run/resume/approve, Prune)
  - Event-Format
  - GUI
  - pyproject.toml-Version (0.33.0)

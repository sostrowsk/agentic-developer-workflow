# Interface contract — Run-Detail bleibt 200 bei Nicht-Mapping-Payload
#
# Single-Lane-Projekt (nur backend). Der Contract pinnt ausschließlich die extern
# beobachtbare Fläche: Statuscode und Form von GET /api/runs/{repo}/{run_id} bei
# Events mit Nicht-Mapping-Payload. Interne Helfer-Signaturen und Modullayouts
# sind KEINE Contract-Flächen.
openapi: 3.0.3
info:
  title: ADW GUI — Run-Detail (change_scope robustness)
  version: 0.21.1
  description: >-
    Minimaler Contract für den einzigen Workstream backend. Er pinnt nur
    das Verhalten des bestehenden Run-Detail-Endpunkts bei Nicht-Mapping-
    Payloads und die unveränderte change_scope-Antwort. Interne Helfer,
    Event-Schemas und weitere API-Flächen werden nicht spezifiziert.

paths:
  /api/runs/{repo}/{run_id}:
    get:
      summary: Run-Detail bleibt bei Nicht-Mapping-Payloads erfolgreich.
      description: >-
        Bei einem ansonsten erfolgreichen Detailabruf verursachen
        lane/start- und snapshot-Events mit Nicht-Mapping-Payload keinen
        5xx; die Antwort bleibt 200. Dies gilt insbesondere für nichtleere
        Listen, nichtleere Strings und Zahlen ungleich null.
        Bestehende Fehlerbedingungen außerhalb dieses Falls bleiben unverändert.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Bestehende Run-Detail-Antwort mit unveränderter Form.
            Nicht-Mapping-Payloads beeinflussen weder gültige Lanes noch
            gültige Snapshot-Zuordnungen oder daraus abgeleitete Diffs.
          content:
            application/json:
              schema:
                type: object
                required: [change_scope]
                description: >-
                  Nur change_scope wird hier strukturell beschrieben.
                  Alle weiteren bestehenden Antwortfelder bleiben unverändert;
                  die offene Beschreibung erlaubt keine neuen Antwortfelder.
                properties:
                  change_scope:
                    $ref: "#/components/schemas/ChangeScope"

components:
  schemas:
    ChangeScope:
      type: object
      additionalProperties: false
      required: [lanes, declared_scope]
      properties:
        lanes:
          type: array
          description: >-
            Bestehende gültige Lane-Einträge in unveränderter Reihenfolge.
            Nicht-Mapping-Payloads erzeugen keinen Eintrag. Enthält der Lauf
            ausschließlich solche Events, ist diese Liste leer.
          items:
            $ref: "#/components/schemas/ChangeScopeLane"
        declared_scope:
          type: string
          nullable: true
          description: Nach den bisherigen Regeln unverändert abgeleiteter Wert.

    ChangeScopeLane:
      type: object
      additionalProperties: false
      required: [lane, diff_available, files]
      properties:
        lane:
          type: string
          minLength: 1
        diff_available:
          type: boolean
          description: Bestehender Wert bleibt durch fehlerhafte Events unverändert.
        files:
          type: array
          nullable: true
          description: >-
            Bestehendes Diff-Ergebnis einschließlich Reihenfolge und Zählwerten.
            Weiterhin null bei nicht verfügbarem Diff und eine leere Liste
            bei verfügbarem Diff ohne Änderungen.
          items:
            $ref: "#/components/schemas/ChangeScopeFile"

    ChangeScopeFile:
      type: object
      additionalProperties: false
      required: [path, additions, deletions]
      properties:
        path:
          type: string
        additions:
          type: integer
          nullable: true
        deletions:
          type: integer
          nullable: true

x-adw-invariants:
  - >-
    Nicht-Mapping-Payloads werden für Änderungsumfang-Ableitung und
    Snapshot-Zuordnung still ignoriert: keine Lane, kein Snapshot-Beitrag,
    kein Eintrag, kein Platzhalter, keine Fehlermeldung, kein Zusatzfeld,
    kein Log-Eintrag und kein Zähler.
  - >-
    Ein snapshot-Event mit Nicht-Mapping-Payload bracketiert keinen Knoten
    und wird keiner Lane zugeordnet. Gültige Snapshots behalten ihre
    Zuordnung und Wirkung; gültige Paare und Diff-Ergebnisse werden
    weder ersetzt noch entfernt.
  - >-
    Gültige Lane-Einträge und declared_scope behalten ihre bestehenden
    Felder und Werte. Fehlerhafte Events verdrängen keine gesunden Events
    aus der Ableitung.
  - >-
    Das Ignorieren entfernt keine Events aus dem gespeicherten Event-Log
    und verändert nicht die bestehende Trace-Darstellung.
  - >-
    Keine neue Route, kein neues Antwortfeld und keine Änderung einer
    bestehenden Antwortform. Die GUI bleibt read-only.

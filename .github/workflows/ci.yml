name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Rich/Typer entscheiden anhand der Umgebung, ob sie CLI-Ausgaben faerben,
    # und zerlegen dabei Optionsnamen in Style-Segmente ("--gates" ueberlebt
    # nicht als Literal). Unter GITHUB_ACTIONS faerbt Rich, lokal bei nicht
    # terminalgebundener Ausgabe nicht — genau diese Differenz hat einen sonst
    # gruenen Lauf hier rot werden lassen. NO_COLOR macht die Ausgabe
    # deterministisch; Tests, die auf Hilfetexte pruefen, strippen zusaetzlich
    # selbst.
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked: pyproject und uv.lock müssen zusammenpassen. Lane-Gates
      # laufen über `uv run` und schreiben den Lock bei neuen Dependencies
      # selbst fort — ein vergessener Lock-Update fällt hier auf.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run pytest -q

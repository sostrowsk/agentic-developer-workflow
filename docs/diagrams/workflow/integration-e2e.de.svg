<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img">
<title>Phase 4: Integration und E2E</title>
<desc>Alle Lanes frisch von der Basis mergen, E2E laufen lassen, rote Tests an die Lanes zurückgeben.</desc>
<rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M180 85 L205 85 L205 125 L219 125" fill="none" stroke="#475569" stroke-width="2"/><polygon points="230,125 219,130.5 219,119.5" fill="#475569"/></g>
<g data-step="2"><path d="M180 165 L205 165 L205 125" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="2"><path d="M330 90 L330 67" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="330,56 335.5,67 324.5,67" fill="#b91c1c"/></g>
<g data-step="3"><path class="flow" d="M430 125 L469 125" fill="none" stroke="#475569" stroke-width="2"/><polygon points="480,125 469,130.5 469,119.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M660 125 L709 125" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,125 709,130.5 709,119.5" fill="#475569"/><text x="690" y="117" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="690" dy="0">grün</tspan></text></g>
<g data-step="5"><path class="flow" d="M570 160 L570 229" fill="none" stroke="#475569" stroke-width="2"/><polygon points="570,240 564.5,229 575.5,229" fill="#475569"/><text x="578" y="205" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="578" dy="0">rot</tspan></text></g>
<g data-step="5"><path d="M660 275 L709 275" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="720,275 709,280.5 709,269.5" fill="#b91c1c"/></g>
<g data-step="6"><path class="flow" d="M480 275 L441 275" fill="none" stroke="#475569" stroke-width="2"/><polygon points="430,275 441,269.5 441,280.5" fill="#475569"/><text x="455" y="267" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="455" dy="0">neu</tspan></text></g>
<g data-step="7"><path class="flow" d="M230 275 L191 275" fill="none" stroke="#475569" stroke-width="2"/><polygon points="180,275 191,269.5 191,280.5" fill="#475569"/></g>
<g data-step="7"><path class="flow" d="M100 240 L100 201" fill="none" stroke="#475569" stroke-width="2"/><polygon points="100,190 105.5,201 94.5,201" fill="#475569"/></g>
<g data-step="1" data-info="Beide Lane-Branches kommen mit grünen Gates."><rect x="20" y="60" width="160" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="100" y="81.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="100" dy="0">Lane backend</tspan></text><text x="100" y="98.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="100" dy="0">Gates grün</tspan></text></g>
<g data-step="1"><rect x="20" y="140" width="160" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="100" y="161.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="100" dy="0">Lane frontend</tspan></text><text x="100" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="100" dy="0">Gates grün</tspan></text></g>
<g data-step="2" data-info="Jede Runde baut den Integrations-Branch neu von der Basis: idempotent und crash-sicher."><rect x="230" y="90" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="330" y="113.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="330" dy="0">Runde r ≤ 10</tspan></text><text x="330" y="130.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="330" dy="0">frisch von der Basis,</tspan></text><text x="330" y="147.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="330" dy="0">alle Lanes mergen</tspan></text></g>
<g data-step="2" data-info="Merge-Konflikte zu lösen ist Menschensache."><rect x="230" y="10" width="200" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="330" y="29.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="330" dy="0">Konflikt / Timeout</tspan></text><text x="330" y="46" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="330" dy="0">→ ESKALATION</tspan></text></g>
<g data-step="3" data-info="Ohne e2e-Konfiguration ist Integration ein reiner Merge."><rect x="480" y="90" width="180" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="570" y="113.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="570" dy="0">E2E-Gate</tspan></text><text x="570" y="130.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="570" dy="0">e2e.cmd</tspan></text><text x="570" y="147.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="570" dy="0">alle Lane-Ports gesetzt</tspan></text></g>
<g data-step="4" data-info="Gemergt und E2E-grün: weiter zum Code-Review."><rect x="720" y="90" width="260" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="850" y="121.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">grün → Phase 5</tspan></text><text x="850" y="138.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="850" dy="0">codex_review</tspan></text></g>
<g data-step="5"><rect x="480" y="240" width="180" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="570" y="262.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="570" dy="0">Runde persistiert;</tspan></text><text x="570" y="279.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="570" dy="0">dieselbe Ausgabe</tspan></text><text x="570" y="296.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="570" dy="0">wie zuvor?</tspan></text></g>
<g data-step="5"><rect x="720" y="240" width="260" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="850" y="271.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">identisch → ESKALATION</tspan></text><text x="850" y="288.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">(Circuit-Breaker)</tspan></text></g>
<g data-step="6" data-info="Read-only; jeder Fehler wird ein Finding für frontend, backend oder unknown (= alle Lanes)."><rect x="230" y="240" width="200" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="330" y="263.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="330" dy="0">e2e_triage</tspan></text><text x="330" y="280.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="330" dy="0">Sonnet 5</tspan></text><text x="330" y="297.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="330" dy="0">ordnet Fehler Lanes zu</tspan></text></g>
<g data-step="7" data-info="Die Lanes fahren erneut ihren Gate-Loop und bekommen einen Orchestrator-Commit; dann mergt die nächste Runde neu."><rect x="20" y="240" width="160" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="100" y="271.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="100" dy="0">Fixes dispatchen</tspan></text><text x="100" y="288.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="100" dy="0">an Lanes (§13.3)</tspan></text></g>
<text x="20" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="20" dy="0">Max. 10 Runden für den ganzen Lauf — Review- und CI-Fixes im Parallel-Modus laufen erneut durch Merge + E2E und teilen dieses Budget.</tspan></text>
</svg>

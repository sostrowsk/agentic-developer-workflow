<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img">
<title>ADW run at a glance</title>
<desc>The seven phases of an ADW run from issue to done, with the configurable human stops and the escalation exit.</desc>
<rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M82 227 L85 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="96,227 85,232.5 85,221.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M210 227 L213 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="224,227 213,232.5 213,221.5" fill="#475569"/></g>
<g data-step="6"><path class="flow" d="M338 227 L341 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="352,227 341,232.5 341,221.5" fill="#475569"/></g>
<g data-step="8"><path class="flow" d="M466 227 L469 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="480,227 469,232.5 469,221.5" fill="#475569"/></g>
<g data-step="9"><path class="flow" d="M594 227 L597 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="608,227 597,232.5 597,221.5" fill="#475569"/></g>
<g data-step="10"><path class="flow" d="M722 227 L725 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="736,227 725,232.5 725,221.5" fill="#475569"/></g>
<g data-step="12"><path class="flow" d="M850 227 L853 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="864,227 853,232.5 853,221.5" fill="#475569"/></g>
<g data-step="3"><path d="M217 82 L217 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="217" cy="227" r="5" fill="#b45309"/></g>
<g data-step="5"><path d="M345 148 L345 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="345" cy="227" r="5" fill="#b45309"/></g>
<g data-step="7"><path d="M473 82 L473 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="473" cy="227" r="5" fill="#b45309"/></g>
<g data-step="11"><path d="M857 82 L857 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="857" cy="227" r="5" fill="#b45309"/></g>
<g data-step="14"><path d="M153 290 L153 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="153,330 147.5,319 158.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M281 290 L281 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="281,330 275.5,319 286.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M409 290 L409 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="409,330 403.5,319 414.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M537 290 L537 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="537,330 531.5,319 542.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M665 290 L665 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="665,330 659.5,319 670.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M793 290 L793 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="793,330 787.5,319 798.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M872 290 L872 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="872,330 866.5,319 877.5,319" fill="#b91c1c"/></g>
<g data-step="13"><path class="flow" d="M933 290 L933 319" fill="none" stroke="#475569" stroke-width="2"/><polygon points="933,330 927.5,319 938.5,319" fill="#475569"/></g>
<g data-step="1" data-info="The input: issue text from --issue, a GitLab issue (glab) or a GitHub issue (gh). Exactly one source is allowed."><rect x="10" y="197" width="72" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="46" y="232.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="46" dy="0">Issue</tspan></text></g>
<g data-step="2" data-info="Phase 1: Opus 5.5 and Codex draft the spec in parallel, Fable 5.1 merges them, Codex reviews in up to 5 rounds."><rect x="96" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="153" y="207.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="153" dy="0">1 Spec</tspan></text><text x="153" y="224.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="153" dy="0">dual draft</tspan></text><text x="153" y="241.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="153" dy="0">+ synthesis</tspan></text><text x="153" y="258.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="153" dy="0">+ Codex review</tspan></text></g>
<g data-step="4" data-info="Phase 2: same pattern for plan.md and contract.yaml; at the end all artifacts are archived into the run folder."><rect x="224" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="281" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="281" dy="0">2 Plan +</tspan></text><text x="281" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="281" dy="0">Contract</tspan></text><text x="281" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="281" dy="0">plan + contract</tspan></text><text x="281" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="281" dy="0">dual draft</tspan></text><text x="281" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="281" dy="0">+ Codex review</tspan></text></g>
<g data-step="6" data-info="Phase 3: one build agent per lane in its own worktree; optional RED proof, then the gate loop. Only the orchestrator commits."><rect x="352" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="409" y="207.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="409" dy="0">3 Build</tspan></text><text x="409" y="224.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="409" dy="0">lanes, TDD RED</tspan></text><text x="409" y="241.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="409" dy="0">gate loop</tspan></text><text x="409" y="258.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="409" dy="0">≤ 10 iterations</tspan></text></g>
<g data-step="8" data-info="Phase 4 (parallel mode only): merge all lanes fresh from base, run the E2E gate, triage red tests back to the lanes."><rect x="480" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="537" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="537" dy="0">4 Integration</tspan></text><text x="537" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="537" dy="0">+ E2E</tspan></text><text x="537" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="537" dy="0">merge + E2E</tspan></text><text x="537" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="537" dy="0">--parallel only</tspan></text><text x="537" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="537" dy="0">≤ 10 rounds</tspan></text></g>
<g data-step="9" data-info="Phase 5: Codex reviews the diff read-only; findings above the round&#x27;s severity floor go back to the lanes as fix tasks."><rect x="608" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="665" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="665" dy="0">5 Codex</tspan></text><text x="665" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="665" dy="0">review</tspan></text><text x="665" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="665" dy="0">diff review</tspan></text><text x="665" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="665" dy="0">severity floor</tspan></text><text x="665" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="665" dy="0">≤ 5 rounds</tspan></text></g>
<g data-step="10" data-info="Phase 6: Fable 5.1 checks the result against the acceptance criteria; scope gaps become follow-ups, everything else a fix."><rect x="736" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="793" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="793" dy="0">6 Final</tspan></text><text x="793" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="793" dy="0">review</tspan></text><text x="793" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="793" dy="0">vs. spec + DoD</tspan></text><text x="793" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="793" dy="0">triage by code</tspan></text><text x="793" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="793" dy="0">≤ 3 fix cycles</tspan></text></g>
<g data-step="12" data-info="Phase 7: the orchestrator pushes, polls the pipeline bound to the pushed SHA and allows exactly one CI fix re-entry."><rect x="864" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="921" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="921" dy="0">7 Push</tspan></text><text x="921" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="921" dy="0">+ CI</tspan></text><text x="921" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="921" dy="0">push, poll CI</tspan></text><text x="921" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="921" dy="0">SHA-bound</tspan></text><text x="921" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="921" dy="0">1 re-entry</tspan></text></g>
<g data-step="3" data-info="Optional stop after the reviewed spec. Read spec-summary.md + spec.md, then adw approve."><rect x="142.0" y="30" width="150" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="217" y="52.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="217" dy="0">Spec gate</tspan></text><text x="217" y="69.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="217" dy="0">--gates spec | both</tspan></text></g>
<g data-step="5" data-info="The default stop: read plan-summary.md, plan.md and contract.yaml before any code is built, then adw approve."><rect x="265.0" y="96" width="160" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="345" y="118.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="345" dy="0">Plan gate (default)</tspan></text><text x="345" y="135.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="345" dy="0">--gates plan | both</tspan></text></g>
<g data-step="7" data-info="Optional breakpoint: all lanes are green, no merge or review work has started yet."><rect x="388.0" y="30" width="170" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="473" y="52.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="473" dy="0">Breakpoint</tspan></text><text x="473" y="69.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="473" dy="0">before_integration</tspan></text></g>
<g data-step="11" data-info="Optional breakpoint after the final review, before anything is pushed or CI is touched."><rect x="782.0" y="30" width="150" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="857" y="52.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="857" dy="0">Breakpoint</tspan></text><text x="857" y="69.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="857" dy="0">before_push</tspan></text></g>
<text x="560" y="116" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="560" dy="0">Every stop ends the process with exit code 2;</tspan><tspan x="560" dy="17">adw approve &lt;run_id&gt; continues the run.</tspan></text>
<g data-step="14" data-info="An escalation is a verdict: a limit, a circuit breaker, a merge conflict or a missing proof. The report names phase, lanes and reason."><rect x="96" y="330" width="782" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="487" y="357.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle"><tspan x="487" dy="0">Any phase can escalate → escalation.md · exit code 1 · terminal (start a new run)</tspan></text></g>
<g data-step="13" data-info="Pipeline (and staging job) green for the pushed SHA: the run is done."><rect x="888" y="330" width="90" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="933" y="349.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="933" dy="0">done</tspan></text><text x="933" y="366.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="933" dy="0">exit 0</tspan></text></g>
<g><rect x="96" y="412" width="18" height="14" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g>
<text x="120" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="120" dy="0">orchestrator (deterministic code)</tspan></text>
<g><rect x="363.5" y="412" width="18" height="14" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/></g>
<text x="387.5" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="387.5" dy="0">agent (LLM)</tspan></text>
<g><rect x="485.046875" y="412" width="18" height="14" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/></g>
<text x="509" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="509" dy="0">gate / proof / success</tspan></text>
<g><rect x="660.78125" y="412" width="18" height="14" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/></g>
<text x="684.8" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="684.8" dy="0">human stop</tspan></text>
<g><rect x="814.125" y="412" width="18" height="14" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/></g>
<text x="838.1" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="838.1" dy="0">escalation</tspan></text>
</svg>

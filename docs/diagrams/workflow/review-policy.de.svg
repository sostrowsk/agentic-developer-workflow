<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img">
<title>Review-Loop-Policy: sinkende Severity-Schwelle</title>
<desc>Welche Severities in den Review-Runden 1 bis 5 umgesetzt werden.</desc>
<rect x="0" y="0" width="1000" height="340" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M210 50 L219 50" fill="none" stroke="#475569" stroke-width="2"/><polygon points="230,50 219,55.5 219,44.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M400 50 L409 50" fill="none" stroke="#475569" stroke-width="2"/><polygon points="420,50 409,55.5 409,44.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M590 50 L599 50" fill="none" stroke="#475569" stroke-width="2"/><polygon points="610,50 599,55.5 599,44.5" fill="#475569"/></g>
<g data-step="5"><path class="flow" d="M780 50 L789 50" fill="none" stroke="#475569" stroke-width="2"/><polygon points="800,50 789,55.5 789,44.5" fill="#475569"/></g>
<g data-step="1" data-info="Runde 1: voller Review — P1, P2 und P3 werden gefixt."><rect x="40" y="30" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="125" y="55.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="125" dy="0">Runde 1</tspan></text></g>
<g data-step="1"><rect x="40" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="125" y="104.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="125" dy="0">P1 · Fix</tspan></text></g>
<g data-step="1"><rect x="40" y="128" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="125" y="152.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="125" dy="0">P2 · Fix</tspan></text></g>
<g data-step="1"><rect x="40" y="176" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="125" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="125" dy="0">P3 · Fix</tspan></text></g>
<g data-step="2" data-info="Runde 2: P1 und P2 werden gefixt; P3 wird Follow-up / bekanntes Finding."><rect x="230" y="30" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="315" y="55.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">Runde 2</tspan></text></g>
<g data-step="2"><rect x="230" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="315" y="104.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">P1 · Fix</tspan></text></g>
<g data-step="2"><rect x="230" y="128" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="315" y="152.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">P2 · Fix</tspan></text></g>
<g data-step="2"><rect x="230" y="176" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="315" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">P3 → Follow-up</tspan></text></g>
<g data-step="3" data-info="Runde 3: nur P1 blockt; P2 und P3 werden festgehalten, nicht gefixt."><rect x="420" y="30" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="505" y="55.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">Runde 3</tspan></text></g>
<g data-step="3"><rect x="420" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="505" y="104.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">P1 · Fix</tspan></text></g>
<g data-step="3"><rect x="420" y="128" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="505" y="152.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">P2 → Follow-up</tspan></text></g>
<g data-step="3"><rect x="420" y="176" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="505" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">P3 → Follow-up</tspan></text></g>
<g data-step="4" data-info="Runde 4: wie Runde 3 — nur P1."><rect x="610" y="30" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="695" y="55.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="695" dy="0">Runde 4</tspan></text></g>
<g data-step="4"><rect x="610" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="695" y="104.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="695" dy="0">P1 · Fix</tspan></text></g>
<g data-step="4"><rect x="610" y="128" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="695" y="152.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="695" dy="0">P2 → Follow-up</tspan></text></g>
<g data-step="4"><rect x="610" y="176" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="695" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="695" dy="0">P3 → Follow-up</tspan></text></g>
<g data-step="5" data-info="Runde 5, das Limit: ein offenes P1 eskaliert (Authoring: P2/P3 als bekannte Findings akzeptiert; Phase 5: jedes umsetzbare Finding eskaliert)."><rect x="800" y="30" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="885" y="55.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="885" dy="0">Runde 5</tspan></text></g>
<g data-step="5"><rect x="800" y="80" width="170" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="885" y="104.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="885" dy="0">P1 offen → ESKALATION</tspan></text></g>
<g data-step="5"><rect x="800" y="128" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="885" y="152.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="885" dy="0">P2 → Follow-up</tspan></text></g>
<g data-step="5"><rect x="800" y="176" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="885" y="200.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="885" dy="0">P3 → Follow-up</tspan></text></g>
<g data-step="6" data-info="Ohne Gedächtnis und sinkende Schwelle findet ein Reviewer immer noch einen Randfall, und der Loop konvergiert nie."><rect x="230" y="240" width="740" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="240" y="262.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="240" dy="0">Findings-Gedächtnis (ab Runde 2): der Prompt enthält Runde n, die Schwelle und jedes frühere</tspan></text><text x="240" y="279.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="240" dy="0">Finding mit Disposition — „nicht erneut melden, außer es besteht nachweislich fort“.</tspan></text><text x="240" y="296.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="240" dy="0">Persistiert als authoring_prior_context / review_prior_context — übersteht einen Crash.</tspan></text></g>
<g data-step="6"><text x="40" y="270" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start"><tspan x="40" dy="0">Runden 2–5</tspan></text></g>
</svg>

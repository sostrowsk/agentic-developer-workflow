<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img">
<title>Phase 7: push and CI</title>
<desc>Push, SHA-bound polling, one CI re-entry, then a human.</desc>
<rect x="0" y="0" width="1000" height="410" fill="#ffffff"/>
<g data-step="1"><path d="M105 110 L105 159" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="105,170 99.5,159 110.5,159" fill="#b91c1c"/></g>
<g data-step="2"><path class="flow" d="M190 75 L219 75" fill="none" stroke="#475569" stroke-width="2"/><polygon points="230,75 219,80.5 219,69.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M400 75 L429 75" fill="none" stroke="#475569" stroke-width="2"/><polygon points="440,75 429,80.5 429,69.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M610 75 L809 75" fill="none" stroke="#475569" stroke-width="2"/><polygon points="820,75 809,80.5 809,69.5" fill="#475569"/><text x="715" y="67" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="715" dy="0">green (+ staging_job)</tspan></text></g>
<g data-step="5"><path class="flow" d="M525 110 L525 159" fill="none" stroke="#475569" stroke-width="2"/><polygon points="525,170 519.5,159 530.5,159" fill="#475569"/><text x="533" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="533" dy="0">red</tspan></text></g>
<g data-step="5"><path d="M610 205 L639 205" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="650,205 639,210.5 639,199.5" fill="#b91c1c"/></g>
<g data-step="6"><path class="flow" d="M525 240 L525 279" fill="none" stroke="#475569" stroke-width="2"/><polygon points="525,290 519.5,279 530.5,279" fill="#475569"/><text x="533" y="268" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="533" dy="0">yes</tspan></text></g>
<g data-step="6"><path d="M610 325 L639 325" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="650,325 639,330.5 639,319.5" fill="#b91c1c"/><text x="630" y="317" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="630" dy="0">yes</tspan></text></g>
<g data-step="7"><path class="flow" d="M440 325 L411 325" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,325 411,319.5 411,330.5" fill="#475569"/><text x="420" y="317" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="420" dy="0">no</tspan></text></g>
<g data-step="8"><path class="flow" d="M315 290 L315 251" fill="none" stroke="#475569" stroke-width="2"/><polygon points="315,240 320.5,251 309.5,251" fill="#475569"/></g>
<g data-step="8"><path class="flow" d="M315 170 L315 121" fill="none" stroke="#475569" stroke-width="2"/><polygon points="315,110 320.5,121 309.5,121" fill="#475569"/></g>
<g data-step="1" data-info="GitLab (glab) or GitHub (gh). The config key wins over the origin URL."><rect x="20" y="40" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="105" y="63.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="105" dy="0">forge detection</tspan></text><text x="105" y="80.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="105" dy="0">ci.provider</tspan></text><text x="105" y="97.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="105" dy="0">or origin host</tspan></text></g>
<g data-step="1" data-info="Normally refused already in the CLI preflight. Here only if origin or config changed during the run: then it escalates. Set ci.provider for self-hosted forges."><rect x="20" y="170" width="170" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="105" y="196.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="105" dy="0">unknown host</tspan></text><text x="105" y="213.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="105" dy="0">→ ESCALATE</tspan></text></g>
<g data-step="2" data-info="Only the orchestrator pushes; hooks are disabled."><rect x="230" y="40" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="315" y="63.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">push</tspan></text><text x="315" y="80.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="315" dy="0">--force-with-lease</tspan></text><text x="315" y="97.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="315" dy="0">(dry-run: no push)</tspan></text></g>
<g data-step="3" data-info="0 tokens. A stale pipeline of an earlier push cannot decide the result."><rect x="440" y="40" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="525" y="63.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="525" dy="0">poll CI</tspan></text><text x="525" y="80.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="525" dy="0">bound to pushed SHA</tspan></text><text x="525" y="97.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="525" dy="0">every 60 s, ≤ 2700 s</tspan></text></g>
<g data-step="4" data-info="All runs for the SHA green, plus ci.staging_job if configured."><rect x="820" y="40" width="160" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="900" y="71.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="900" dy="0">done</tspan></text><text x="900" y="88.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="900" dy="0">exit 0</tspan></text></g>
<g data-step="5" data-info="Canceled, skipped or YAML errors leave no evidence to analyse."><rect x="440" y="170" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="525" y="209.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="525" dy="0">usable job logs?</tspan></text></g>
<g data-step="5" data-info="An analyst without logs would only hallucinate."><rect x="650" y="170" width="170" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="735" y="201.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="735" dy="0">no → ESCALATE</tspan></text><text x="735" y="218.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="735" dy="0">(no evidence)</tspan></text></g>
<g data-step="6"><rect x="440" y="290" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="525" y="321.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="525" dy="0">re-entry already</tspan></text><text x="525" y="338.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="525" dy="0">used?</tspan></text></g>
<g data-step="6" data-info="Exactly one automatic CI re-entry per run; then a human takes over."><rect x="650" y="290" width="170" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="735" y="312.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="735" dy="0">red again →</tspan></text><text x="735" y="329.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="735" dy="0">ESCALATE</tspan></text><text x="735" y="346.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="735" dy="0">with log excerpt</tspan></text></g>
<g data-step="7" data-info="Read-only analysis of the job logs."><rect x="230" y="290" width="170" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="315" y="313.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">log_analyst</tspan></text><text x="315" y="330.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="315" dy="0">Sonnet 5</tspan></text><text x="315" y="347.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="315" dy="0">logs → lane findings</tspan></text></g>
<g data-step="8" data-info="Counter and fix tasks in one atomic save; then push and poll again."><rect x="230" y="170" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="315" y="192.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">dispatch to lanes</tspan></text><text x="315" y="209.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">re-entry counter +1</tspan></text><text x="315" y="226.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="315" dy="0">(parallel: merge/E2E)</tspan></text></g>
</svg>

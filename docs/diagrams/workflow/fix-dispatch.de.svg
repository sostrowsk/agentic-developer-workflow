<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img">
<title>Fix-Dispatch: ein Weg für jeden Fix</title>
<desc>Jede Findings-Quelle speist denselben Lane-Loop.</desc>
<rect x="0" y="0" width="1000" height="330" fill="#ffffff"/>
<g data-step="1"><path d="M240 44 L280 44" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="1"><path d="M240 106 L280 106" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="1"><path d="M240 168 L280 168" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="1"><path d="M240 230 L280 230" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="1"><path d="M280 44 L280 230" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="2"><path class="flow" d="M280 137 L309 137" fill="none" stroke="#475569" stroke-width="2"/><polygon points="320,137 309,142.5 309,131.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M620 137 L650 137 L650 85 L669 85" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,85 669,90.5 669,79.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M620 137 L650 137 L650 185 L669 185" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,185 669,190.5 669,179.5" fill="#475569"/></g>
<g data-step="1" data-info="Jeder dieser Reviewer meldet nur strukturierte Findings — keiner ändert Code."><rect x="20" y="20" width="220" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="130" y="48.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="130" dy="0">E2E-Triage</tspan></text></g>
<g data-step="1" data-info="Jeder dieser Reviewer meldet nur strukturierte Findings — keiner ändert Code."><rect x="20" y="82" width="220" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="130" y="110.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="130" dy="0">Codex-Code-Review</tspan></text></g>
<g data-step="1" data-info="Jeder dieser Reviewer meldet nur strukturierte Findings — keiner ändert Code."><rect x="20" y="144" width="220" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="130" y="172.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="130" dy="0">finaler Review</tspan></text></g>
<g data-step="1" data-info="Jeder dieser Reviewer meldet nur strukturierte Findings — keiner ändert Code."><rect x="20" y="206" width="220" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="130" y="234.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="130" dy="0">CI-Log-Analyst</tspan></text></g>
<g data-step="2" data-info="Review-Runde, Fix-Zyklus oder CI-Re-Entry-Zähler werden zusammen mit den Aufträgen gespeichert — ein Crash kann kein Limit zurücksetzen."><rect x="320" y="57" width="300" height="160" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="330" y="108.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="start"><tspan x="330" dy="0">_dispatch_lane_fixes</tspan></text><text x="330" y="125.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="330" dy="0">nach Lane gruppieren (unknown → alle)</tspan></text><text x="330" y="142.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="330" dy="0">completed / gates_passed zurücksetzen</tspan></text><text x="330" y="159.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="330" dy="0">neuer Auftrag + frisches Gate-Budget</tspan></text><text x="330" y="176.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="330" dy="0">EIN atomarer Save inkl. Zähler</tspan></text></g>
<g data-step="3" data-info="Der normale Gate-Loop: Agent-Fix, alle Gates, Beweis, Commit."><rect x="680" y="50" width="300" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="830" y="81.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="830" dy="0">Lane backend</tspan></text><text x="830" y="98.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="830" dy="0">Gate-Loop → Orchestrator-Commit</tspan></text></g>
<g data-step="3" data-info="Der normale Gate-Loop: Agent-Fix, alle Gates, Beweis, Commit."><rect x="680" y="150" width="300" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="830" y="181.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="830" dy="0">Lane frontend</tspan></text><text x="830" y="198.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="830" dy="0">Gate-Loop → Orchestrator-Commit</tspan></text></g>
<g data-step="4"><text x="20" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start"><tspan x="20" dy="0">Keine Abkürzung, auch nicht für „triviale“ Findings: jeder Fix läuft erneut durch alle Gates.</tspan></text></g>
</svg>

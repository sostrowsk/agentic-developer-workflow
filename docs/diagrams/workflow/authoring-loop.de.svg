<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img">
<title>Spec-/Plan-Authoring: Dual-Draft, Synthese, Codex-Review-Loop</title>
<desc>Wie die Phasen 1 und 2 eine reviewte Spec bzw. einen Plan erzeugen.</desc>
<rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M160 95 L180 95 L180 50 L189 50" fill="none" stroke="#475569" stroke-width="2"/><polygon points="200,50 189,55.5 189,44.5" fill="#475569"/></g>
<g data-step="2"><path class="flow" d="M180 95 L180 130 L189 130" fill="none" stroke="#475569" stroke-width="2"/><polygon points="200,130 189,135.5 189,124.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M420 50 L445 50 L445 80 L459 80" fill="none" stroke="#475569" stroke-width="2"/><polygon points="470,80 459,85.5 459,74.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M420 130 L445 130 L445 105 L459 105" fill="none" stroke="#475569" stroke-width="2"/><polygon points="470,105 459,110.5 459,99.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M580 145 L580 169" fill="none" stroke="#475569" stroke-width="2"/><polygon points="580,180 574.5,169 585.5,169" fill="#475569"/></g>
<g data-step="4"><path d="M690 210 L729 210" fill="none" stroke="#475569" stroke-width="2"/><polygon points="740,210 729,215.5 729,204.5" fill="#475569"/><text x="715" y="202" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="715" dy="0">nein</tspan></text></g>
<g data-step="5"><path class="flow" d="M580 240 L580 279" fill="none" stroke="#475569" stroke-width="2"/><polygon points="580,290 574.5,279 585.5,279" fill="#475569"/><text x="588" y="270" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="588" dy="0">ja</tspan></text></g>
<g data-step="6"><path class="flow" d="M690 325 L729 325" fill="none" stroke="#475569" stroke-width="2"/><polygon points="740,325 729,330.5 729,319.5" fill="#475569"/><text x="715" y="317" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="715" dy="0">ok</tspan></text></g>
<g data-step="7"><path class="flow" d="M580 360 L580 399" fill="none" stroke="#475569" stroke-width="2"/><polygon points="580,410 574.5,399 585.5,399" fill="#475569"/><text x="588" y="390" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="588" dy="0">needs_fixes</tspan></text></g>
<g data-step="8"><path d="M715 412 L729 412" fill="none" stroke="#475569" stroke-width="2"/><polygon points="740,412 729,417.5 729,406.5" fill="#475569"/></g>
<g data-step="8"><path d="M715 462 L729 462" fill="none" stroke="#475569" stroke-width="2"/><polygon points="740,462 729,467.5 729,456.5" fill="#475569"/></g>
<g data-step="8"><path d="M715 512 L729 512" fill="none" stroke="#475569" stroke-width="2"/><polygon points="740,512 729,517.5 729,506.5" fill="#475569"/></g>
<g data-step="8"><path d="M715 562 L729 562" fill="none" stroke="#475569" stroke-width="2"/><polygon points="740,562 729,567.5 729,556.5" fill="#475569"/></g>
<g data-step="8"><path d="M690 450 L715 450" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="8"><path d="M715 412 L715 562" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="9"><path d="M470 450 L411 450" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,450 411,444.5 411,455.5" fill="#475569"/><text x="435" y="442" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="435" dy="0">umsetzbar</tspan></text></g>
<g data-step="9"><path class="flow" d="M300 410 L300 395 L455 395 L455 128 L459 128" fill="none" stroke="#475569" stroke-width="2"/><polygon points="470,128 459,133.5 459,122.5" fill="#475569"/><text x="310" y="387" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="310" dy="0">Runde n+1</tspan></text></g>
<g data-step="1" data-info="Der Issue-Text ist Eingabe beider Autoren und des Reviewers."><rect x="20" y="60" width="140" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="90" y="91.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="90" dy="0">Issue</tspan></text><text x="90" y="108.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="90" dy="0">(issue.md)</tspan></text></g>
<g data-step="2" data-info="Schreibt .adw/spec.md (bzw. Plan + Kontrakt); der Orchestrator kopiert nach drafts/ und eskaliert bei fehlend, leer oder veraltet."><rect x="200" y="20" width="220" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="310" y="38.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="310" dy="0">Claude-Draft</tspan></text><text x="310" y="55.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="310" dy="0">spec_agent / plan_agent</tspan></text><text x="310" y="72.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="310" dy="0">Opus 5.5</tspan></text></g>
<g data-step="2" data-info="Die zweite Meinung: Codex läuft read-only, der Orchestrator schreibt den Draft nach drafts/*.codex.*."><rect x="200" y="100" width="220" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="310" y="126.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="310" dy="0">Codex-Draft</tspan></text><text x="310" y="143.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="310" dy="0">GPT-6-Astra, read-only</tspan></text></g>
<g data-step="2" data-info="Codex ist hier optional: bei Fehler degradiert ADW, statt zu eskalieren."><rect x="200" y="175" width="220" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="310" y="196.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="310" dy="0">Codex scheitert → *.codex.FAILED,</tspan></text><text x="310" y="213.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="310" dy="0">Synthese mit einer Quelle</tspan></text></g>
<g data-step="3" data-info="Fable 5.1 liest Issue und beide Drafts, schreibt das zusammengeführte Artefakt und die *-summary.md mit Herkunft und Differenzen."><rect x="470" y="55" width="220" height="90" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="580" y="79.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">Synthese</tspan></text><text x="580" y="96.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">spec_synthesis / plan_synthesis</tspan></text><text x="580" y="113.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">Fable 5.1</tspan></text><text x="580" y="130.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">Best-of-Merge + Summary</tspan></text></g>
<g data-step="4" data-info="Der Orchestrator prüft das Ergebnis selbst, statt dem Agenten zu glauben."><rect x="470" y="180" width="220" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="580" y="206.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">Pflichtdateien vorhanden</tspan></text><text x="580" y="223.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">&amp; nicht leer?</tspan></text></g>
<g data-step="4" data-info="Ein Reparaturversuch in derselben Session, dann Eskalation."><rect x="740" y="180" width="240" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="860" y="206.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">nein → ein Reparatur-Lauf;</tspan></text><text x="860" y="223.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">fehlt weiter → ESKALATION</tspan></text></g>
<g data-step="5" data-info="Codex bekommt das Issue bewusst zur Prüfung der Verhältnismäßigkeit; ab Runde 2 auch alle früheren Findings mit Disposition."><rect x="470" y="290" width="220" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="580" y="313.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">Codex-Review</tspan></text><text x="580" y="330.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">Issue + Artefakt</tspan></text><text x="580" y="347.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">Runde n von 5</tspan></text></g>
<g data-step="6" data-info="Urteil ok beendet den Loop."><rect x="740" y="290" width="240" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="860" y="313.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">ok → Phase fertig</tspan></text><text x="860" y="330.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="860" dy="0">Spec: Gate oder Plan-Phase</tspan></text><text x="860" y="347.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="860" dy="0">Plan: archivieren → Plan-Gate</tspan></text></g>
<g data-step="7" data-info="Findings unter der Schwelle der Runde werden nicht gefixt, sondern als bekannte Findings festgehalten."><rect x="470" y="410" width="220" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="580" y="438.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">Split nach Schwelle</tspan></text><text x="580" y="455.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">R1: P1–P3 · R2: P1–P2</tspan></text><text x="580" y="472.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">R3–5: nur P1</tspan></text></g>
<g data-step="8" data-info="Alle übrigen Findings liegen unter der Schwelle: akzeptiert, mit Nachweis."><rect x="740" y="390" width="240" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="860" y="408.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">nichts Umsetzbares → akzeptieren,</tspan></text><text x="860" y="425.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">*-known-findings.md schreiben</tspan></text></g>
<g data-step="8" data-info="Ein Blocker nach der letzten Runde: ein Mensch muss entscheiden."><rect x="740" y="440" width="240" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="860" y="458.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">Runde 5, P1 noch offen</tspan></text><text x="860" y="475.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">→ ESKALATION</tspan></text></g>
<g data-step="8" data-info="Am Limit werden nicht-blockierende Findings akzeptiert und dokumentiert."><rect x="740" y="490" width="240" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="860" y="508.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">Runde 5, nur P2/P3 offen</tspan></text><text x="860" y="525" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">→ akzeptieren + bekannte Findings</tspan></text></g>
<g data-step="8" data-info="Der letzte Fix hat nichts geändert — Stopp, statt das Budget zu verbrennen."><rect x="740" y="540" width="240" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="860" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">dieselben Findings wie zuvor</tspan></text><text x="860" y="575" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="860" dy="0">→ ESKALATION (Circuit-Breaker)</tspan></text></g>
<g data-step="9" data-info="Umsetzbare Findings gehen als Fix-Auftrag in die Session des Autors; der Reviewer ändert nie selbst."><rect x="200" y="410" width="200" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="300" y="437.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="300" dy="0">Fix-Auftrag → DIESELBE</tspan></text><text x="300" y="454.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="300" dy="0">Synthese-Session</tspan></text><text x="300" y="471.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="300" dy="0">+ Summary aktuell halten</tspan></text></g>
<text x="20" y="560" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="20" dy="0">Phase 1 (Spec) und Phase 2 (Plan + Kontrakt) fahren diesen Loop mit</tspan><tspan x="20" dy="17">derselben Mechanik; config.yaml, issue.md und die freigegebene Spec</tspan><tspan x="20" dy="17">werden nach jedem Agent-Lauf wiederhergestellt.</tspan></text>
<g><rect x="20" y="612" width="18" height="14" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g>
<text x="44" y="623.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="44" dy="0">Orchestrator (deterministischer Code)</tspan></text>
<g><rect x="287.5" y="612" width="18" height="14" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/></g>
<text x="311.5" y="623.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="311.5" dy="0">Agent (LLM)</tspan></text>
<g><rect x="409.046875" y="612" width="18" height="14" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/></g>
<text x="433" y="623.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="433" dy="0">Gate / Beweis / Erfolg</tspan></text>
<g><rect x="584.78125" y="612" width="18" height="14" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/></g>
<text x="608.8" y="623.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="608.8" dy="0">menschlicher Halt</tspan></text>
<g><rect x="738.125" y="612" width="18" height="14" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/></g>
<text x="762.1" y="623.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="762.1" dy="0">Eskalation</tspan></text>
</svg>

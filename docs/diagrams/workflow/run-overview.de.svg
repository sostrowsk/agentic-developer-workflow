<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img">
<title>ADW-Lauf im Überblick</title>
<desc>Die sieben Phasen eines ADW-Laufs vom Issue bis done, mit den konfigurierbaren menschlichen Halten und dem Eskalations-Ausgang.</desc>
<rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M82 227 L85 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="96,227 85,232.5 85,221.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M210 227 L213 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="224,227 213,232.5 213,221.5" fill="#475569"/></g>
<g data-step="6"><path class="flow" d="M338 227 L341 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="352,227 341,232.5 341,221.5" fill="#475569"/></g>
<g data-step="8"><path class="flow" d="M466 227 L469 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="480,227 469,232.5 469,221.5" fill="#475569"/></g>
<g data-step="9"><path class="flow" d="M594 227 L597 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="608,227 597,232.5 597,221.5" fill="#475569"/></g>
<g data-step="10"><path class="flow" d="M722 227 L725 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="736,227 725,232.5 725,221.5" fill="#475569"/></g>
<g data-step="12"><path class="flow" d="M850 227 L853 227" fill="none" stroke="#475569" stroke-width="2"/><polygon points="864,227 853,232.5 853,221.5" fill="#475569"/></g>
<g data-step="3"><path d="M217 82 L217 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="217" cy="227" r="5" fill="#b45309"/></g>
<g data-step="5"><path d="M345 148 L345 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="345" cy="227" r="5" fill="#b45309"/></g>
<g data-step="7"><path d="M473 82 L473 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="473" cy="227" r="5" fill="#b45309"/></g>
<g data-step="11"><path d="M857 82 L857 227" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><circle cx="857" cy="227" r="5" fill="#b45309"/></g>
<g data-step="14"><path d="M153 290 L153 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="153,330 147.5,319 158.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M281 290 L281 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="281,330 275.5,319 286.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M409 290 L409 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="409,330 403.5,319 414.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M537 290 L537 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="537,330 531.5,319 542.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M665 290 L665 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="665,330 659.5,319 670.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M793 290 L793 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="793,330 787.5,319 798.5,319" fill="#b91c1c"/></g>
<g data-step="14"><path d="M872 290 L872 319" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="872,330 866.5,319 877.5,319" fill="#b91c1c"/></g>
<g data-step="13"><path class="flow" d="M933 290 L933 319" fill="none" stroke="#475569" stroke-width="2"/><polygon points="933,330 927.5,319 938.5,319" fill="#475569"/></g>
<g data-step="1" data-info="Die Eingabe: Issue-Text aus --issue, ein GitLab-Issue (glab) oder ein GitHub-Issue (gh). Genau eine Quelle ist erlaubt."><rect x="10" y="197" width="72" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="46" y="232.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="46" dy="0">Issue</tspan></text></g>
<g data-step="2" data-info="Phase 1: Opus 5.5 und Codex entwerfen die Spec parallel, Fable 5.1 führt zusammen, Codex reviewt in bis zu 5 Runden."><rect x="96" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="153" y="207.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="153" dy="0">1 Spec</tspan></text><text x="153" y="224.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="153" dy="0">Dual-Draft</tspan></text><text x="153" y="241.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="153" dy="0">+ Synthese</tspan></text><text x="153" y="258.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="153" dy="0">+ Codex-Review</tspan></text></g>
<g data-step="4" data-info="Phase 2: dasselbe Muster für plan.md und contract.yaml; am Ende werden alle Artefakte in den Run-Ordner archiviert."><rect x="224" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="281" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="281" dy="0">2 Plan +</tspan></text><text x="281" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="281" dy="0">Kontrakt</tspan></text><text x="281" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="281" dy="0">Plan + Kontrakt</tspan></text><text x="281" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="281" dy="0">Dual-Draft</tspan></text><text x="281" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="281" dy="0">+ Codex-Review</tspan></text></g>
<g data-step="6" data-info="Phase 3: ein Build-Agent je Lane im eigenen Worktree; optional RED-Beweis, dann der Gate-Loop. Nur der Orchestrator committet."><rect x="352" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="409" y="207.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="409" dy="0">3 Build</tspan></text><text x="409" y="224.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="409" dy="0">Lanes + RED</tspan></text><text x="409" y="241.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="409" dy="0">Gate-Loop</tspan></text><text x="409" y="258.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="409" dy="0">≤ 10 Iterationen</tspan></text></g>
<g data-step="8" data-info="Phase 4 (nur Parallel-Modus): alle Lanes frisch von der Basis mergen, E2E-Gate laufen lassen, rote Tests an die Lanes zurückgeben."><rect x="480" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="537" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="537" dy="0">4 Integration</tspan></text><text x="537" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="537" dy="0">+ E2E</tspan></text><text x="537" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="537" dy="0">Merge + E2E</tspan></text><text x="537" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="537" dy="0">nur --parallel</tspan></text><text x="537" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="537" dy="0">≤ 10 Runden</tspan></text></g>
<g data-step="9" data-info="Phase 5: Codex reviewt den Diff read-only; Findings über der Schwelle der Runde gehen als Fix-Aufträge zurück an die Lanes."><rect x="608" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="665" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="665" dy="0">5 Codex-</tspan></text><text x="665" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="665" dy="0">Review</tspan></text><text x="665" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="665" dy="0">Diff-Review</tspan></text><text x="665" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="665" dy="0">Schwelle sinkt</tspan></text><text x="665" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="665" dy="0">≤ 5 Runden</tspan></text></g>
<g data-step="10" data-info="Phase 6: Fable 5.1 prüft das Ergebnis gegen die Akzeptanzkriterien; Scope-Lücken werden Follow-ups, alles andere ein Fix."><rect x="736" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="793" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="793" dy="0">6 Finaler</tspan></text><text x="793" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="793" dy="0">Review</tspan></text><text x="793" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="793" dy="0">vs. Spec + DoD</tspan></text><text x="793" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="793" dy="0">Triage per Code</tspan></text><text x="793" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="793" dy="0">≤ 3 Fix-Zyklen</tspan></text></g>
<g data-step="12" data-info="Phase 7: der Orchestrator pusht, pollt die Pipeline gebunden an den gepushten SHA und erlaubt genau einen CI-Fix-Re-Entry."><rect x="864" y="165" width="114" height="125" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="921" y="197.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="921" dy="0">7 Push</tspan></text><text x="921" y="217.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="921" dy="0">+ CI</tspan></text><text x="921" y="234.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="921" dy="0">Push, CI-Poll</tspan></text><text x="921" y="251.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="921" dy="0">SHA-gebunden</tspan></text><text x="921" y="268.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="921" dy="0">1 Re-Entry</tspan></text></g>
<g data-step="3" data-info="Optionaler Halt nach der reviewten Spec. spec-summary.md + spec.md lesen, dann adw approve."><rect x="142.0" y="30" width="150" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="217" y="52.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="217" dy="0">Spec-Gate</tspan></text><text x="217" y="69.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="217" dy="0">--gates spec | both</tspan></text></g>
<g data-step="5" data-info="Der Standard-Halt: plan-summary.md, plan.md und contract.yaml lesen, bevor Code gebaut wird, dann adw approve."><rect x="265.0" y="96" width="160" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="345" y="118.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="345" dy="0">Plan-Gate (Default)</tspan></text><text x="345" y="135.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="345" dy="0">--gates plan | both</tspan></text></g>
<g data-step="7" data-info="Optionaler Breakpoint: alle Lanes sind grün, Merge- und Review-Arbeit hat noch nicht begonnen."><rect x="388.0" y="30" width="170" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="473" y="52.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="473" dy="0">Breakpoint</tspan></text><text x="473" y="69.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="473" dy="0">before_integration</tspan></text></g>
<g data-step="11" data-info="Optionaler Breakpoint nach dem finalen Review, bevor gepusht oder CI angefasst wird."><rect x="782.0" y="30" width="150" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="857" y="52.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="857" dy="0">Breakpoint</tspan></text><text x="857" y="69.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="857" dy="0">before_push</tspan></text></g>
<text x="560" y="116" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="560" dy="0">Jeder Halt beendet den Prozess mit Exit-Code 2;</tspan><tspan x="560" dy="17">adw approve &lt;run_id&gt; setzt den Lauf fort.</tspan></text>
<g data-step="14" data-info="Eine Eskalation ist ein Urteil: Limit, Circuit-Breaker, Merge-Konflikt oder fehlender Beweis. Der Bericht nennt Phase, Lanes und Grund."><rect x="96" y="330" width="782" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="487" y="357.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle"><tspan x="487" dy="0">Jede Phase kann eskalieren → escalation.md · Exit-Code 1 · terminal (neuen Lauf starten)</tspan></text></g>
<g data-step="13" data-info="Pipeline (und Staging-Job) grün für den gepushten SHA: der Lauf ist fertig."><rect x="888" y="330" width="90" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="933" y="349.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="933" dy="0">done</tspan></text><text x="933" y="366.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="933" dy="0">Exit 0</tspan></text></g>
<g><rect x="96" y="412" width="18" height="14" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g>
<text x="120" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="120" dy="0">Orchestrator (deterministischer Code)</tspan></text>
<g><rect x="363.5" y="412" width="18" height="14" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/></g>
<text x="387.5" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="387.5" dy="0">Agent (LLM)</tspan></text>
<g><rect x="485.046875" y="412" width="18" height="14" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/></g>
<text x="509" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="509" dy="0">Gate / Beweis / Erfolg</tspan></text>
<g><rect x="660.78125" y="412" width="18" height="14" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/></g>
<text x="684.8" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="684.8" dy="0">menschlicher Halt</tspan></text>
<g><rect x="814.125" y="412" width="18" height="14" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/></g>
<text x="838.1" y="423.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="838.1" dy="0">Eskalation</tspan></text>
</svg>

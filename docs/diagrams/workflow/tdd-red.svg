<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img">
<title>TDD RED stage</title>
<desc>The proof that new tests fail before the implementation starts (gates with tdd: true).</desc>
<rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M190 90 L209 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="220,90 209,95.5 209,84.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M390 90 L409 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="420,90 409,95.5 409,84.5" fill="#475569"/><text x="405" y="82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="405" dy="0">ok</tspan></text></g>
<g data-step="6"><path class="flow" d="M590 90 L609 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="620,90 609,95.5 609,84.5" fill="#475569"/><text x="605" y="82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="605" dy="0">red</tspan></text></g>
<g data-step="7"><path class="flow" d="M790 90 L809 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="820,90 809,95.5 809,84.5" fill="#475569"/></g>
<g data-step="3"><path d="M305 130 L305 179" fill="none" stroke="#475569" stroke-width="2"/><polygon points="305,190 299.5,179 310.5,179" fill="#475569"/><text x="313" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="313" dy="0">fail</tspan></text></g>
<g data-step="5"><path d="M505 130 L505 179" fill="none" stroke="#475569" stroke-width="2"/><polygon points="505,190 499.5,179 510.5,179" fill="#475569"/><text x="513" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="513" dy="0">green</tspan></text></g>
<g data-step="8"><path class="flow" d="M905 130 L905 179" fill="none" stroke="#475569" stroke-width="2"/><polygon points="905,190 899.5,179 910.5,179" fill="#475569"/></g>
<g data-step="1" data-info="The first agent run of the lane may only write tests, no production code."><rect x="20" y="50" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="105" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="105" dy="0">Test-only run</tspan></text><text x="105" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="105" dy="0">build_agent writes</tspan></text><text x="105" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="105" dy="0">ONLY tests</tspan></text></g>
<g data-step="2" data-info="No change means no tests; a deletion could fake a red result."><rect x="220" y="50" width="170" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="305" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">Orchestrator checks</tspan></text><text x="305" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="305" dy="0">worktree changed?</tspan></text><text x="305" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="305" dy="0">no file deleted?</tspan></text></g>
<g data-step="4" data-info="Only the marked gates run; the RED check does not consume a gate iteration."><rect x="420" y="50" width="170" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="505" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">Run ONLY</tspan></text><text x="505" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="505" dy="0">tdd: true gates</tspan></text><text x="505" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="505" dy="0">(no iteration used)</tspan></text></g>
<g data-step="6" data-info="red_confirmed = true is persisted with the test file paths; a resume never repeats the test-only run."><rect x="620" y="50" width="170" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="705" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="705" dy="0">RED confirmed</tspan></text><text x="705" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="705" dy="0">red_test_paths</tspan></text><text x="705" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="705" dy="0">pinned · snapshot red</tspan></text></g>
<g data-step="7" data-info="The implementation task goes to the same session, with the tail of the red output."><rect x="820" y="50" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="905" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="905" dy="0">Implementation</tspan></text><text x="905" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="905" dy="0">SAME session +</tspan></text><text x="905" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="905" dy="0">last 40 red lines</tspan></text></g>
<g data-step="3" data-info="Without tests there is no RED proof — escalation."><rect x="220" y="190" width="170" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="305" y="209.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">no change → ESCALATE</tspan></text><text x="305" y="226.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">file deleted →</tspan></text><text x="305" y="243.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">ESCALATE</tspan></text></g>
<g data-step="5" data-info="Green tests before the implementation test nothing new — or the behavior already exists."><rect x="420" y="190" width="170" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="505" y="209.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">all green →</tspan></text><text x="505" y="226.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">ESCALATE</tspan></text><text x="505" y="243.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">tests miss the behavior</tspan></text></g>
<g data-step="8" data-info="From here the normal gate loop runs."><rect x="820" y="190" width="170" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="905" y="219.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="905" dy="0">→ gate loop (§8.3)</tspan></text></g>
<g data-step="9" data-info="Checked at the end of the gate loop before the proof is persisted."><rect x="20" y="290" width="960" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="319.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle"><tspan x="500" dy="0">Green gates only count if the RED test files still exist — deleting tests is not a path to green.</tspan></text></g>
</svg>

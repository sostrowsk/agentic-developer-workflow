<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img">
<title>Phase 5: Codex-Code-Review</title>
<desc>Eine Review-Runde und alle Wege, wie sie enden kann.</desc>
<rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M200 215 L229 215" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,215 229,220.5 229,209.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M440 215 L469 215" fill="none" stroke="#475569" stroke-width="2"/><polygon points="480,215 469,220.5 469,209.5" fill="#475569"/></g>
<g data-step="4"><path d="M700 55 L709 55" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,55 709,60.5 709,49.5" fill="#475569"/></g>
<g data-step="4"><path d="M700 115 L709 115" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,115 709,120.5 709,109.5" fill="#475569"/></g>
<g data-step="5"><path d="M700 175 L709 175" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,175 709,180.5 709,169.5" fill="#475569"/></g>
<g data-step="5"><path d="M700 235 L709 235" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,235 709,240.5 709,229.5" fill="#475569"/></g>
<g data-step="4"><path d="M680 215 L700 215" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="4"><path d="M700 55 L700 235" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="6"><path class="flow" d="M580 250 L580 289" fill="none" stroke="#475569" stroke-width="2"/><polygon points="580,300 574.5,289 585.5,289" fill="#475569"/><text x="588" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="588" dy="0">umsetzbar</tspan></text></g>
<g data-step="6"><path class="flow" d="M240 330 L110 330 L110 261" fill="none" stroke="#475569" stroke-width="2"/><polygon points="110,250 115.5,261 104.5,261" fill="#475569"/><text x="118" y="322" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="118" dy="0">Runde n+1</tspan></text></g>
<g data-step="1" data-info="Im Parallel-Modus läuft jede Runde zuerst durch Merge + E2E."><rect x="20" y="180" width="180" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="110" y="203.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="110" dy="0">Runde n (≤ 5)</tspan></text><text x="110" y="220.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="110" dy="0">parallel: erst Merge +</tspan></text><text x="110" y="237.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="110" dy="0">E2E grün</tspan></text></g>
<g data-step="2" data-info="Findings tragen Severity P1–P3, Lane, Datei, Issue und remediation_plan; unlesbare Ausgabe ist eine Eskalation, nie ein stilles ok."><rect x="240" y="180" width="200" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="340" y="203.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="340" dy="0">Codex reviewt</tspan></text><text x="340" y="220.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="340" dy="0">den Diff</tspan></text><text x="340" y="237.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="340" dy="0">read-only · striktes JSON</tspan></text></g>
<g data-step="3" data-info="Reines Python: kein LLM entscheidet, was mit einem Finding passiert."><rect x="480" y="180" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="580" y="203.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">Triage per Code</tspan></text><text x="580" y="220.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">Schwelle sinkt</tspan></text><text x="580" y="237.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">der Runde n</tspan></text></g>
<g data-step="4" data-info="Die Phase ist fertig; weiter mit dem finalen Review."><rect x="720" y="30" width="260" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="850" y="51" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">ok / nur Vertagtes / nichts</tspan></text><text x="850" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">Umsetzbares → final_review</tspan></text></g>
<g data-step="4" data-info="Verworfene Findings gehen nicht verloren: sie werden Kandidaten für Follow-up-Issues."><rect x="720" y="90" width="260" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="850" y="111" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">unter der Schwelle → followups.md</tspan></text><text x="850" y="128.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">(in jeder Runde)</tspan></text></g>
<g data-step="5" data-info="Ein Fix, den niemand mehr reviewen kann, ist Verschwendung."><rect x="720" y="150" width="260" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="850" y="171.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">Runde 5 mit umsetzbaren</tspan></text><text x="850" y="188.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">Findings → ESKALATION</tspan></text></g>
<g data-step="5" data-info="Die vorige Fix-Runde hat nichts geändert."><rect x="720" y="210" width="260" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="850" y="231.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">dieselben Findings wie zuvor</tspan></text><text x="850" y="248.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">→ ESKALATION (Circuit-Breaker)</tspan></text></g>
<g data-step="6" data-info="Reviewer fixen nie: die Build-Agents fixen, danach laufen alle Gates erneut."><rect x="240" y="300" width="440" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="460" y="326.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="460" dy="0">umsetzbare Findings an die Lanes dispatchen</tspan></text><text x="460" y="343.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="460" dy="0">(nach finding.lane) → Gate-Loop → Commit</tspan></text></g>
<text x="20" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="20" dy="0">Ab Runde 2 bekommt Codex alle früheren Findings mit Disposition (Findings-Gedächtnis, §13.1).</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" width="1000" height="920" role="img">
<title>Phase state machine</title>
<desc>All values of the persisted phase field in state.json and their transitions.</desc>
<rect x="0" y="0" width="1000" height="920" fill="#ffffff"/>
<g data-step="2"><path d="M300 52 L140 52 L140 79" fill="none" stroke="#475569" stroke-width="2"/><polygon points="140,90 134.5,79 145.5,79" fill="#475569"/><text x="150" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="150" dy="0">--gates spec | both</tspan></text></g>
<g data-step="3"><path d="M140 134 L140 172 L289 172" fill="none" stroke="#475569" stroke-width="2"/><polygon points="300,172 289,177.5 289,166.5" fill="#475569"/><text x="150" y="192" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="150" dy="0">adw approve</tspan></text></g>
<g data-step="3"><path class="flow" d="M400 74 L400 139" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,150 394.5,139 405.5,139" fill="#475569"/><text x="410" y="117" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="410" dy="0">otherwise</tspan></text></g>
<g data-step="4"><path class="flow" d="M400 194 L400 239" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,250 394.5,239 405.5,239" fill="#475569"/><text x="410" y="227" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="410" dy="0">plan + contract reviewed, archived</tspan></text></g>
<g data-step="5"><path class="flow" d="M400 294 L400 339" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,350 394.5,339 405.5,339" fill="#475569"/><text x="410" y="327" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="410" dy="0">adw approve · or --gates none | spec</tspan></text></g>
<g data-step="6"><path class="flow" d="M370 394 L370 420 L240 420 L240 439" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,450 234.5,439 245.5,439" fill="#475569"/><text x="232" y="413" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="end"><tspan x="232" dy="0">--parallel</tspan></text></g>
<g data-step="7"><path class="flow" d="M240 494 L240 572 L289 572" fill="none" stroke="#475569" stroke-width="2"/><polygon points="300,572 289,577.5 289,566.5" fill="#475569"/></g>
<g data-step="7"><path class="flow" d="M430 394 L430 539" fill="none" stroke="#475569" stroke-width="2"/><polygon points="430,550 424.5,539 435.5,539" fill="#475569"/><text x="440" y="477" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="440" dy="0">single lane</tspan></text></g>
<g data-step="8"><path class="flow" d="M400 594 L400 639" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,650 394.5,639 405.5,639" fill="#475569"/></g>
<g data-step="10"><path class="flow" d="M400 694 L400 739" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,750 394.5,739 405.5,739" fill="#475569"/></g>
<g data-step="11"><path class="flow" d="M400 794 L400 839" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,850 394.5,839 405.5,839" fill="#475569"/><text x="410" y="827" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="410" dy="0">pipeline green</tspan></text></g>
<g data-step="9" data-info="Breakpoints jump back into awaiting_approval (exit 2). adw approve continues in integration / codex_review (before_integration) or in ci (before_push)."><path d="M500 372 L700 372 L700 284 L511 284" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><polygon points="500,284 511,278.5 511,289.5" fill="#b45309"/><text x="710" y="322" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="710" dy="0">breakpoint</tspan><tspan x="710" dy="17">before_integration</tspan></text></g>
<g data-step="9" data-info="Breakpoints jump back into awaiting_approval (exit 2). adw approve continues in integration / codex_review (before_integration) or in ci (before_push)."><path d="M500 672 L850 672 L850 262 L511 262" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/><polygon points="500,262 511,256.5 511,267.5" fill="#b45309"/><text x="860" y="470" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="860" dy="0">breakpoint</tspan><tspan x="860" dy="17">before_push</tspan></text></g>
<g data-step="12"><path d="M840 100 L840 119" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/><polygon points="840,130 834.5,119 845.5,119" fill="#b91c1c"/></g>
<g data-step="1" data-info="Phase 1 is running: drafts, synthesis and the Codex review loop for the spec."><rect x="300" y="30" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="400" y="57.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">spec</tspan></text></g>
<g data-step="3" data-info="Phase 2 is running: plan + contract are drafted, merged and reviewed."><rect x="300" y="150" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="400" y="177.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">plan</tspan></text></g>
<g data-step="4" data-info="Paused (exit 2) at the plan gate — or at a breakpoint, which reuses this phase; pending_breakpoint says which one."><rect x="300" y="250" width="200" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="400" y="277.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">awaiting_approval</tspan></text></g>
<g data-step="5" data-info="Phase 3 is running: lanes build in their worktrees until all gates are green."><rect x="300" y="350" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="400" y="377.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">build</tspan></text></g>
<g data-step="7" data-info="Phase 5: Codex code review rounds."><rect x="300" y="550" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="400" y="577.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">codex_review</tspan></text></g>
<g data-step="8" data-info="Phase 6: final review against spec and contract, triage."><rect x="300" y="650" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="400" y="677.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">final_review</tspan></text></g>
<g data-step="10" data-info="Phase 7: push and CI polling, at most one re-entry."><rect x="300" y="750" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="400" y="777.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">ci</tspan></text></g>
<g data-step="11" data-info="Terminal success state (exit 0)."><rect x="300" y="850" width="200" height="44" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="400" y="877.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="400" dy="0">done</tspan></text></g>
<g data-step="2" data-info="Paused (exit 2) after the reviewed spec — only with --gates spec or both."><rect x="30" y="90" width="220" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="140" y="116.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="140" dy="0">awaiting_spec_approval</tspan></text></g>
<g data-step="6" data-info="Phase 4, only with --parallel: merge all lanes + E2E gate."><rect x="140" y="450" width="200" height="44" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="477.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">integration</tspan></text></g>
<g data-step="9" data-info="Breakpoints jump back into awaiting_approval (exit 2). adw approve continues in integration / codex_review (before_integration) or in ci (before_push)."><rect x="600" y="730" width="380" height="96" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="610" y="757" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="610" dy="0">Breakpoints reuse awaiting_approval.</tspan></text><text x="610" y="774" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="610" dy="0">adw approve continues in</tspan></text><text x="610" y="791" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="610" dy="0">integration | codex_review</tspan></text><text x="610" y="808" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="start"><tspan x="610" dy="0">or ci (before_push).</tspan></text></g>
<g data-step="12"><text x="840" y="92" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="840" dy="0">from any phase</tspan></text></g>
<g data-step="12" data-info="Escalation can happen in every phase. escalated is terminal: resume is refused, a new run starts from scratch."><rect x="720" y="130" width="240" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="840" y="156.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="840" dy="0">escalated</tspan></text><text x="840" y="173.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="840" dy="0">terminal — start a new run</tspan></text></g>
</svg>

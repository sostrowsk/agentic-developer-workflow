<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img">
<title>The gate loop</title>
<desc>One lane task: agent run, guards, gates, proof and commit — or the next iteration.</desc>
<rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M240 66 L240 71" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,82 234.5,71 245.5,71" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M240 128 L240 133" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,144 234.5,133 245.5,133" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M240 190 L240 195" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,206 234.5,195 245.5,195" fill="#475569"/></g>
<g data-step="5"><path class="flow" d="M240 252 L240 257" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,268 234.5,257 245.5,257" fill="#475569"/></g>
<g data-step="6"><path class="flow" d="M240 314 L240 319" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,330 234.5,319 245.5,319" fill="#475569"/></g>
<g data-step="7"><path class="flow" d="M240 376 L240 381" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,392 234.5,381 245.5,381" fill="#475569"/></g>
<g data-step="1"><path d="M410 43 L459 43" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="470,43 459,48.5 459,37.5" fill="#b91c1c"/></g>
<g data-step="4"><path d="M410 229 L459 229" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="470,229 459,234.5 459,223.5" fill="#b91c1c"/></g>
<g data-step="6"><path d="M410 353 L459 353" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="470,353 459,358.5 459,347.5" fill="#b91c1c"/></g>
<g data-step="8"><path class="flow" d="M410 415 L459 415" fill="none" stroke="#475569" stroke-width="2"/><polygon points="470,415 459,420.5 459,409.5" fill="#475569"/><text x="440" y="407" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="440" dy="0">green</tspan></text></g>
<g data-step="8"><path class="flow" d="M710 415 L739 415" fill="none" stroke="#475569" stroke-width="2"/><polygon points="750,415 739,420.5 739,409.5" fill="#475569"/></g>
<g data-step="9"><path class="flow" d="M240 438 L240 469" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,480 234.5,469 245.5,469" fill="#475569"/><text x="248" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="248" dy="0">red</tspan></text></g>
<g data-step="9"><path d="M410 503 L459 503" fill="none" stroke="#b91c1c" stroke-width="2"/><polygon points="470,503 459,508.5 459,497.5" fill="#b91c1c"/><text x="440" y="495" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="440" dy="0">yes</tspan></text></g>
<g data-step="10"><path class="flow" d="M240 526 L240 549" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,560 234.5,549 245.5,549" fill="#475569"/><text x="248" y="548" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="248" dy="0">no</tspan></text></g>
<g data-step="10" data-info="Next iteration: back to the limit check."><path class="flow" d="M70 588 L40 588 L40 43 L59 43" fill="none" stroke="#475569" stroke-width="2"/><polygon points="70,43 59,48.5 59,37.5" fill="#475569"/></g>
<g data-step="1" data-info="10 iterations per task; a new dispatched fix task gets a fresh budget."><rect x="70" y="20" width="340" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="47.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">limit check: iteration ≤ 10?</tspan></text></g>
<g data-step="2" data-info="Persisted before the expensive step, so a crash cannot lose or reset anything."><rect x="70" y="82" width="340" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="101" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">checkpoint (expected HEAD, counter)</tspan></text><text x="240" y="118" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">snapshot before_agent</tspan></text></g>
<g data-step="3" data-info="Opus 4.8 works only inside its lane worktree; snapshot after_agent afterwards."><rect x="70" y="144" width="340" height="46" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="240" y="163.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">build agent — same session</tspan></text><text x="240" y="180.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">task: implement / fix gate failures</tspan></text></g>
<g data-step="4" data-info="Agents may not commit or switch branches."><rect x="70" y="206" width="340" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="225.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">guards: no agent commit,</tspan></text><text x="240" y="242.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">still on the lane branch</tspan></text></g>
<g data-step="5" data-info="The approved artifacts are immutable for agents."><rect x="70" y="268" width="340" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="287.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">restore spec / plan / contract</tspan></text><text x="240" y="304.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">+ config.yaml</tspan></text></g>
<g data-step="6" data-info="An idle agent must not pass as success."><rect x="70" y="330" width="340" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="357.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">1st iteration: anything changed?</tspan></text></g>
<g data-step="7" data-info="Your lint/test commands; output bounded to the last 200 lines; snapshot after_gates."><rect x="70" y="392" width="340" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="240" y="411.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">run all lane gates in order</tspan></text><text x="240" y="428.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">fail fast · real timeouts</tspan></text></g>
<g data-step="1"><rect x="470" y="20" width="280" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="610" y="47.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">exceeded → ESCALATE</tspan></text></g>
<g data-step="4"><rect x="470" y="206" width="280" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="610" y="225.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">agent commit / branch switch</tspan></text><text x="610" y="242.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">→ ESCALATE</tspan></text></g>
<g data-step="6"><rect x="470" y="330" width="280" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="610" y="349.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">no change → ESCALATE</tspan></text><text x="610" y="366.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">(pure-P3 fix findings → deferred)</tspan></text></g>
<g data-step="8" data-info="Deleting the RED tests is not a path to green."><rect x="470" y="392" width="240" height="46" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="590" y="411.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="590" dy="0">green → RED tests</tspan></text><text x="590" y="428.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="590" dy="0">still present?</tspan></text></g>
<g data-step="8" data-info="The proof is bound to the worktree hash and saved before the commit; resume trusts it only if the tree still matches."><rect x="750" y="380" width="230" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="865" y="402.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="865" dy="0">persist gates_passed</tspan></text><text x="865" y="419.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="865" dy="0">+ tree hash → orchestrator</tspan></text><text x="865" y="436.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="865" dy="0">commit</tspan></text></g>
<g data-step="9" data-info="Compares gate, exit code and output with the previous iteration."><rect x="70" y="480" width="340" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="499.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">red: same failures as</tspan></text><text x="240" y="516" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">last iteration?</tspan></text></g>
<g data-step="9"><rect x="470" y="480" width="280" height="46" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="610" y="499.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">yes → ESCALATE</tspan></text><text x="610" y="516" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="610" dy="0">(circuit breaker)</tspan></text></g>
<g data-step="10" data-info="The next iteration starts in the same session with the failing gate output."><rect x="70" y="560" width="340" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="240" y="584" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">new task: “Gates failed —</tspan></text><text x="240" y="601" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="240" dy="0">fix the root cause” + gate output</tspan></text></g>
</svg>

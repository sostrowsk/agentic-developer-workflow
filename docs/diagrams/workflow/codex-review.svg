<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img">
<title>Phase 5: Codex code review</title>
<desc>One review round and every way it can end.</desc>
<rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M200 215 L229 215" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,215 229,220.5 229,209.5" fill="#475569"/></g>
<g data-step="3"><path class="flow" d="M440 215 L469 215" fill="none" stroke="#475569" stroke-width="2"/><polygon points="480,215 469,220.5 469,209.5" fill="#475569"/></g>
<g data-step="4"><path d="M700 55 L709 55" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,55 709,60.5 709,49.5" fill="#475569"/></g>
<g data-step="4"><path d="M700 115 L709 115" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,115 709,120.5 709,109.5" fill="#475569"/></g>
<g data-step="5"><path d="M700 175 L709 175" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,175 709,180.5 709,169.5" fill="#475569"/></g>
<g data-step="5"><path d="M700 235 L709 235" fill="none" stroke="#475569" stroke-width="2"/><polygon points="720,235 709,240.5 709,229.5" fill="#475569"/></g>
<g data-step="4"><path d="M680 215 L700 215" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="4"><path d="M700 55 L700 235" fill="none" stroke="#475569" stroke-width="2"/></g>
<g data-step="6"><path class="flow" d="M580 250 L580 289" fill="none" stroke="#475569" stroke-width="2"/><polygon points="580,300 574.5,289 585.5,289" fill="#475569"/><text x="588" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="588" dy="0">actionable</tspan></text></g>
<g data-step="6"><path class="flow" d="M240 330 L110 330 L110 261" fill="none" stroke="#475569" stroke-width="2"/><polygon points="110,250 115.5,261 104.5,261" fill="#475569"/><text x="118" y="322" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="118" dy="0">round n+1</tspan></text></g>
<g data-step="1" data-info="In parallel mode every round first goes through merge + E2E."><rect x="20" y="180" width="180" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="110" y="203.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="110" dy="0">round n (≤ 5)</tspan></text><text x="110" y="220.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="110" dy="0">parallel: merge +</tspan></text><text x="110" y="237.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="110" dy="0">E2E green first</tspan></text></g>
<g data-step="2" data-info="Findings carry severity P1–P3, lane, file, issue and remediation_plan; unreadable output is an escalation, never a silent ok."><rect x="240" y="180" width="200" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="340" y="203.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="340" dy="0">Codex reviews</tspan></text><text x="340" y="220.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="340" dy="0">the diff</tspan></text><text x="340" y="237.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="340" dy="0">read-only · strict JSON</tspan></text></g>
<g data-step="3" data-info="Pure Python: no LLM decides what happens with a finding."><rect x="480" y="180" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="580" y="203.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="580" dy="0">triage by code</tspan></text><text x="580" y="220.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">severity floor</tspan></text><text x="580" y="237.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="580" dy="0">of round n</tspan></text></g>
<g data-step="4" data-info="The phase is done; continue with the final review."><rect x="720" y="30" width="260" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="850" y="51" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">ok / only deferred / nothing</tspan></text><text x="850" y="68" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">actionable → final_review</tspan></text></g>
<g data-step="4" data-info="Dropped findings are not lost: they become candidate follow-up issues."><rect x="720" y="90" width="260" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="850" y="111" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">below the floor → followups.md</tspan></text><text x="850" y="128.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">(in every round)</tspan></text></g>
<g data-step="5" data-info="A fix that nobody can re-review is waste."><rect x="720" y="150" width="260" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="850" y="171.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">round 5 with actionable</tspan></text><text x="850" y="188.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">findings → ESCALATE</tspan></text></g>
<g data-step="5" data-info="The previous fix round changed nothing."><rect x="720" y="210" width="260" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="850" y="231.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">same findings as last round</tspan></text><text x="850" y="248.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="850" dy="0">→ ESCALATE (circuit breaker)</tspan></text></g>
<g data-step="6" data-info="Reviewers never fix: the build agents fix, then all gates run again."><rect x="240" y="300" width="440" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="460" y="326.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="460" dy="0">dispatch actionable findings to the lanes</tspan></text><text x="460" y="343.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="460" dy="0">(by finding.lane) → gate loop → commit</tspan></text></g>
<text x="20" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="20" dy="0">From round 2 Codex gets every earlier finding with its disposition (findings memory, §13.1).</tspan></text>
</svg>

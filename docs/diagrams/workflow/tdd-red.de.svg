<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img">
<title>TDD-RED-Stufe</title>
<desc>Der Beweis, dass neue Tests vor der Implementierung rot sind (Gates mit tdd: true).</desc>
<rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
<g data-step="2"><path class="flow" d="M190 90 L209 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="220,90 209,95.5 209,84.5" fill="#475569"/></g>
<g data-step="4"><path class="flow" d="M390 90 L409 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="420,90 409,95.5 409,84.5" fill="#475569"/><text x="405" y="82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="405" dy="0">ok</tspan></text></g>
<g data-step="6"><path class="flow" d="M590 90 L609 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="620,90 609,95.5 609,84.5" fill="#475569"/><text x="605" y="82" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="605" dy="0">rot</tspan></text></g>
<g data-step="7"><path class="flow" d="M790 90 L809 90" fill="none" stroke="#475569" stroke-width="2"/><polygon points="820,90 809,95.5 809,84.5" fill="#475569"/></g>
<g data-step="3"><path d="M305 130 L305 179" fill="none" stroke="#475569" stroke-width="2"/><polygon points="305,190 299.5,179 310.5,179" fill="#475569"/><text x="313" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="313" dy="0">Fehler</tspan></text></g>
<g data-step="5"><path d="M505 130 L505 179" fill="none" stroke="#475569" stroke-width="2"/><polygon points="505,190 499.5,179 510.5,179" fill="#475569"/><text x="513" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="start"><tspan x="513" dy="0">grün</tspan></text></g>
<g data-step="8"><path class="flow" d="M905 130 L905 179" fill="none" stroke="#475569" stroke-width="2"/><polygon points="905,190 899.5,179 910.5,179" fill="#475569"/></g>
<g data-step="1" data-info="Der erste Agent-Lauf der Lane darf nur Tests schreiben, keinen Produktivcode."><rect x="20" y="50" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="105" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="105" dy="0">Nur-Test-Lauf</tspan></text><text x="105" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="105" dy="0">build_agent schreibt</tspan></text><text x="105" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="105" dy="0">NUR Tests</tspan></text></g>
<g data-step="2" data-info="Keine Änderung heißt keine Tests; eine Löschung könnte Rot vortäuschen."><rect x="220" y="50" width="170" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="305" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">Orchestrator prüft</tspan></text><text x="305" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="305" dy="0">Worktree geändert?</tspan></text><text x="305" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="305" dy="0">nichts gelöscht?</tspan></text></g>
<g data-step="4" data-info="Nur die markierten Gates laufen; der RED-Check verbraucht keine Gate-Iteration."><rect x="420" y="50" width="170" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="505" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">NUR Gates mit</tspan></text><text x="505" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="505" dy="0">tdd: true</tspan></text><text x="505" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="505" dy="0">(keine Iteration)</tspan></text></g>
<g data-step="6" data-info="red_confirmed = true wird mit den Testpfaden persistiert; ein Resume wiederholt den Nur-Test-Lauf nie."><rect x="620" y="50" width="170" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="705" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="705" dy="0">RED bestätigt</tspan></text><text x="705" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="705" dy="0">red_test_paths</tspan></text><text x="705" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="705" dy="0">gepinnt · Snapshot red</tspan></text></g>
<g data-step="7" data-info="Der Implementierungs-Auftrag geht in dieselbe Session, mit dem Ende der Rot-Ausgabe."><rect x="820" y="50" width="170" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="905" y="78.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="905" dy="0">Implementierung</tspan></text><text x="905" y="95.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="905" dy="0">DIESELBE Session +</tspan></text><text x="905" y="112.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="905" dy="0">letzte 40 Rot-Zeilen</tspan></text></g>
<g data-step="3" data-info="Ohne Tests kein RED-Beweis — Eskalation."><rect x="220" y="190" width="170" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="305" y="209.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">keine Änderung →</tspan></text><text x="305" y="226.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">ESKALATION; Löschung</tspan></text><text x="305" y="243.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="305" dy="0">→ ESKALATION</tspan></text></g>
<g data-step="5" data-info="Grüne Tests vor der Implementierung testen nichts Neues — oder das Verhalten existiert schon."><rect x="420" y="190" width="170" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="505" y="209.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">alles grün →</tspan></text><text x="505" y="226.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">ESKALATION</tspan></text><text x="505" y="243.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle"><tspan x="505" dy="0">Tests verfehlen Verhalten</tspan></text></g>
<g data-step="8" data-info="Ab hier läuft der normale Gate-Loop."><rect x="820" y="190" width="170" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="905" y="219.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle"><tspan x="905" dy="0">→ Gate-Loop (§8.3)</tspan></text></g>
<g data-step="9" data-info="Geprüft am Ende des Gate-Loops, bevor der Beweis persistiert wird."><rect x="20" y="290" width="960" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="500" y="319.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle"><tspan x="500" dy="0">Grüne Gates zählen nur, wenn die RED-Testdateien noch existieren — Tests löschen ist kein Weg zu Grün.</tspan></text></g>
</svg>

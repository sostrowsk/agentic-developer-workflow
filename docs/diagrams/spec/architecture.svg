<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img">
<title>ADW architecture: CLI, phase engine, judgment and deterministic core, observability, GUI</title>
<desc>Layered view of the adw package; observability is fail-open and the GUI reads it read-only.</desc>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<g data-step="1" data-info="The seven CLI commands. All of them go through cli.py; the exit codes are 0 done, 2 paused at a gate or breakpoint, 1 escalation or error."><rect x="190" y="16" width="480" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="430.0" y="41.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">adw run · resume · approve · status · gui · runs</text></g>
<g data-step="2"><path class="flow" d="M430 56 L430.0 73.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="430,84 423.9,73.0 436.1,73.0" fill="#475569"/></g>
<g data-step="2" data-info="Entry point: resolves --gates vs. legacy flags, fetches the issue (text, glab, gh), runs the working-tree preflight with self-heal, holds the per-run lock and wires mocks for --dry-run."><rect x="190" y="84" width="480" height="86" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="430.0" y="114.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">cli.py (typer)</text><text x="430.0" y="132.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">arg validation · gate modes · preflight</text><text x="430.0" y="150.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">run lock · dry-run wiring · exit codes 0/2/1</text></g>
<g data-step="3"><path class="flow" d="M430 170 L430.0 193.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="430,204 423.9,193.0 436.1,193.0" fill="#475569"/><text x="440" y="192" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0369a1">RunContext</text></g>
<g data-step="3" data-info="Owns every loop and limit. Each phase function checks ctx.state.phase and returns when it is not its turn, so a resume needs no dispatcher."><rect x="190" y="204" width="480" height="86" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="430.0" y="234.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">phases.py — the seven phases</text><text x="430.0" y="252.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">loops · limits · dispatch · triage</text><text x="430.0" y="270.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">escalation · approval gates · breakpoints</text></g>
<g data-step="4"><path class="flow" d="M300 290 L145.3 346.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="135,350 143.3,340.6 147.4,351.9" fill="#475569"/><path class="flow" d="M400 290 L370.5 340.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="365,350 365.3,337.5 375.8,343.5" fill="#475569"/></g>
<g data-step="5"><path class="flow" d="M560 290 L526.1 340.8" stroke="#475569" stroke-width="2" fill="none"/><polygon points="520,350 521.1,337.5 531.1,344.2" fill="#475569"/></g>
<text x="250" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6d28d9">judgment (agents)</text>
<text x="540" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0369a1">deterministic core (0 tokens)</text>
<g data-step="4" data-info="Agent registry and the SDK runner. Claude is reached only through the Claude Code CLI with the stored login; API keys are blanked (P9)."><rect x="30" y="350" width="210" height="120" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="135.0" y="380.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">agents.py</text><text x="135.0" y="397.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">SdkAgentRunner</text><text x="135.0" y="414.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Agent SDK →</text><text x="135.0" y="431.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Claude Code CLI</text><text x="135.0" y="448.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">stored login · Bash sandbox</text></g>
<g data-step="4" data-info="Codex as a read-only subprocess for reviews and drafts. Drafts come back as marker blocks with a per-call nonce; the orchestrator writes the files."><rect x="260" y="350" width="210" height="120" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="365.0" y="380.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">codex.py</text><text x="365.0" y="397.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">CodexRunner</text><text x="365.0" y="414.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">codex exec</text><text x="365.0" y="431.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">--sandbox read-only</text><text x="365.0" y="448.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">isolated CODEX_HOME</text></g>
<g data-step="5" data-info="Pure Python, no tokens: strict config, atomic RunState, findings parser, gate runner, lane worktrees, limit checks, CI polling, env whitelist and mocks."><rect x="490" y="350" width="240" height="150" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="610.0" y="394.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">core modules</text><text x="610.0" y="412.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">config · state · findings</text><text x="610.0" y="430.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">gates · worktrees · triage</text><text x="610.0" y="448.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">ci · github · forge · env</text><text x="610.0" y="466.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">mock (dry run, tests)</text></g>
<g data-step="6"><path d="M670 247 L741.0 247.0" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4"/><polygon points="752,247 741.0,253.1 741.0,240.9" fill="#475569"/><text x="711" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">emits</text></g>
<g data-step="6" data-info="Event log, step snapshots and retention. Fail-open: no error here can change a run's outcome — state.json, not the log, is the resume authority."><rect x="752" y="164" width="192" height="160" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="848.0" y="206.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">observability</text><text x="848.0" y="223.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">events.py → events.jsonl</text><text x="848.0" y="240.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">snapshots.py →</text><text x="848.0" y="257.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">refs/adw/&lt;id&gt;/&lt;seq&gt;</text><text x="848.0" y="274.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">retention.py</text><text x="848.0" y="291.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">fail-open</text></g>
<g data-step="7"><path d="M848 324 L848.0 369.0" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4"/><polygon points="848,380 842.0,369.0 854.0,369.0" fill="#475569"/><text x="860" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">reads</text></g>
<g data-step="7" data-info="The Run Inspector. Optional dependencies, never imported by the core run path; reads events, state and artifacts, writes nothing, loopback by default."><rect x="752" y="380" width="192" height="120" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="848.0" y="419.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">gui/ — extra adw[gui]</text><text x="848.0" y="436.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">reader · model · registry</text><text x="848.0" y="453.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">app (FastAPI) · i18n</text><text x="848.0" y="470.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">read-only · loopback</text></g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img">
<title>Wer was schreiben darf: Agents, Reviewer und der Orchestrator</title>
<desc>Autoren schreiben nur ihre Artefakte, der Build-Agent nur seinen Worktree, Reviewer nichts; nur der Orchestrator committet und schreibt den Lauf-State.</desc>
<rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
<g data-step="1" data-info="Artefakt-genaue Schreibregeln (Write(.adw/spec.md), nie .adw/**). Codex-Entwürfe kommen als Marker-Blöcke; der Orchestrator schreibt sie nach drafts/."><rect x="30" y="24" width="280" height="128" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="40" y="45" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Autoren (Phasen 1–2)</text><text x="40" y="65" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">spec_agent · plan_agent (Opus 5.5)</text><text x="40" y="83" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">spec/plan_synthesis (Fable 5.1)</text><text x="40" y="101" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">schreiben exakt: .adw/spec.md, plan.md,</text><text x="40" y="119" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">contract.yaml, *-summary.md</text></g>
<g data-step="2" data-info="Hält alle Beweise (P7): gates_passed + gates_tree, red_confirmed, expected_head. Jede Behauptung, die ein Agent machen könnte, wird hier stattdessen bewiesen."><rect x="350" y="170" width="260" height="128" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="360" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Orchestrator (deterministisch)</text><text x="360" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">der Einzige, der committet</text><text x="360" y="229" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">fährt Gates · berechnet Tree-Hash</text><text x="360" y="247" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">schreibt state.json · events.jsonl</text><text x="360" y="265" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">stellt geschützte Artefakte her</text></g>
<g data-step="2"><path class="flow" d="M310 110 L390.8 163.9" stroke="#475569" stroke-width="2" fill="none"/><polygon points="400,170 387.5,168.9 394.2,158.9" fill="#475569"/><text x="350" y="128" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Artefakte</text></g>
<g data-step="3" data-info="Die einzige Rolle, die Code ändert. Ein Commit, Branch-Wechsel oder HEAD-Sprung durch den Agent wird erkannt und eskaliert (I1)."><rect x="30" y="316" width="280" height="128" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="40" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Build-Agent (Phase 3 + jeder Fix)</text><text x="40" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">build_agent (Opus 5.5)</text><text x="40" y="375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">schreibt ./** im eigenen Worktree</text><text x="40" y="393" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Bash in Sandbox · committet nie</text><text x="40" y="411" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Worktrees anderer Lanes unlesbar</text></g>
<g data-step="3"><path class="flow" d="M380 298 L319.9 327.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="310,332 317.3,321.8 322.5,332.6" fill="#475569"/><text x="345" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#475569">Fix-Aufgabe</text></g>
<g data-step="3"><path class="flow" d="M310 410 L461.0 304.3" stroke="#475569" stroke-width="2" fill="none"/><polygon points="470,298 464.5,309.3 457.5,299.4" fill="#475569"/><text x="392" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">geänderter Worktree</text></g>
<g data-step="4" data-info="Sie antworten nur mit Findings-JSON im gemeinsamen Schema. Nicht parsebare oder schemawidrige Antworten eskalieren — nie ein implizites ok (P2, P6)."><rect x="650" y="24" width="280" height="128" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="660" y="45" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Reviewer (read-only)</text><text x="660" y="65" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">codex (gpt-6-astra), read-only</text><text x="660" y="83" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">final_reviewer (Fable 5.1)</text><text x="660" y="101" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">e2e_triage · log_analyst (Sonnet 5.5)</text><text x="660" y="119" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Tools: nur Read · Grep · Glob</text></g>
<g data-step="4"><path class="flow" d="M650 110 L569.2 163.9" stroke="#475569" stroke-width="2" fill="none"/><polygon points="560,170 565.8,158.9 572.5,168.9" fill="#475569"/><text x="610" y="128" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#475569">Findings-JSON</text></g>
<g data-step="5" data-info="SECRET_STORE_DENY_RULES und .adw/runs/** sind für alle Agents gesperrt; Config und reviewte Artefakte werden nach jedem Agent-Lauf byte-genau wiederhergestellt."><rect x="650" y="316" width="280" height="128" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="660" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Geschützt für jeden Agent</text><text x="660" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">~/.ssh ~/.aws ~/.claude ~/.config …</text><text x="660" y="375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">.adw/runs/** (State, Events)</text><text x="660" y="393" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">config.yaml · reviewte Spec/Plan</text><text x="660" y="411" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Deny schlägt Allow</text></g>
<g data-step="5"><path class="flow" d="M560 298 L640.5 344.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="650,350 637.4,349.7 643.5,339.3" fill="#475569"/><text x="585" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#475569">schreibt · stellt her</text></g>
<g data-step="5"><path d="M310 430 L639.0 430.0" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6 4"/><polygon points="650,430 639.0,436.1 639.0,423.9" fill="#b91c1c"/><text x="480" y="422" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#b91c1c">gesperrt</text></g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img">
<title>ADW-Philosophie: Prinzipien P1–P15 und die Fehlermodi, die sie schließen</title>
<desc>Oben zwei Fehlermodi agentischen Programmierens; vier Spalten gruppieren die fünfzehn Prinzipien nach dem, was sie schützen.</desc>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<g data-step="1" data-info="Sich selbst überlassen dreht ein Agent Schleifen, überspringt Prüfungen oder erklärt sich zu früh zum Sieger. ADW nimmt ihm den Kontrollfluss weg: Loops, Limits und Dispatch sind Python."><rect x="30" y="20" width="430" height="62" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="245.0" y="46.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Fehlermodus 1</text><text x="245.0" y="66.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0f172a">Der Agent bestimmt den Kontrollfluss</text></g>
<g data-step="1" data-info="Ein Agent, der sein eigenes Ergebnis reviewt oder meldet, benotet seine eigenen Hausaufgaben. ADW trennt die Rollen; nur der Orchestrator hält die Beweise."><rect x="500" y="20" width="430" height="62" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="715.0" y="46.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Fehlermodus 2</text><text x="715.0" y="66.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0f172a">Der Agent bewertet seine eigene Arbeit</text></g>
<g data-step="2"><path class="flow" d="M245 82 L144.5 140.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="135,146 141.5,135.2 147.6,145.7" fill="#475569"/><text x="212" y="118" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">geschlossen durch</text></g>
<g data-step="4"><path class="flow" d="M715 82 L604.7 140.8" stroke="#475569" stroke-width="2" fill="none"/><polygon points="595,146 601.9,135.5 607.6,146.2" fill="#475569"/><text x="672" y="118" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">geschlossen durch</text></g>
<g data-step="2" data-info="Der Kontrollfluss lebt im Code: begrenzt, testbar und mit definiertem Ende — fertig, pausiert oder eskaliert."><rect x="30" y="148" width="210" height="52" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="135.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Deterministische Kontrolle</text><text x="135.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">schließt Fehlermodus 1</text></g>
<g data-step="2" data-info="P1 — Loops, Gates, Merges, Dispatch, Triage, Limits und CI-Polling sind Python. Agents bekommen eine Aufgabe und liefern Text — eine while-Schleife mit Zähler kann 'bestanden' nicht umdeuten."><rect x="30" y="214" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P1</text><text x="42" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Kontrollfluss ist Code,</text><text x="42" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">nicht Prompt</text></g>
<g data-step="2" data-info="P4 — Jede Schleife hat ein hartes, persistiertes Limit, geprüft vor der Arbeit. Ein Circuit-Breaker stoppt eine Runde mit derselben Fehlermenge wie zuvor."><rect x="30" y="306" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P4</text><text x="42" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Alles begrenzt;</text><text x="42" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Stillstand erkannt</text></g>
<g data-step="2" data-info="P5 — Limit, Konflikt, Parse-Fehler oder verletzte Invariante beenden den Lauf kontrolliert: escalation.md, Phase escalated, Exit 1. Eskalierte Läufe sind endgültig."><rect x="30" y="398" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P5</text><text x="42" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Eskalation ist ein</text><text x="42" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">vollwertiges Ergebnis</text></g>
<g data-step="2" data-info="P11 — Single-Lane ist der Parallel-Modus mit einer Lane. --dry-run spritzt Mocks in den Produktionspfad — Config und Ablauf lassen sich mit 0 Tokens abnehmen."><rect x="30" y="490" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="513" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P11</text><text x="42" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Ein Codepfad; Dry-Run</text><text x="42" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">ist Produkt-Feature</text></g>
<g data-step="3" data-info="Was ein Agent auch falsch macht oder wozu er verleitet wird, diese Prinzipien begrenzen den Schaden: strikte Eingaben, minimale Rechte, Plan-Abrechnung, Crash-Sicherheit."><rect x="260" y="148" width="210" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="365.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Sicherheit &amp; Kosten</text><text x="365.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">begrenzt den Schadensradius</text></g>
<g data-step="3" data-info="P6 — Fehlende oder ungültige Config bricht ab, bevor etwas startet; Parser akzeptieren genau eine Form. Ein Parse-Fehler ist sicher, ein falsches 'ok' liefert kaputten Code aus."><rect x="260" y="214" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P6</text><text x="272" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Fail fast,</text><text x="272" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">nie raten</text></g>
<g data-step="3" data-info="P8 — Kleinstes Tool-Set, artefakt-genaue Schreibregeln, Secret-Stores gesperrt, Lauf-State unschreibbar, Bash in der Sandbox, Env-Whitelist — Agents lesen nicht vertrauenswürdige Inhalte."><rect x="260" y="306" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P8</text><text x="272" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Minimale Rechte</text><text x="272" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">für Agents</text></g>
<g data-step="3" data-info="P9 — Claude nur über die Claude-Code-CLI mit gespeichertem Login; API-Keys werden geleert. Ein abgebrochener Agent-Aufruf (Plan-Limit) lässt den Lauf fortsetzbar."><rect x="260" y="398" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P9</text><text x="272" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Abrechnung über den Plan,</text><text x="272" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">nie über die API</text></g>
<g data-step="3" data-info="P10 — Jeder Übergang wird atomar gesichert; Budgets zusammen mit der Arbeit, die sie bezahlen. Billiger Zustand (Integrations-Branch) wird neu gebaut statt interpretiert."><rect x="260" y="490" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="513" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P10</text><text x="272" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Crash-sicher per</text><text x="272" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Konstruktion</text></g>
<g data-step="4" data-info="Reviewer melden nur, Builder bauen nur, und jede Erfolgsbehauptung beweist der Orchestrator, bevor sie zählt."><rect x="490" y="148" width="210" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="595.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Trennung &amp; Beweise</text><text x="595.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">schließt Fehlermodus 2</text></g>
<g data-step="4" data-info="P2 — Codex, finaler Reviewer, E2E-Triage und Log-Analyst sind read-only und antworten nur mit Findings. Fixes macht immer der Build-Agent der Lane."><rect x="490" y="214" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P2</text><text x="502" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Reviewer</text><text x="502" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">fixen nie</text></g>
<g data-step="4" data-info="P3 — Jeder Fix läuft durch den Build-Agent und dann durch alle Gates der Lane — im Parallel-Modus erneut durch Merge + E2E. 'Klein' ist eine Meinung, keine Messung."><rect x="490" y="306" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P3</text><text x="502" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Jeder Fix nimmt den</text><text x="502" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">validierten Weg</text></g>
<g data-step="4" data-info="P7 — Grüne Gates sind an einen Tree-Hash gebunden, RED wird bewiesen, HEAD und Branch werden geprüft. Nur der Orchestrator committet — Agent-Aussagen sind fälschbar."><rect x="490" y="398" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P7</text><text x="502" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Prüfen statt vertrauen:</text><text x="502" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Beweise beim Orchestrator</text></g>
<g data-step="4" data-info="P13 — Runde 1 fixt P1–P3, Runde 2 P1–P2, ab Runde 3 nur P1; Dispositionen gehen als Gedächtnis mit; nach 5 Runden eskaliert ein offenes P1."><rect x="490" y="490" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="513" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P13</text><text x="502" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Review-Loops konvergieren</text><text x="502" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">per Policy (Cap 5)</text></g>
<g data-step="5" data-info="Wie ADW selbst entwickelt wird: Tests mit echtem git ohne Tokens, verhältnismäßiger Scope, zweisprachige Doku, mit dem Code released."><rect x="720" y="148" width="210" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="825.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Entwicklungs-Hygiene</text><text x="825.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">hält es dauerhaft wahr</text></g>
<g data-step="5" data-info="P12 — Kein Test braucht Netz oder Tokens; Agents, Codex, glab und gh sind gemockt, git läuft in Wegwerf-Repos. Test-first, Regressionstest je Bugfix."><rect x="720" y="214" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="732" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P12</text><text x="732" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Tests nur mit Mocks,</text><text x="732" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">git ist echt</text></g>
<g data-step="5" data-info="P14 — Jedes Akzeptanzkriterium führt aufs Issue zurück; gemeinsame Inhaltsregeln binden beide Autoren und die Synthese. Scope-Lücken werden Follow-ups."><rect x="720" y="306" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="732" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P14</text><text x="732" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Verhältnismäßigkeit:</text><text x="732" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">bauen, was verlangt ist</text></g>
<g data-step="5" data-info="P15 — Englisch als Default, Deutsch als .de.-Variante, synchron. Jeder Push nach main ist ein Release mit Versions-Bump, Changelog (EN+DE) und Tag."><rect x="720" y="398" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="732" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P15</text><text x="732" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Doku zweisprachig,</text><text x="732" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">mit dem Code versioniert</text></g>
</svg>

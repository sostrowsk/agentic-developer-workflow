<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img">
<title>Security model: layers between untrusted input and protected assets</title>
<desc>Untrusted input reaches agents and subprocesses; eight layers from §12 stand between it and the assets ADW protects.</desc>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<g data-step="1" data-info="Agents read content ADW does not control. Whatever an injected instruction could make them do, the layers on the right limit the damage (P8)."><rect x="16" y="150" width="180" height="150" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="26" y="171" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Untrusted input</text><text x="26" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">issue text</text><text x="26" y="209" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">repository files</text><text x="26" y="227" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">CI job logs</text><text x="26" y="245" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">agent / Codex output</text></g>
<g data-step="2"><path class="flow" d="M196 225 L205.0 225.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="216,225 205.0,231.1 205.0,218.9" fill="#475569"/></g>
<g data-step="2" data-info="Agent tools: tools limits what an agent is offered at all, allowed_tools approves path-scoped. The build agent's Bash runs in a sandbox with no unsandboxed escape hatch."><rect x="216" y="20" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="38" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">1  Agent tools</text><text x="228" y="56" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">tools restricts the offer · allowed_tools path-exact · reviewers read-only · Bash sandboxed</text></g>
<g data-step="3" data-info="Secrets: ~/.ssh, ~/.aws, ~/.claude, ~/.config … are unreadable; non-whitelisted env vars are blanked with empty overrides because the SDK merges os.environ."><rect x="216" y="72" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">2  Secrets</text><text x="228" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">SECRET_STORE_DENY_RULES for every agent · safe_env() whitelist for every subprocess</text></g>
<g data-step="4" data-info="Auth &amp; billing: _require_stored_login() fails fast before tokens flow; Codex runs with an isolated CODEX_HOME containing only auth.json."><rect x="216" y="124" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="142" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">3  Auth &amp; billing</text><text x="228" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">stored Claude CLI login only · ANTHROPIC_API_KEY &amp; co. blanked</text></g>
<g data-step="5" data-info="Settings isolation: The target repository cannot inject hooks, settings or MCP servers into agents or Codex."><rect x="216" y="176" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="194" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">4  Settings isolation</text><text x="228" y="212" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">setting_sources=[] · strict_mcp_config · Codex mcp_servers={}</text></g>
<g data-step="6" data-info="Git integrity: Agent commits, branch switches and HEAD movement across a crash window are detected and escalate."><rect x="216" y="228" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="246" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">5  Git integrity</text><text x="228" y="264" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">core.hooksPath=/dev/null · only the orchestrator commits</text></g>
<g data-step="7" data-info="Artifact integrity: After every agent run; symlink or directory replacements are detected and replaced, never followed."><rect x="216" y="280" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="298" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">6  Artifact integrity</text><text x="228" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">config + reviewed spec/plan/contract restored byte-exactly</text></g>
<g data-step="8" data-info="Lane isolation: Under --parallel each lane gets the other lanes' worktrees as deny_read_paths; ports are derived from the run id."><rect x="216" y="332" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">7  Lane isolation</text><text x="228" y="368" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">worktree per lane · neighbours unreadable · ports 9100+ / 9200+ with bind check</text></g>
<g data-step="9" data-info="Data protection: The event log holds unredacted prompts and answers, so it is private to the user and the GUI binds to loopback by default."><rect x="216" y="384" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="402" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">8  Data protection</text><text x="228" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">events.jsonl mode 0600 (.gz inherits) · GUI loopback unless --i-know</text></g>
<g data-step="10"><path class="flow" d="M776 225 L785.0 225.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="796,225 785.0,231.1 785.0,218.9" fill="#475569"/></g>
<g data-step="10" data-info="What must survive a misbehaving or manipulated agent: credentials, cost control, the integrity of the repository and of the run's own evidence."><rect x="796" y="120" width="150" height="210" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="806" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Protected assets</text><text x="806" y="158" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">secrets &amp; credentials</text><text x="806" y="174" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">plan billing</text><text x="806" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">git history</text><text x="806" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">run state &amp; evidence</text><text x="806" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">other lanes</text><text x="806" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">logged agent I/O</text></g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<title>ADW run state machine: phases, approval holds, breakpoints, exit codes</title>
<desc>The Phase literal from state.py with its transitions; holds pause with exit 2, done exits 0, escalated exits 1.</desc>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<g data-step="1" data-info="Phase 1: Claude and Codex draft the spec in parallel, the synthesis merges them, then the Codex review loop (cap 5)."><rect x="30" y="150" width="130" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="95.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">spec</text></g>
<g data-step="2"><path class="flow" d="M160 160 L199.5 91.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="205,82 204.7,94.6 194.3,88.5" fill="#475569"/></g>
<g data-step="2" data-info="Optional spec gate. The run pauses with exit 2; adw approve sets spec_approval_granted and continues with the plan."><rect x="140" y="26" width="210" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="245.0" y="50.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_spec_approval</text><text x="245.0" y="67.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">--gates spec | both · exit 2</text></g>
<g data-step="3"><path class="flow" d="M290 82 L320.0 140.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="325,150 314.6,143.0 325.3,137.5" fill="#475569"/><text x="330" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">approve</text></g>
<g data-step="3"><path class="flow" d="M160 180 L269.0 180.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="280,180 269.0,186.1 269.0,173.9" fill="#475569"/><text x="220" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">no spec gate</text></g>
<g data-step="3" data-info="Phase 2: plan + contract.yaml, same draft → synthesis → review loop as the spec."><rect x="280" y="150" width="130" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="345.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">plan</text></g>
<g data-step="4"><path class="flow" d="M410 160 L449.5 91.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="455,82 454.7,94.6 444.3,88.5" fill="#475569"/></g>
<g data-step="4" data-info="The plan gate, active for --gates plan (default) and both. Read plan-summary.md, plan.md and contract.yaml, then adw approve."><rect x="390" y="26" width="210" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="495.0" y="50.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_approval</text><text x="495.0" y="67.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">plan gate (default) · exit 2</text></g>
<g data-step="5"><path class="flow" d="M540 82 L570.0 140.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="575,150 564.6,143.0 575.3,137.5" fill="#475569"/><text x="580" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">approve</text></g>
<g data-step="5"><path class="flow" d="M410 180 L519.0 180.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="530,180 519.0,186.1 519.0,173.9" fill="#475569"/><text x="470" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">--gates none | spec</text></g>
<g data-step="5" data-info="Phase 3: one worktree per lane, optional RED stage, gate loop (10 iterations per task, circuit breaker), orchestrator commit."><rect x="530" y="150" width="130" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="595.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">build</text></g>
<g data-step="6"><path class="flow" d="M630 196 L653.6 229.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="660,238 648.7,232.6 658.5,225.5" fill="#475569"/></g>
<g data-step="6" data-info="Optional breakpoint from the config. It reuses awaiting_approval; pending_breakpoint records which hold waits. --gates none skips it."><rect x="600" y="238" width="200" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="700.0" y="262.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_approval</text><text x="700.0" y="279.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">breakpoint before_integration</text></g>
<g data-step="7"><path class="flow" d="M660 173 L779.0 173.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="790,173 779.0,179.1 779.0,166.9" fill="#475569"/><text x="725" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">no breakpoint</text></g>
<g data-step="7"><path class="flow" d="M770 238 L811.6 203.1" stroke="#475569" stroke-width="2" fill="none"/><polygon points="820,196 815.5,207.7 807.7,198.4" fill="#475569"/><text x="800" y="228" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">approve</text></g>
<g data-step="7" data-info="Phase 4, parallel mode only: integration branch rebuilt each round, merge, E2E, triage → lane fixes (10 rounds)."><rect x="790" y="150" width="140" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="860.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">integration</text></g>
<g data-step="8"><path class="flow" d="M880 196 L880.0 319.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="880,330 874.0,319.0 886.0,319.0" fill="#475569"/></g>
<g data-step="8" data-info="Phase 5: pending lanes are revalidated first, then Codex reviews the diff (5 rounds, descending severity floor)."><rect x="790" y="330" width="140" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="860.0" y="358.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">codex_review</text></g>
<g data-step="8"><path d="M560 196 L560 353 L779.0 353.0" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4"/><polygon points="790,353 779.0,359.1 779.0,346.9" fill="#475569"/><text x="570" y="343" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">single-lane: skip</text></g>
<g data-step="9"><path class="flow" d="M860 376 L759.8 427.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="750,432 757.1,421.6 762.5,432.4" fill="#475569"/></g>
<g data-step="9" data-info="Phase 6: Fable checks implementation against spec; scope_gap → follow-ups, the rest → fix cycles (3 per lane)."><rect x="600" y="420" width="150" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="675.0" y="448.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">final_review</text></g>
<g data-step="10"><path class="flow" d="M600 443 L571.0 443.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="560,443 571.0,436.9 571.0,449.1" fill="#475569"/></g>
<g data-step="10" data-info="Optional last human hold before anything is pushed. Two concurrent approvals still produce exactly one push (per-run lock)."><rect x="340" y="410" width="220" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="450.0" y="439.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_approval</text><text x="450.0" y="456.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">breakpoint before_push</text></g>
<g data-step="11"><path class="flow" d="M340 443 L311.0 443.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="300,443 311.0,436.9 311.0,449.1" fill="#475569"/></g>
<g data-step="11" data-info="Phase 7: push --force-with-lease, SHA-bound CI polling; red with logs → log analyst → exactly one re-entry."><rect x="200" y="420" width="100" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="250.0" y="448.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">ci</text></g>
<g data-step="12"><path class="flow" d="M200 443 L161.0 443.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="150,443 161.0,436.9 161.0,449.1" fill="#475569"/></g>
<g data-step="12" data-info="Pipeline (and staging job) green. Auto-prune may run afterwards — fail-open, it never changes the exit code."><rect x="50" y="412" width="100" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="100.0" y="438.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">done</text><text x="100.0" y="458.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0f172a">exit 0</text></g>
<g data-step="13" data-info="Controlled end with escalation.md. adw resume refuses escalated runs — read the report, start a new run."><rect x="30" y="236" width="300" height="72" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="180.0" y="259.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">escalated · exit 1 · final</text><text x="180.0" y="276.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">from any phase: limit, merge conflict,</text><text x="180.0" y="293.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">parse error, broken invariant</text></g>
<g data-step="13" data-info="Not an escalation. The state is at the last checkpoint; adw resume &lt;run_id&gt; continues exactly there."><rect x="30" y="318" width="300" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="180.0" y="341.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">interrupted · exit 1 · resumable</text><text x="180.0" y="358.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">AgentRunError (plan limit), crash, kill:</text><text x="180.0" y="375.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">phase stays unchanged</text></g>
</svg>

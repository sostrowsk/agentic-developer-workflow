<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img">
<title>P3: Jeder Fix nimmt den validierten Weg</title>
<desc>Vier Quellen von Findings laufen alle durch eine Dispatch-Funktion, den Build-Agent der Lane und alle ihre Gates; es gibt keine Abkürzung.</desc>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<g data-step="1" data-info="Parallel-Modus: Der Triage-Agent ordnet E2E-Fehler als Findings den Lanes zu; er fixt nie."><rect x="30" y="34" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="56.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">E2E-Fehler</text><text x="140.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">e2e_triage (Sonnet)</text></g>
<g data-step="2"><path class="flow" d="M250 59 L312.3 162.6" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 307.1,165.7 317.5,159.5" fill="#475569"/></g>
<g data-step="1" data-info="Read-only-Findings von Codex über der Severity-Schwelle der Runde (P13); tiefere landen in followups.md."><rect x="30" y="106" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="128.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Codex-Code-Review</text><text x="140.0" y="146.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">Phase 5</text></g>
<g data-step="2"><path class="flow" d="M250 131 L308.6 166.3" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 305.5,171.5 311.7,161.1" fill="#475569"/></g>
<g data-step="1" data-info="Findings mit Pflicht-Kategorie; scope_gap wird Follow-up, alles andere ein Fix-Zyklus (max. 3 je Lane)."><rect x="30" y="178" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="200.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Finaler Review</text><text x="140.0" y="218.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">final_reviewer (Fable)</text></g>
<g data-step="2"><path class="flow" d="M250 203 L308.0 176.6" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 310.5,182.1 305.5,171.1" fill="#475569"/></g>
<g data-step="1" data-info="Job-Logs → Findings mit Lane → genau ein CI-Re-Entry. Rot ohne Logs eskaliert."><rect x="30" y="250" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="272.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">CI rot mit Logs</text><text x="140.0" y="290.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">log_analyst (Sonnet)</text></g>
<g data-step="2"><path class="flow" d="M250 275 L311.9 181.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 317.0,184.5 306.9,177.8" fill="#475569"/></g>
<g data-step="2" data-info="Die einzige Fix-Routing-Funktion: Findings werden je Lane gruppiert (unknown → alle Lanes), Lane-State und Budget-Erhöhung gemeinsam gespeichert (P10), dann läuft der reguläre Lane-Loop."><rect x="318" y="128" width="230" height="88" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="433.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">_dispatch_lane_fixes</text><text x="433.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">nach Lane gruppieren · atomar</text><text x="433.0" y="195.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">Budget + Aufgabe in einem Save</text></g>
<g data-step="3"><path class="flow" d="M548 172 L587.0 172.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="598,172 587.0,178.1 587.0,165.9" fill="#475569"/></g>
<g data-step="3" data-info="Die einzige Rolle, die Code ändert. Sie darf mit Begründung vom Fix-Plan des Reviewers abweichen. Geschützte Artefakte werden danach wiederhergestellt."><rect x="598" y="128" width="160" height="88" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="678.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">build_agent (Opus)</text><text x="678.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">dieselbe Lane-Session</text><text x="678.0" y="195.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">schreibt, committet nie</text></g>
<g data-step="4"><path class="flow" d="M758 172 L779.0 172.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="790,172 779.0,178.1 779.0,165.9" fill="#475569"/></g>
<g data-step="4" data-info="Jedes konfigurierte Gate, in Reihenfolge. Grüne Gates werden mit dem Tree-Hash des Worktrees festgehalten; dann committet der Orchestrator."><rect x="790" y="120" width="150" height="104" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="865.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">alle Gates der Lane</text><text x="865.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">fail fast · Timeouts</text><text x="865.0" y="195.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">Tree-Hash = Beweis</text></g>
<g data-step="4"><path class="flow" d="M865 120 L865 80 L678 80 L678.0 117.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="678,128 672.0,117.0 684.0,117.0" fill="#475569"/><text x="772" y="72" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">rot → Output-Tail = nächste Aufgabe (≤ 10, Breaker)</text></g>
<g data-step="5"><path class="flow" d="M865 224 L865.0 259.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="865,270 859.0,259.0 871.0,259.0" fill="#475569"/></g>
<g data-step="5" data-info="Der Integrations-Branch wird vom Basis-Branch neu gebaut und E2E läuft erneut — ein Review-Fix kann die Integration nicht überspringen."><rect x="780" y="270" width="160" height="62" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="860.0" y="297.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">erneut Merge + E2E</text><text x="860.0" y="315.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">nur Parallel-Modus</text></g>
<g data-step="6"><path class="flow" d="M780 301 L661.0 301.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="650,301 661.0,294.9 661.0,307.1" fill="#475569"/></g>
<g data-step="6" data-info="Der Review, der das Finding gemeldet hat, schaut erneut — unter seinem Runden-Limit und dem Circuit-Breaker."><rect x="430" y="270" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="540.0" y="297.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">zurück zur fragenden Phase</text><text x="540.0" y="315.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">Review läuft auf neuem Stand</text></g>
<text x="480" y="362" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Keine Abkürzung für 'kleine' Fixes — Reviewer melden, nur der Build-Agent fixt.</text>
</svg>

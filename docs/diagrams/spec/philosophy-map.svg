<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img">
<title>ADW philosophy: principles P1–P15 and the failure modes they close</title>
<desc>Two failure modes of agentic coding at the top; four columns group the fifteen principles by what they protect.</desc>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
<g data-step="1" data-info="Left to itself, an agent loops, skips checks or declares victory early. ADW takes the control flow away from it: loops, limits and dispatch are Python."><rect x="30" y="20" width="430" height="62" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="245.0" y="46.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Failure mode 1</text><text x="245.0" y="66.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0f172a">The agent decides the control flow</text></g>
<g data-step="1" data-info="An agent that reviews or reports on its own output marks its own homework. ADW separates the roles and lets only the orchestrator hold the evidence."><rect x="500" y="20" width="430" height="62" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="715.0" y="46.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Failure mode 2</text><text x="715.0" y="66.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0f172a">The agent grades its own work</text></g>
<g data-step="2"><path class="flow" d="M245 82 L144.5 140.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="135,146 141.5,135.2 147.6,145.7" fill="#475569"/><text x="212" y="118" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">closed by</text></g>
<g data-step="4"><path class="flow" d="M715 82 L604.7 140.8" stroke="#475569" stroke-width="2" fill="none"/><polygon points="595,146 601.9,135.5 607.6,146.2" fill="#475569"/><text x="672" y="118" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">closed by</text></g>
<g data-step="2" data-info="The control flow lives in code: bounded, testable, and ending in a defined result — done, paused or escalated."><rect x="30" y="148" width="210" height="52" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="135.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Deterministic control</text><text x="135.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">closes failure mode 1</text></g>
<g data-step="2" data-info="P1 — Loops, gates, merges, dispatch, triage, limits and CI polling are Python. Agents get one task and return text — a while loop with a counter cannot redefine 'pass'."><rect x="30" y="214" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P1</text><text x="42" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Control flow is code,</text><text x="42" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">not prompt</text></g>
<g data-step="2" data-info="P4 — Every loop has a hard, persisted limit, checked before the work. A circuit breaker stops a loop whose round produced the same failure set as before."><rect x="30" y="306" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P4</text><text x="42" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Everything bounded;</text><text x="42" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">standstill detected</text></g>
<g data-step="2" data-info="P5 — Limit, conflict, parse error or broken invariant end the run in a controlled way: escalation.md, phase escalated, exit 1. Escalated runs are final."><rect x="30" y="398" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P5</text><text x="42" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Escalation is a</text><text x="42" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">first-class result</text></g>
<g data-step="2" data-info="P11 — Single-lane is parallel mode with one lane. --dry-run injects mocks into the production path, so a config and the whole flow can be accepted at 0 tokens."><rect x="30" y="490" width="210" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="42" y="513" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P11</text><text x="42" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">One code path; dry run</text><text x="42" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">is a product feature</text></g>
<g data-step="3" data-info="Whatever an agent does wrong or is tricked into, these principles bound the damage: strict input, least privilege, plan billing, crash safety."><rect x="260" y="148" width="210" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="365.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Safety &amp; cost</text><text x="365.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">limits the blast radius</text></g>
<g data-step="3" data-info="P6 — A missing or invalid config aborts before anything starts; parsers accept exactly one shape. A parse error is safe, a false 'ok' ships broken code."><rect x="260" y="214" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P6</text><text x="272" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Fail fast,</text><text x="272" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">never guess</text></g>
<g data-step="3" data-info="P8 — Smallest tool set, artifact-exact write rules, secret stores denied, run state unwritable, Bash sandboxed, env whitelisted — agents read untrusted content."><rect x="260" y="306" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P8</text><text x="272" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Least privilege</text><text x="272" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">for agents</text></g>
<g data-step="3" data-info="P9 — Claude only via the Claude Code CLI with the stored login; API keys are blanked. A failed agent call (plan limit) leaves the run resumable."><rect x="260" y="398" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P9</text><text x="272" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Plan billing, never</text><text x="272" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">the API meter</text></g>
<g data-step="3" data-info="P10 — Every transition is checkpointed atomically; budgets are saved together with the work they pay for. Cheap state (integration branch) is rebuilt, not interpreted."><rect x="260" y="490" width="210" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="272" y="513" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P10</text><text x="272" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Crash-safe by</text><text x="272" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">construction</text></g>
<g data-step="4" data-info="Reviewers only report, builders only build, and every claim of success is proven by the orchestrator before it counts."><rect x="490" y="148" width="210" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="595.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Separation &amp; evidence</text><text x="595.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">closes failure mode 2</text></g>
<g data-step="4" data-info="P2 — Codex, final reviewer, E2E triage and log analyst are read-only and answer only with findings. Fixes are always made by the lane's build agent."><rect x="490" y="214" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P2</text><text x="502" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Reviewers</text><text x="502" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">never fix</text></g>
<g data-step="4" data-info="P3 — Any fix goes through the build agent and then all gates of the lane — in parallel mode again through merge + E2E. 'Small' is an opinion, not a measurement."><rect x="490" y="306" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P3</text><text x="502" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Every fix takes the</text><text x="502" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">validated path</text></g>
<g data-step="4" data-info="P7 — Green gates are bound to a tree hash, RED is proven, HEAD and branch are checked. Only the orchestrator commits — agent claims are falsifiable."><rect x="490" y="398" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P7</text><text x="502" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Verify, don't trust:</text><text x="502" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">orchestrator holds proof</text></g>
<g data-step="4" data-info="P13 — Round 1 fixes P1–P3, round 2 P1–P2, from round 3 only P1; dispositions are passed on as memory; after 5 rounds an open P1 escalates."><rect x="490" y="490" width="210" height="80" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="502" y="513" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P13</text><text x="502" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Review loops converge</text><text x="502" y="556" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">by policy (cap 5)</text></g>
<g data-step="5" data-info="How ADW itself is developed: real-git tests without tokens, proportionate scope, bilingual docs released with the code."><rect x="720" y="148" width="210" height="52" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="825.0" y="170.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Engineering hygiene</text><text x="825.0" y="188.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">keeps it true over time</text></g>
<g data-step="5" data-info="P12 — No test needs network or tokens; agents, Codex, glab and gh are mocked, git runs in throwaway repos. Test-first, a regression test per bugfix."><rect x="720" y="214" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="732" y="237" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P12</text><text x="732" y="260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Tests are mocks-only,</text><text x="732" y="280" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">git is real</text></g>
<g data-step="5" data-info="P14 — Every acceptance criterion traces back to the issue; shared content rules bind both authors and the synthesis. Scope gaps become follow-ups, not work."><rect x="720" y="306" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="732" y="329" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P14</text><text x="732" y="352" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Proportionality: build</text><text x="732" y="372" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">what the issue asks</text></g>
<g data-step="5" data-info="P15 — English default, German .de. variant, kept in sync. Every push to main is a release with version bump, changelog (EN+DE) and tag."><rect x="720" y="398" width="210" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="732" y="421" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">P15</text><text x="732" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">Docs bilingual and</text><text x="732" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0f172a">versioned with code</text></g>
</svg>

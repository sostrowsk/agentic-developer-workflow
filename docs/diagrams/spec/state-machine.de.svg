<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img">
<title>ADW-Zustandsautomat: Phasen, Freigabe-Halte, Breakpoints, Exit-Codes</title>
<desc>Das Phase-Literal aus state.py mit seinen Übergängen; Halte pausieren mit Exit 2, done endet mit 0, escalated mit 1.</desc>
<rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
<g data-step="1" data-info="Phase 1: Claude und Codex entwerfen die Spec parallel, die Synthese führt sie zusammen, dann der Codex-Review-Loop (Cap 5)."><rect x="30" y="150" width="130" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="95.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">spec</text></g>
<g data-step="2"><path class="flow" d="M160 160 L199.5 91.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="205,82 204.7,94.6 194.3,88.5" fill="#475569"/></g>
<g data-step="2" data-info="Optionales Spec-Gate. Der Lauf pausiert mit Exit 2; adw approve setzt spec_approval_granted und macht mit dem Plan weiter."><rect x="140" y="26" width="210" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="245.0" y="50.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_spec_approval</text><text x="245.0" y="67.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">--gates spec | both · Exit 2</text></g>
<g data-step="3"><path class="flow" d="M290 82 L320.0 140.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="325,150 314.6,143.0 325.3,137.5" fill="#475569"/><text x="330" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">approve</text></g>
<g data-step="3"><path class="flow" d="M160 180 L269.0 180.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="280,180 269.0,186.1 269.0,173.9" fill="#475569"/><text x="220" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">kein Spec-Gate</text></g>
<g data-step="3" data-info="Phase 2: Plan + contract.yaml, derselbe Ablauf Entwurf → Synthese → Review-Loop wie bei der Spec."><rect x="280" y="150" width="130" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="345.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">plan</text></g>
<g data-step="4"><path class="flow" d="M410 160 L449.5 91.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="455,82 454.7,94.6 444.3,88.5" fill="#475569"/></g>
<g data-step="4" data-info="Das Plan-Gate, aktiv bei --gates plan (Default) und both. plan-summary.md, plan.md und contract.yaml lesen, dann adw approve."><rect x="390" y="26" width="210" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="495.0" y="50.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_approval</text><text x="495.0" y="67.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Plan-Gate (Default) · Exit 2</text></g>
<g data-step="5"><path class="flow" d="M540 82 L570.0 140.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="575,150 564.6,143.0 575.3,137.5" fill="#475569"/><text x="580" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">approve</text></g>
<g data-step="5"><path class="flow" d="M410 180 L519.0 180.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="530,180 519.0,186.1 519.0,173.9" fill="#475569"/><text x="470" y="198" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">--gates none | spec</text></g>
<g data-step="5" data-info="Phase 3: ein Worktree je Lane, optionale RED-Stufe, Gate-Loop (10 Iterationen je Task, Circuit-Breaker), Commit durch den Orchestrator."><rect x="530" y="150" width="130" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="595.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">build</text></g>
<g data-step="6"><path class="flow" d="M630 196 L653.6 229.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="660,238 648.7,232.6 658.5,225.5" fill="#475569"/></g>
<g data-step="6" data-info="Optionaler Breakpoint aus der Config. Nutzt awaiting_approval mit; pending_breakpoint hält fest, welcher Halt wartet. --gates none überspringt ihn."><rect x="600" y="238" width="200" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="700.0" y="262.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_approval</text><text x="700.0" y="279.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Breakpoint before_integration</text></g>
<g data-step="7"><path class="flow" d="M660 173 L779.0 173.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="790,173 779.0,179.1 779.0,166.9" fill="#475569"/><text x="725" y="165" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">kein Breakpoint</text></g>
<g data-step="7"><path class="flow" d="M770 238 L811.6 203.1" stroke="#475569" stroke-width="2" fill="none"/><polygon points="820,196 815.5,207.7 807.7,198.4" fill="#475569"/><text x="800" y="228" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">approve</text></g>
<g data-step="7" data-info="Phase 4, nur im Parallel-Modus: Integrations-Branch je Runde neu, Merge, E2E, Triage → Lane-Fixes (10 Runden)."><rect x="790" y="150" width="140" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="860.0" y="178.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">integration</text></g>
<g data-step="8"><path class="flow" d="M880 196 L880.0 319.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="880,330 874.0,319.0 886.0,319.0" fill="#475569"/></g>
<g data-step="8" data-info="Phase 5: Offene Lanes werden zuerst revalidiert, dann reviewt Codex den Diff (5 Runden, sinkende Severity-Schwelle)."><rect x="790" y="330" width="140" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="860.0" y="358.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">codex_review</text></g>
<g data-step="8"><path d="M560 196 L560 353 L779.0 353.0" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4"/><polygon points="790,353 779.0,359.1 779.0,346.9" fill="#475569"/><text x="570" y="343" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">Single-Lane: übersprungen</text></g>
<g data-step="9"><path class="flow" d="M860 376 L759.8 427.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="750,432 757.1,421.6 762.5,432.4" fill="#475569"/></g>
<g data-step="9" data-info="Phase 6: Fable prüft Umsetzung gegen Spec; scope_gap → Follow-ups, der Rest → Fix-Zyklen (3 je Lane)."><rect x="600" y="420" width="150" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="675.0" y="448.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">final_review</text></g>
<g data-step="10"><path class="flow" d="M600 443 L571.0 443.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="560,443 571.0,436.9 571.0,449.1" fill="#475569"/></g>
<g data-step="10" data-info="Optionaler letzter menschlicher Halt vor jedem Push. Zwei gleichzeitige Freigaben ergeben trotzdem genau einen Push (Lauf-Lock)."><rect x="340" y="410" width="220" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="450.0" y="439.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">awaiting_approval</text><text x="450.0" y="456.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Breakpoint before_push</text></g>
<g data-step="11"><path class="flow" d="M340 443 L311.0 443.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="300,443 311.0,436.9 311.0,449.1" fill="#475569"/></g>
<g data-step="11" data-info="Phase 7: push --force-with-lease, SHA-gebundenes CI-Polling; rot mit Logs → Log-Analyst → genau ein Re-Entry."><rect x="200" y="420" width="100" height="46" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="250.0" y="448.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">ci</text></g>
<g data-step="12"><path class="flow" d="M200 443 L161.0 443.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="150,443 161.0,436.9 161.0,449.1" fill="#475569"/></g>
<g data-step="12" data-info="Pipeline (und Staging-Job) grün. Danach läuft ggf. Auto-Prune — fail-open, es ändert nie den Exit-Code."><rect x="50" y="412" width="100" height="62" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="100.0" y="438.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">done</text><text x="100.0" y="458.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0f172a">Exit 0</text></g>
<g data-step="13" data-info="Kontrolliertes Ende mit escalation.md. adw resume lehnt eskalierte Läufe ab — Bericht lesen, neuen Lauf starten."><rect x="30" y="236" width="300" height="72" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="180.0" y="259.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">escalated · Exit 1 · endgültig</text><text x="180.0" y="276.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">aus jeder Phase: Limit, Merge-Konflikt,</text><text x="180.0" y="293.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Parse-Fehler, verletzte Invariante</text></g>
<g data-step="13" data-info="Keine Eskalation. Der State steht am letzten Checkpoint; adw resume &lt;run_id&gt; setzt genau dort fort."><rect x="30" y="318" width="300" height="72" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="180.0" y="341.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">unterbrochen · Exit 1 · fortsetzbar</text><text x="180.0" y="358.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">AgentRunError (Plan-Limit), Crash, Kill:</text><text x="180.0" y="375.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0f172a">Phase bleibt unverändert</text></g>
</svg>

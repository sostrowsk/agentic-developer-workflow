<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img">
<title>RunState und LaneState: Feldgruppen und Persistenz</title>
<desc>Die Lauf-Felder von state.json nach Zweck gruppiert, der LaneState je Lane und der atomare Schreibweg.</desc>
<rect x="0" y="0" width="960" height="556" fill="#ffffff"/>
<rect x="20" y="20" width="450" height="450" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="34" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">RunState — .adw/runs/&lt;run_id&gt;/state.json</text>
<g data-step="1" data-info="Wer der Lauf ist und wo er steht. seq ist die monotone Save-Sequenz, die find_latest nutzt."><rect x="34" y="58" width="422" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Identität &amp; Position</text><text x="44" y="98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">run_id · issue · phase · parallel · seq</text></g>
<g data-step="2" data-info="CLI- und Config-Entscheidungen, die ein Resume nicht mehr kennt. Eine Fortsetzung liest sie nie neu von der Kommandozeile oder aus einer geänderten Config."><rect x="34" y="126" width="422" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Beim Start gepinnt (I8)</text><text x="44" y="166" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">dry_run · skip_approval · spec_approval</text><text x="44" y="184" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">pinned_base_branch · pinned_breakpoints</text></g>
<g data-step="3" data-info="Freigaben von Spec- und Plan-Gate; pending_breakpoint nennt den Breakpoint, der gerade in awaiting_approval wartet."><rect x="34" y="212" width="422" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Gates &amp; Halte</text><text x="44" y="252" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">approval_granted · spec_approval_granted · pending_breakpoint</text></g>
<g data-step="4" data-info="Lässt den Spec-/Plan-Review-Loop mitten in der Runde fortsetzen — mit derselben SDK-Session und dem Findings-Gedächtnis früherer Runden (P13)."><rect x="34" y="280" width="422" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Authoring-Checkpoint (Phasen 1–2)</text><text x="44" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">authoring_session · _pending_task · _rounds</text><text x="44" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">authoring_last_findings · _prior_context</text></g>
<g data-step="5" data-info="Persistierte Zähler und die Fehlermengen der Vorrunde für den Circuit-Breaker. Zurückgestellte Findings lösen nie wieder einen Fix oder den Breaker aus."><rect x="34" y="366" width="422" height="94" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="386" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Budgets &amp; Breaker-Baselines</text><text x="44" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">integration_rounds · review_rounds · ci_reentries</text><text x="44" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">*_last_failures · review_prior_context</text><text x="44" y="442" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">deferred_findings</text></g>
<rect x="510" y="20" width="430" height="450" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="524" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">LaneState — je aktiver Lane (backend, frontend)</text>
<g data-step="6" data-info="Ein git-Worktree und Branch adw/&lt;run_id&gt;/&lt;lane&gt; je Lane, deterministische Ports; base_sha ist der gepinnte Abzweigpunkt."><rect x="524" y="58" width="402" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Isolation</text><text x="534" y="98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">worktree · branch · ports · base_sha</text></g>
<g data-step="7" data-info="SDK-Session der Lane. Fix-Aufgaben setzen sie fort; sie wird gesichert, sobald sie im Stream auftaucht."><rect x="524" y="126" width="402" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Session</text><text x="534" y="166" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">session_id</text></g>
<g data-step="8" data-info="Gate-Iterationen je Task (max. 10) und Fix-Zyklen des finalen Reviews (max. 3)."><rect x="524" y="194" width="402" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="214" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Budgets</text><text x="534" y="234" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">gate_iterations · fix_cycles</text></g>
<g data-step="9" data-info="Vom Orchestrator bewiesen: grüne Gates an den Tree-Hash gebunden, RED durch die gelisteten Tests belegt. Nichts davon schreibt ein Agent."><rect x="524" y="262" width="402" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="282" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Beweise (P7)</text><text x="534" y="302" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">completed · gates_passed · gates_tree</text><text x="534" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">red_confirmed · red_test_paths</text></g>
<g data-step="10" data-info="Der gestagte Fix, die Findings, die er beantwortet, die Breaker-Baseline und HEAD am letzten Checkpoint, um fremde Commits über einen Crash hinweg zu erkennen."><rect x="524" y="348" width="402" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="368" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Offene Arbeit</text><text x="534" y="388" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">pending_task · pending_findings · last_failures</text><text x="534" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">expected_head</text></g>
<g data-step="6"><path class="flow" d="M470 44 L499.0 44.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="510,44 499.0,50.0 499.0,38.0" fill="#475569"/><text x="490" y="36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">lanes</text></g>
<g data-step="11" data-info="Es gibt nie einen halb geschriebenen State. Der exklusive Lock serialisiert Saves über Prozesse hinweg; Lane-Threads nutzen update() als Transaktion."><rect x="20" y="486" width="920" height="54" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="480.0" y="509.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Persistenz</text><text x="480.0" y="527.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">in Temp-Datei schreiben + os.replace · flock auf .adw/runs/.seq · RunState.update(): laden → ändern → schreiben</text></g>
</svg>

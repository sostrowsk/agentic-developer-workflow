<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img">
<title>Sicherheitsmodell: Schichten zwischen nicht vertrauenswürdiger Eingabe und geschützten Gütern</title>
<desc>Nicht vertrauenswürdige Eingaben erreichen Agents und Subprozesse; acht Schichten aus §12 stehen zwischen ihnen und den Gütern, die ADW schützt.</desc>
<rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
<g data-step="1" data-info="Agents lesen Inhalte, die ADW nicht kontrolliert. Was eine eingeschleuste Anweisung auch bewirken will, die Schichten rechts begrenzen den Schaden (P8)."><rect x="16" y="150" width="180" height="150" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="26" y="171" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Unsichere Eingaben</text><text x="26" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Issue-Text</text><text x="26" y="209" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Repository-Dateien</text><text x="26" y="227" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">CI-Job-Logs</text><text x="26" y="245" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Agent-/Codex-Ausgaben</text></g>
<g data-step="2"><path class="flow" d="M196 225 L205.0 225.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="216,225 205.0,231.1 205.0,218.9" fill="#475569"/></g>
<g data-step="2" data-info="Agent-Tools: tools begrenzt, was einem Agent überhaupt angeboten wird, allowed_tools gibt pfadgenau frei. Die Bash des Build-Agents läuft in einer Sandbox ohne Ausweg."><rect x="216" y="20" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="38" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">1  Agent-Tools</text><text x="228" y="56" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">tools begrenzt das Angebot · allowed_tools pfadgenau · Reviewer read-only · Bash in Sandbox</text></g>
<g data-step="3" data-info="Secrets: ~/.ssh, ~/.aws, ~/.claude, ~/.config … sind unlesbar; nicht freigegebene Env-Variablen werden leer überschrieben, weil das SDK os.environ mischt."><rect x="216" y="72" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="90" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">2  Secrets</text><text x="228" y="108" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">SECRET_STORE_DENY_RULES für jeden Agent · safe_env()-Whitelist für jeden Subprozess</text></g>
<g data-step="4" data-info="Auth &amp; Abrechnung: _require_stored_login() bricht ab, bevor Tokens fließen; Codex läuft mit isoliertem CODEX_HOME, das nur auth.json enthält."><rect x="216" y="124" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="142" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">3  Auth &amp; Abrechnung</text><text x="228" y="160" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">nur gespeicherter Claude-CLI-Login · ANTHROPIC_API_KEY &amp; Co. geleert</text></g>
<g data-step="5" data-info="Settings-Isolation: Das Ziel-Repo kann weder Hooks noch Settings noch MCP-Server in Agents oder Codex einschleusen."><rect x="216" y="176" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="194" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">4  Settings-Isolation</text><text x="228" y="212" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">setting_sources=[] · strict_mcp_config · Codex mcp_servers={}</text></g>
<g data-step="6" data-info="Git-Integrität: Agent-Commits, Branch-Wechsel und HEAD-Sprünge über ein Crash-Fenster werden erkannt und eskalieren."><rect x="216" y="228" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="246" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">5  Git-Integrität</text><text x="228" y="264" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">core.hooksPath=/dev/null · nur der Orchestrator committet</text></g>
<g data-step="7" data-info="Artefakt-Integrität: Nach jedem Agent-Lauf; Ersetzungen durch Symlinks oder Verzeichnisse werden erkannt und ersetzt, nie verfolgt."><rect x="216" y="280" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="298" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">6  Artefakt-Integrität</text><text x="228" y="316" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">Config + reviewte Spec/Plan/Kontrakt byte-genau wiederhergestellt</text></g>
<g data-step="8" data-info="Lane-Isolation: Unter --parallel bekommt jede Lane die Worktrees der anderen als deny_read_paths; die Ports leiten sich aus der Lauf-ID ab."><rect x="216" y="332" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="350" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">7  Lane-Isolation</text><text x="228" y="368" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">Worktree je Lane · Nachbarn unlesbar · Ports 9100+ / 9200+ mit Bind-Check</text></g>
<g data-step="9" data-info="Datenschutz: Das Event-Log enthält ungeschwärzte Prompts und Antworten — es ist privat, und die GUI bindet standardmäßig nur an Loopback."><rect x="216" y="384" width="560" height="44" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="228" y="402" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">8  Datenschutz</text><text x="228" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">events.jsonl Modus 0600 (.gz erbt ihn) · GUI nur Loopback ohne --i-know</text></g>
<g data-step="10"><path class="flow" d="M776 225 L785.0 225.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="796,225 785.0,231.1 785.0,218.9" fill="#475569"/></g>
<g data-step="10" data-info="Was einen fehlerhaften oder manipulierten Agent überstehen muss: Zugangsdaten, Kostenkontrolle, die Integrität des Repos und der Beweise des Laufs."><rect x="796" y="120" width="150" height="210" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="806" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Geschützte Güter</text><text x="806" y="158" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">Secrets &amp; Zugänge</text><text x="806" y="174" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">Plan-Abrechnung</text><text x="806" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">git-Historie</text><text x="806" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">Lauf-State &amp; Beweise</text><text x="806" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">andere Lanes</text><text x="806" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">geloggte Agent-I/O</text></g>
</svg>

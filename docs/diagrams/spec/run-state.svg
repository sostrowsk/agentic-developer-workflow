<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img">
<title>RunState and LaneState: field groups and persistence</title>
<desc>The run-level fields of state.json grouped by purpose, the per-lane LaneState, and the atomic write path.</desc>
<rect x="0" y="0" width="960" height="556" fill="#ffffff"/>
<rect x="20" y="20" width="450" height="450" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="34" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">RunState — .adw/runs/&lt;run_id&gt;/state.json</text>
<g data-step="1" data-info="Who the run is and where it stands. seq is the monotonic save sequence that find_latest uses."><rect x="34" y="58" width="422" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Identity &amp; position</text><text x="44" y="98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">run_id · issue · phase · parallel · seq</text></g>
<g data-step="2" data-info="CLI and config decisions a resume no longer knows. A continuation never re-reads them from the command line or a changed config."><rect x="34" y="126" width="422" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Pinned at start (I8)</text><text x="44" y="166" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">dry_run · skip_approval · spec_approval</text><text x="44" y="184" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">pinned_base_branch · pinned_breakpoints</text></g>
<g data-step="3" data-info="Grants of the spec and plan gate; pending_breakpoint names the breakpoint that currently waits in awaiting_approval."><rect x="34" y="212" width="422" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="232" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Gates &amp; holds</text><text x="44" y="252" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">approval_granted · spec_approval_granted · pending_breakpoint</text></g>
<g data-step="4" data-info="Lets the spec/plan review loop resume mid-round with the same SDK session and the findings memory of earlier rounds (P13)."><rect x="34" y="280" width="422" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Authoring checkpoint (phases 1–2)</text><text x="44" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">authoring_session · _pending_task · _rounds</text><text x="44" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">authoring_last_findings · _prior_context</text></g>
<g data-step="5" data-info="Persisted counters and the previous round's failure sets for the circuit breaker. Deferred findings never trigger another fix or the breaker."><rect x="34" y="366" width="422" height="94" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="44" y="386" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Budgets &amp; breaker baselines</text><text x="44" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">integration_rounds · review_rounds · ci_reentries</text><text x="44" y="424" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">*_last_failures · review_prior_context</text><text x="44" y="442" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">deferred_findings</text></g>
<rect x="510" y="20" width="430" height="450" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="524" y="44" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0f172a">LaneState — one per active lane (backend, frontend)</text>
<g data-step="6" data-info="One git worktree and branch adw/&lt;run_id&gt;/&lt;lane&gt; per lane, deterministic ports; base_sha is the pinned fork point."><rect x="524" y="58" width="402" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="78" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Isolation</text><text x="534" y="98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">worktree · branch · ports · base_sha</text></g>
<g data-step="7" data-info="SDK session of the lane. Fix tasks resume it; it is checkpointed as soon as it appears in the stream."><rect x="524" y="126" width="402" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Session</text><text x="534" y="166" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">session_id</text></g>
<g data-step="8" data-info="Gate iterations per task (max. 10) and final-review fix cycles (max. 3)."><rect x="524" y="194" width="402" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="214" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Budgets</text><text x="534" y="234" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">gate_iterations · fix_cycles</text></g>
<g data-step="9" data-info="Proven by the orchestrator: green gates bound to the tree hash, RED proven by the listed tests. Nothing here is written by an agent."><rect x="524" y="262" width="402" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="282" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Evidence (P7)</text><text x="534" y="302" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">completed · gates_passed · gates_tree</text><text x="534" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">red_confirmed · red_test_paths</text></g>
<g data-step="10" data-info="The staged fix, the findings it answers, the breaker baseline, and HEAD at the last checkpoint to detect foreign commits across a crash."><rect x="524" y="348" width="402" height="76" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="534" y="368" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Open work</text><text x="534" y="388" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">pending_task · pending_findings · last_failures</text><text x="534" y="406" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">expected_head</text></g>
<g data-step="6"><path class="flow" d="M470 44 L499.0 44.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="510,44 499.0,50.0 499.0,38.0" fill="#475569"/><text x="490" y="36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">lanes</text></g>
<g data-step="11" data-info="No half-written state ever exists. The exclusive lock serializes saves across processes; lane threads use update() as a transaction."><rect x="20" y="486" width="920" height="54" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="480.0" y="509.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Persistence</text><text x="480.0" y="527.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">write to temp file + os.replace · flock on .adw/runs/.seq · RunState.update(): load → mutate → write</text></g>
</svg>

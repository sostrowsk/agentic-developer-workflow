<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img">
<title>P3: every fix takes the validated path</title>
<desc>Four sources of findings all route through one dispatch function, the lane's build agent and all of its gates; there is no shortcut.</desc>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>
<g data-step="1" data-info="Parallel mode: the triage agent assigns E2E failures to lanes as findings; it never fixes."><rect x="30" y="34" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="56.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">E2E failure</text><text x="140.0" y="74.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">e2e_triage (Sonnet)</text></g>
<g data-step="2"><path class="flow" d="M250 59 L312.3 162.6" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 307.1,165.7 317.5,159.5" fill="#475569"/></g>
<g data-step="1" data-info="Read-only Codex findings above the round's severity floor (P13); lower ones go to followups.md."><rect x="30" y="106" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="128.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Codex code review</text><text x="140.0" y="146.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">phase 5</text></g>
<g data-step="2"><path class="flow" d="M250 131 L308.6 166.3" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 305.5,171.5 311.7,161.1" fill="#475569"/></g>
<g data-step="1" data-info="Findings with mandatory category; scope_gap becomes a follow-up, everything else a fix cycle (max. 3 per lane)."><rect x="30" y="178" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="200.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Final review</text><text x="140.0" y="218.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">final_reviewer (Fable)</text></g>
<g data-step="2"><path class="flow" d="M250 203 L308.0 176.6" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 310.5,182.1 305.5,171.1" fill="#475569"/></g>
<g data-step="1" data-info="Job logs → findings with lane → exactly one CI re-entry. Red without logs escalates."><rect x="30" y="250" width="220" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="140.0" y="272.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">CI red with logs</text><text x="140.0" y="290.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">log_analyst (Sonnet)</text></g>
<g data-step="2"><path class="flow" d="M250 275 L311.9 181.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="318,172 317.0,184.5 306.9,177.8" fill="#475569"/></g>
<g data-step="2" data-info="The single fix-routing function: findings are grouped per lane (unknown → all lanes), the lane state and any budget increment are saved together (P10), then the regular lane loop runs."><rect x="318" y="128" width="230" height="88" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="433.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">_dispatch_lane_fixes</text><text x="433.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">group by lane · stage atomically</text><text x="433.0" y="195.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">budget + task in one save</text></g>
<g data-step="3"><path class="flow" d="M548 172 L587.0 172.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="598,172 587.0,178.1 587.0,165.9" fill="#475569"/></g>
<g data-step="3" data-info="The only role that changes code. It may deviate from a reviewer's fix plan with a justification. Protected artifacts are restored after it runs."><rect x="598" y="128" width="160" height="88" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="678.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">build_agent (Opus)</text><text x="678.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">same lane session</text><text x="678.0" y="195.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">writes, never commits</text></g>
<g data-step="4"><path class="flow" d="M758 172 L779.0 172.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="790,172 779.0,178.1 779.0,165.9" fill="#475569"/></g>
<g data-step="4" data-info="Every configured gate, in order. Green gates are recorded with the worktree's tree hash; then the orchestrator commits."><rect x="790" y="120" width="150" height="104" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="865.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">all gates of the lane</text><text x="865.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">fail fast · timeouts</text><text x="865.0" y="195.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">tree hash = evidence</text></g>
<g data-step="4"><path class="flow" d="M865 120 L865 80 L678 80 L678.0 117.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="678,128 672.0,117.0 684.0,117.0" fill="#475569"/><text x="772" y="72" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#475569">red → output tail = next fix task (≤ 10, breaker)</text></g>
<g data-step="5"><path class="flow" d="M865 224 L865.0 259.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="865,270 859.0,259.0 871.0,259.0" fill="#475569"/></g>
<g data-step="5" data-info="The integration branch is rebuilt from the base branch and E2E runs again, so a review fix cannot skip integration."><rect x="780" y="270" width="160" height="62" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="860.0" y="297.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">merge + E2E again</text><text x="860.0" y="315.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">parallel mode only</text></g>
<g data-step="6"><path class="flow" d="M780 301 L661.0 301.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="650,301 661.0,294.9 661.0,307.1" fill="#475569"/></g>
<g data-step="6" data-info="The review that raised the finding looks again — subject to its round limit and the circuit breaker."><rect x="430" y="270" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="540.0" y="297.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">back to the asking phase</text><text x="540.0" y="315.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0f172a">review re-runs on the new state</text></g>
<text x="480" y="362" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">No shortcut for 'small' fixes — reviewers report, only the build agent fixes.</text>
</svg>

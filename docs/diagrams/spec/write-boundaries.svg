<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img">
<title>Who may write what: agents, reviewers and the orchestrator</title>
<desc>Authors write only their artifacts, the build agent only its worktree, reviewers nothing; only the orchestrator commits and writes run state.</desc>
<rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
<g data-step="1" data-info="Artifact-exact write rules (Write(.adw/spec.md), never .adw/**). Codex drafts come back as marker blocks; the orchestrator writes them to drafts/."><rect x="30" y="24" width="280" height="128" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="40" y="45" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Authors (phases 1–2)</text><text x="40" y="65" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">spec_agent · plan_agent (Opus 5.5)</text><text x="40" y="83" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">spec/plan_synthesis (Fable 5.1)</text><text x="40" y="101" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">write exactly: .adw/spec.md, plan.md,</text><text x="40" y="119" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">contract.yaml, *-summary.md</text></g>
<g data-step="2" data-info="Holds all evidence (P7): gates_passed + gates_tree, red_confirmed, expected_head. Every claim an agent could make is proven here instead."><rect x="350" y="170" width="260" height="128" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="360" y="191" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Orchestrator (deterministic)</text><text x="360" y="211" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">the only one that commits</text><text x="360" y="229" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">runs gates · computes tree hash</text><text x="360" y="247" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">writes state.json · events.jsonl</text><text x="360" y="265" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">restores protected artifacts</text></g>
<g data-step="2"><path class="flow" d="M310 110 L390.8 163.9" stroke="#475569" stroke-width="2" fill="none"/><polygon points="400,170 387.5,168.9 394.2,158.9" fill="#475569"/><text x="350" y="128" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">artifacts</text></g>
<g data-step="3" data-info="The only role that changes code. A commit, branch switch or HEAD movement by the agent is detected and escalates (I1)."><rect x="30" y="316" width="280" height="128" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="40" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Build agent (phase 3 + every fix)</text><text x="40" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">build_agent (Opus 5.5)</text><text x="40" y="375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">writes ./** in its own worktree</text><text x="40" y="393" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Bash sandboxed · never commits</text><text x="40" y="411" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">other lanes' worktrees unreadable</text></g>
<g data-step="3"><path class="flow" d="M380 298 L319.9 327.2" stroke="#475569" stroke-width="2" fill="none"/><polygon points="310,332 317.3,321.8 322.5,332.6" fill="#475569"/><text x="345" y="300" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#475569">fix task</text></g>
<g data-step="3"><path class="flow" d="M310 410 L461.0 304.3" stroke="#475569" stroke-width="2" fill="none"/><polygon points="470,298 464.5,309.3 457.5,299.4" fill="#475569"/><text x="392" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#475569">changed worktree</text></g>
<g data-step="4" data-info="They answer only with findings JSON in the shared schema. Unparseable or schema-violating answers escalate — never an implicit ok (P2, P6)."><rect x="650" y="24" width="280" height="128" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="660" y="45" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Reviewers (read-only)</text><text x="660" y="65" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">codex (gpt-6-astra), read-only</text><text x="660" y="83" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">final_reviewer (Fable 5.1)</text><text x="660" y="101" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">e2e_triage · log_analyst (Sonnet 5.5)</text><text x="660" y="119" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">tools: Read · Grep · Glob only</text></g>
<g data-step="4"><path class="flow" d="M650 110 L569.2 163.9" stroke="#475569" stroke-width="2" fill="none"/><polygon points="560,170 565.8,158.9 572.5,168.9" fill="#475569"/><text x="610" y="128" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#475569">findings JSON</text></g>
<g data-step="5" data-info="SECRET_STORE_DENY_RULES and .adw/runs/** are denied to all agents; config and reviewed artifacts are restored byte-exactly after each agent run."><rect x="650" y="316" width="280" height="128" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="660" y="337" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Protected for every agent</text><text x="660" y="357" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">~/.ssh ~/.aws ~/.claude ~/.config …</text><text x="660" y="375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">.adw/runs/** (state, events)</text><text x="660" y="393" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">config.yaml · reviewed spec/plan</text><text x="660" y="411" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">deny beats allow</text></g>
<g data-step="5"><path class="flow" d="M560 298 L640.5 344.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="650,350 637.4,349.7 643.5,339.3" fill="#475569"/><text x="585" y="340" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#475569">writes · restores</text></g>
<g data-step="5"><path d="M310 430 L639.0 430.0" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="6 4"/><polygon points="650,430 639.0,436.1 639.0,423.9" fill="#b91c1c"/><text x="480" y="422" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#b91c1c">denied</text></g>
</svg>

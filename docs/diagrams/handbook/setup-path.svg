<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img">
<title>Setup path</title>
<desc>Four steps from a fresh machine to the first real ADW run.</desc>
<rect x="0" y="0" width="980" height="330" fill="#ffffff"/>
<g data-step="1" data-info="Install uv and git, then log in with the Claude Code CLI and the Codex CLI. glab or gh fetch issues and poll CI. API keys are ignored — usage runs on your plan."><rect x="10" y="30" width="232" height="175" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="126.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="126.0" dy="0">1 · Prerequisites</tspan></text><text x="126.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="126.0" dy="0">uv + Python ≥ 3.12, git</tspan><tspan x="126.0" dy="18">Claude Code CLI, logged in</tspan><tspan x="126.0" dy="18">Codex CLI, logged in</tspan><tspan x="126.0" dy="18">glab (GitLab) or gh (GitHub)</tspan></text></g>
<g data-step="2" data-info="One file holds all project-specific settings. Copy examples/config.yaml, set the base branch and at least one lane with its gates. Unknown keys are rejected."><path class="flow" d="M242 117.5 L242.0 117.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="252,117.5 242.0,112.0 242.0,123.0" fill="#475569"/><rect x="252" y="30" width="232" height="175" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="368.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="368.0" dy="0">2 · Configure the repo</tspan></text><text x="368.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="368.0" dy="0">&lt;target&gt;/.adw/config.yaml</tspan><tspan x="368.0" dy="18">base_branch + lanes</tspan><tspan x="368.0" dy="18">gates per lane (tdd: true)</tspan><tspan x="368.0" dy="18">template: examples/</tspan></text></g>
<g data-step="3" data-info="Drives the complete control flow with scripted mocks, including a deliberately failing gate. If this passes, your config and gates are wired correctly."><path class="flow" d="M484 117.5 L484.0 117.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="494,117.5 484.0,112.0 484.0,123.0" fill="#475569"/><rect x="494" y="30" width="232" height="175" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="610.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="610.0" dy="0">3 · Dry run</tspan></text><text x="610.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="610.0" dy="0">--dry-run --gates none</tspan><tspan x="610.0" dy="18">mock agents, fake CI</tspan><tspan x="610.0" dy="18">0 tokens, nothing pushed</tspan><tspan x="610.0" dy="18">proves config + gates</tspan></text></g>
<g data-step="4" data-info="Spends plan quota. By default the run stops after plan + contract; read plan-summary.md and approve. Exit 0 means: branch pushed, pipeline green."><path class="flow" d="M726 117.5 L726.0 117.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="736,117.5 726.0,112.0 726.0,123.0" fill="#475569"/><rect x="736" y="30" width="232" height="175" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="852.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="852.0" dy="0">4 · Real run</tspan></text><text x="852.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="852.0" dy="0">adw run --issue "…"</tspan><tspan x="852.0" dy="18">pauses after the plan (exit 2)</tspan><tspan x="852.0" dy="18">adw approve &lt;run_id&gt;</tspan><tspan x="852.0" dy="18">→ branch pushed, CI green</tspan></text></g>
<g data-step="5" data-info="Optional at any time: a read-only web view of runs, traces, costs and escalations. Needs the gui extra outside this repo."><path d="M731.0 240 L731.0 215.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="731.0,205 725.5,215.0 736.5,215.0" fill="#475569"/><rect x="494" y="240" width="474" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><text x="731.0" y="268.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="731.0" dy="0">adw gui — Run Inspector</tspan></text><text x="731.0" y="290.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="731.0" dy="0">read-only view of every run · http://127.0.0.1:8765/</tspan></text></g>
<text x="10" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#475569"><tspan x="10" dy="0">Each step builds on the previous one —</tspan><tspan x="10" dy="17">a failing dry run costs nothing to fix.</tspan></text>
</svg>

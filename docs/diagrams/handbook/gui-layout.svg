<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img">
<title>Run Inspector: the run detail page</title>
<desc>Schematic layout of /runs/&lt;repo&gt;/&lt;run_id&gt; in adw gui.</desc>
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<rect x="10" y="10" width="960" height="520" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="30" y="34" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#475569"><tspan x="30" dy="0">http://127.0.0.1:8765/runs/&lt;repo&gt;/&lt;run_id&gt;</tspan></text>
<g data-step="1" data-info="Where the run stands and where time went. A dry run carries a sticky Dry-Run banner."><rect x="30" y="48" width="920" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="490.0" y="74.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Header</tspan></text><text x="490.0" y="94.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">status · to-scale phase band (click jumps to the phase) · work time · cost + tokens</tspan></text></g>
<g data-step="2" data-info="Names the one next step for a paused, interrupted or escalated run, including the escalation report."><rect x="30" y="122" width="920" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="490.0" y="140.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Recovery card</tspan></text><text x="490.0" y="160.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">only when the run needs you: the next command, e.g. adw approve &lt;id&gt; --repo &lt;path&gt;</tspan></text></g>
<g data-step="3" data-info="Trace is the default. Timeline shows swimlanes, Artifacts the issue, spec, plan, drafts and reports, Raw the filterable event log."><rect x="30" y="180" width="920" height="36" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="200.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Tabs: Trace · Timeline · Artifacts · Raw</tspan></text></g>
<g data-step="4" data-info="The span tree of the run; tool noise is folded. Keyboard: arrows move and fold, Enter or Space selects."><rect x="30" y="226" width="270" height="220" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="165.0" y="314.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="165.0" dy="0">Trace tree</tspan></text><text x="165.0" y="334.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="165.0" dy="0">phases, lanes, rounds,</tspan><tspan x="165.0" dy="16">agent runs, gates, reviews</tspan><tspan x="165.0" dy="16">↑ ↓ ← → Enter · one Tab stop</tspan></text></g>
<g data-step="5" data-info="Shows the selected node. Diff is the step diff from the snapshot refs."><rect x="312" y="226" width="410" height="220" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="517.0" y="314.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="517.0" dy="0">Detail pane</tspan></text><text x="517.0" y="334.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="517.0" dy="0">agent run: Prompt · Answer · Tools · Diff</tspan><tspan x="517.0" dy="16">payloads as field lists,</tspan><tspan x="517.0" dy="16">issue / prompts / answers as Markdown</tspan></text></g>
<g data-step="6" data-info="Time travel: the run state as it was at the selected point, not just at the end."><rect x="734" y="226" width="216" height="220" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="842.0" y="306.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="842.0" dy="0">Run context</tspan></text><text x="842.0" y="326.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="842.0" dy="0">at the selected node:</tspan><tspan x="842.0" dy="16">phase, round n/cap,</tspan><tspan x="842.0" dy="16">limit hits, breakers,</tspan><tspan x="842.0" dy="16">cost, follow-ups</tspan></text></g>
<g data-step="7" data-info="Expand on demand: what is still planned, and what was actually touched."><rect x="30" y="456" width="920" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><text x="490.0" y="480.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Plan skeleton · Change scope (both collapsed)</tspan></text><text x="490.0" y="500.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">tasks from plan.md per lane · files changed per lane next to the contract's scope</tspan></text></g>
</svg>

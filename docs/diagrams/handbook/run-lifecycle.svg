<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img">
<title>A run from your point of view</title>
<desc>From adw run to the three possible endings, with exit codes and the next step.</desc>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<g data-step="1" data-info="You start a run with exactly one issue source. Flags are checked first; any error here creates no run at all."><rect x="12" y="30" width="172" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="98.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="98.0" dy="0">adw run</tspan></text><text x="98.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="98.0" dy="0">one issue source</tspan><tspan x="98.0" dy="18">--gates, --parallel</tspan></text></g>
<g data-step="2" data-info="ADW loads .adw/config.yaml (fail fast), checks that the forge is known (real runs) and checks the main checkout. Leftover ADW artifacts are restored from HEAD automatically."><path class="flow" d="M184 80.0 L196.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="206,80.0 196.0,74.5 196.0,85.5" fill="#475569"/><rect x="206" y="30" width="172" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="292.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">Preflight</tspan></text><text x="292.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">config + forge ok?</tspan><tspan x="292.0" dy="18">main checkout clean?</tspan></text></g>
<g data-step="3" data-info="Two independent drafts (Claude + Codex) per artifact, merged by Fable 5.1 into one spec, one plan and one interface contract."><path class="flow" d="M378 80.0 L390.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="400,80.0 390.0,74.5 390.0,85.5" fill="#475569"/><rect x="400" y="30" width="172" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="486.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="486.0" dy="0">Phases 1–2</tspan></text><text x="486.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="486.0" dy="0">Spec, Plan + Contract</tspan><tspan x="486.0" dy="18">two drafts → synthesis</tspan></text></g>
<g data-step="4" data-info="Default --gates plan: the run stops before the expensive build. Read plan-summary.md, plan.md and contract.yaml."><path class="flow" d="M572 80.0 L584.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="594,80.0 584.0,74.5 584.0,85.5" fill="#475569"/><rect x="594" y="30" width="172" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="680.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="680.0" dy="0">Plan gate</tspan></text><text x="680.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="680.0" dy="0">exit 2 · paused</tspan><tspan x="680.0" dy="18">read plan-summary.md</tspan></text></g>
<g data-step="5" data-info="Grants the pending approval and continues immediately. There is no reject: if the plan is wrong, start a new run with a sharper issue."><path class="flow" d="M766 80.0 L778.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="788,80.0 778.0,74.5 778.0,85.5" fill="#475569"/><rect x="788" y="30" width="172" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="874.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="874.0" dy="0">adw approve &lt;id&gt;</tspan></text><text x="874.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="874.0" dy="0">continues in the</tspan><tspan x="874.0" dy="18">same process</tspan></text></g>
<g data-step="2" data-info="The preflight never discards your work. It lists the dirty paths and stops; the run is unchanged and resumable."><path d="M292.0 130 L292.0 180.0" stroke="#b91c1c" stroke-width="2" fill="none"/><polygon points="292.0,190 297.5,180.0 286.5,180.0" fill="#b91c1c"/><rect x="206" y="190" width="172" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="292.0" y="220.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">Refused · exit 1</tspan></text><text x="292.0" y="242.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">foreign changes in</tspan><tspan x="292.0" dy="18">the main checkout →</tspan><tspan x="292.0" dy="18">commit/stash, retry</tspan></text></g>
<g data-step="6" data-info="Build agents work in lane worktrees, gates decide, reviewers only report. Optional breakpoints can pause again (exit 2)."><path class="flow" d="M874.0 130 L874.0 180.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="874.0,190 879.5,180.0 868.5,180.0" fill="#475569"/><rect x="594" y="190" width="346" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="767.0" y="229.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="767.0" dy="0">Phases 3–7</tspan></text><text x="767.0" y="251.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="767.0" dy="0">Build (lanes, RED stage) · Integration/E2E</tspan><tspan x="767.0" dy="18">Codex review · final review · push + CI</tspan></text></g>
<g data-step="7" data-info="Success: the feature branch is pushed and CI is green. followups.md lists scope gaps and deferred findings — turn them into tickets."><path class="flow" d="M767.0 300 L767.0 345 L332.0 345 L332.0 370.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="332.0,380 337.5,370.0 326.5,370.0" fill="#475569"/><rect x="214" y="380" width="236" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="332.0" y="421.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="332.0" dy="0">exit 0 · done</tspan></text><text x="332.0" y="443.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="332.0" dy="0">branch pushed,</tspan><tspan x="332.0" dy="18">pipeline (+ staging) green</tspan><tspan x="332.0" dy="18">→ open the MR/PR,</tspan><tspan x="332.0" dy="18">read followups.md</tspan></text></g>
<g data-step="8" data-info="Final by design: escalated runs cannot be resumed. escalation.md names the phase and the concrete reason (gate output, conflict, limit, circuit breaker)."><path class="flow" d="M767.0 300 L767.0 345 L580.0 345 L580.0 370.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="580.0,380 585.5,370.0 574.5,370.0" fill="#475569"/><rect x="462" y="380" width="236" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="580.0" y="421.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="580.0" dy="0">exit 1 · escalated</tspan></text><text x="580.0" y="443.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="580.0" dy="0">a limit or hard error</tspan><tspan x="580.0" dy="18">→ read escalation.md,</tspan><tspan x="580.0" dy="18">fix the cause,</tspan><tspan x="580.0" dy="18">start a NEW run</tspan></text></g>
<g data-step="9" data-info="Not an escalation: the run stays at its last checkpoint. Finished lanes are not rebuilt and limits are not reset."><path class="flow" d="M767.0 300 L767.0 345 L828.0 345 L828.0 370.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="828.0,380 833.5,370.0 822.5,370.0" fill="#475569"/><rect x="710" y="380" width="236" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="828.0" y="421.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="828.0" dy="0">exit 1 · interrupted</tspan></text><text x="828.0" y="443.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="828.0" dy="0">plan limit, crash, Ctrl-C</tspan><tspan x="828.0" dy="18">→ state is checkpointed</tspan><tspan x="828.0" dy="18">→ adw resume &lt;id&gt;</tspan><tspan x="828.0" dy="18">after the reset</tspan></text></g>
<g data-step="9" data-info="adw resume continues exactly where the run stopped — same phase, same agent session for an open fix."><path d="M946 455 L968 455 L968 245 L950.0 245.0" stroke="#b45309" stroke-width="2" fill="none"/><polygon points="940,245 950.0,250.5 950.0,239.5" fill="#b45309"/><text x="960" y="326" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#b45309"><tspan x="960" dy="0">adw resume</tspan></text></g>
<text x="12" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#475569"><tspan x="12" dy="0">Exit codes</tspan><tspan x="12" dy="20">0 = done</tspan><tspan x="12" dy="20">2 = paused (gate/breakpoint)</tspan><tspan x="12" dy="20">1 = escalation or error</tspan></text>
</svg>

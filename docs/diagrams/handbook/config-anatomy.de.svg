<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img">
<title>Aufbau von .adw/config.yaml</title>
<desc>Jeder Config-Abschnitt mit Pflicht/optional und Standardwert.</desc>
<rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
<rect x="16" y="16" width="420" height="534" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="30" y="36" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#475569"><tspan x="30" dy="0">.adw/config.yaml</tspan></text>
<text x="30.0" y="62" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">base_branch: main</tspan></text>
<text x="30.0" y="88" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">lanes:</tspan></text>
<text x="45.6" y="114" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="45.6" dy="0">backend:</tspan></text>
<text x="61.2" y="140" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="61.2" dy="0">gates:</tspan></text>
<text x="76.8" y="166" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="76.8" dy="0">- name: lint</tspan></text>
<text x="92.4" y="192" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="92.4" dy="0">cmd: "ruff check ."</tspan></text>
<text x="92.4" y="218" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="92.4" dy="0">timeout: 300</tspan></text>
<text x="76.8" y="244" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="76.8" dy="0">- name: pytest</tspan></text>
<text x="92.4" y="270" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="92.4" dy="0">cmd: "pytest -x -q"</tspan></text>
<text x="92.4" y="296" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="92.4" dy="0">timeout: 1800</tspan></text>
<text x="92.4" y="322" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="92.4" dy="0">tdd: true</tspan></text>
<text x="45.6" y="348" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="45.6" dy="0">frontend: { gates: [ … ] }</tspan></text>
<text x="30.0" y="374" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">e2e: { cmd: "npx playwright test",</tspan></text>
<text x="84.6" y="400" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="84.6" dy="0">timeout: 1800 }</tspan></text>
<text x="30.0" y="426" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">ci: { provider: gitlab,</tspan></text>
<text x="76.8" y="452" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="76.8" dy="0">staging_job: deploy-staging }</tspan></text>
<text x="30.0" y="478" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">codex: { timeout: 900 }</tspan></text>
<text x="30.0" y="504" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">trace: { enabled: true, keep_runs: 20 }</tspan></text>
<text x="30.0" y="530" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#0f172a"><tspan x="30.0" dy="0">breakpoints: [ before_push ]</tspan></text>
<g data-info="Pflicht, nicht leer. Pro Lauf mit --base-branch überschreibbar; der wirksame Wert wird beim Start im Lauf-Zustand gepinnt."><path d="M436 57 L466 57 L480 45.0 L500 45.0" stroke="#0369a1" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="57" r="4" fill="#0369a1"/><rect x="500" y="16.0" width="464" height="58" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="732.0" y="39.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">base_branch · Pflicht</tspan></text><text x="732.0" y="59.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">Lanes forken davon, Diffs laufen dagegen</tspan></text></g>
<g data-info="Mindestens eine Lane mit mindestens einem Gate. Gates laufen der Reihe nach im Lane-Worktree; das erste rote Gate beendet den Durchgang. --parallel braucht beide Lanes."><path d="M436 109 L466 109 L480 117.85714285714286 L500 117.85714285714286" stroke="#0369a1" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="109" r="4" fill="#0369a1"/><rect x="500" y="88.85714285714286" width="464" height="58" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="732.0" y="104.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">lanes.&lt;lane&gt;.gates[] · Pflicht</tspan></text><text x="732.0" y="124.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">Lane-Namen: backend, frontend · Reihenfolge = fail fast</tspan><tspan x="732.0" dy="16">jedes Gate: name, cmd, timeout (Sekunden)</tspan></text></g>
<g data-info="Markiert Gates für die RED-Stufe. Nach dem Nur-Test-Lauf muss mindestens ein markiertes Gate rot sein — sonst eskaliert der Lauf."><path d="M436 317 L466 317 L480 190.71428571428572 L500 190.71428571428572" stroke="#15803d" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="317" r="4" fill="#15803d"/><rect x="500" y="161.71428571428572" width="464" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="732.0" y="185.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">tdd: true · optional (false)</tspan></text><text x="732.0" y="205.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">RED-Beweis: nach dem Nur-Test-Lauf rot</tspan></text></g>
<g data-info="Läuft auf dem Integrations-Branch, nachdem beide Lanes gemergt sind. In Single-Lane-Läufen ignoriert."><path d="M436 369 L466 369 L480 263.57142857142856 L500 263.57142857142856" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="369" r="4" fill="#475569"/><rect x="500" y="234.57142857142858" width="464" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="732.0" y="258.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">e2e · optional</tspan></text><text x="732.0" y="278.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">cmd + timeout; nur mit --parallel</tspan></text></g>
<g data-info="Bei self-hosted Forges provider setzen: Ein unbekannter Host fällt erst in Phase 7 auf, nach dem ganzen Build. staging_job muss zusätzlich grün sein."><path d="M436 421 L466 421 L480 336.42857142857144 L500 336.42857142857144" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="421" r="4" fill="#475569"/><rect x="500" y="307.42857142857144" width="464" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="732.0" y="323.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">ci · optional</tspan></text><text x="732.0" y="343.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">provider: automatisch · poll_interval 60 s</tspan><tspan x="732.0" dy="16">timeout 2700 s · staging_job: keiner</tspan></text></g>
<g data-info="Ein gemeinsames Zeitlimit für Codex-Entwürfe und Codex-Reviews."><path d="M436 473 L466 473 L480 409.28571428571433 L500 409.28571428571433" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="473" r="4" fill="#475569"/><rect x="500" y="380.28571428571433" width="464" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="732.0" y="404.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">codex · optional</tspan></text><text x="732.0" y="424.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">timeout 900 s je codex-exec-Aufruf</tspan></text></g>
<g data-info="enabled schreibt events.jsonl, das die GUI speist. keep_runs steuert das automatische Aufräumen nach einem erfolgreichen Lauf."><path d="M436 499 L466 499 L480 482.14285714285717 L500 482.14285714285717" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="499" r="4" fill="#475569"/><rect x="500" y="453.14285714285717" width="464" height="58" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="732.0" y="477.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">trace · optional</tspan></text><text x="732.0" y="497.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">enabled: true · keep_runs: 20 (0 = nie aufräumen)</tspan></text></g>
<g data-info="Zusatz-Halte vor teuren Schritten (Exit 2, weiter mit adw approve). Wirkungslos, wenn der Lauf mit --gates none oder spec läuft."><path d="M436 525 L466 525 L480 555.0 L500 555.0" stroke="#b45309" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><circle cx="436" cy="525" r="4" fill="#b45309"/><rect x="500" y="526.0" width="464" height="58" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="732.0" y="549.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">breakpoints · optional ([])</tspan></text><text x="732.0" y="569.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="732.0" dy="0">before_integration · before_push</tspan></text></g>
</svg>

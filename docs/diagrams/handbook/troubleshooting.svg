<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img">
<title>Troubleshooting by exit code</title>
<desc>Decision tree from the exit code of adw run / resume / approve to the next action.</desc>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<g data-step="1" data-info="run, resume and approve all end with exit 0, 2 or 1. The code tells you which branch of this tree applies."><rect x="330" y="16" width="320" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="39.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">The command returned</tspan></text><text x="490.0" y="61.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">echo $?</tspan></text></g>
<g data-step="2" data-info="The branch is pushed and the pipeline (plus staging job) is green."><path class="flow" d="M490.0 76 L490.0 104 L131.0 104 L131.0 118.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="131.0,128 136.5,118.0 125.5,118.0" fill="#475569"/><rect x="16" y="128" width="230" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="131.0" y="161.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">exit 0</tspan></text><text x="131.0" y="183.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">done</tspan></text></g>
<g data-step="3" data-info="Intended pause. resume would only pause again — use approve."><path class="flow" d="M490.0 76 L490.0 104 L381.0 104 L381.0 118.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="381.0,128 386.5,118.0 375.5,118.0" fill="#475569"/><rect x="266" y="128" width="230" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="381.0" y="161.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">exit 2</tspan></text><text x="381.0" y="183.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">paused at a gate or breakpoint</tspan></text></g>
<g data-step="4" data-info="Exit 1 means either a controlled escalation or an interruption. adw status shows the phase; escalation.md exists only for escalated runs."><path class="flow" d="M490.0 76 L490.0 104 L740.0 104 L740.0 118.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="740.0,128 745.5,118.0 734.5,118.0" fill="#475569"/><rect x="516" y="128" width="448" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="740.0" y="152.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="740.0" dy="0">exit 1</tspan></text><text x="740.0" y="174.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="740.0" dy="0">Is the run escalated?</tspan><tspan x="740.0" dy="18">(adw status → phase escalated)</tspan></text></g>
<g data-step="2" data-info="Review and merge as usual. Follow-ups are deliberately not built automatically."><path class="flow" d="M131.0 208 L131.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="131.0,252 136.5,242.0 125.5,242.0" fill="#475569"/><rect x="16" y="252" width="230" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="131.0" y="286.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">Open the MR/PR</tspan></text><text x="131.0" y="308.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">turn followups.md</tspan><tspan x="131.0" dy="18">into tickets</tspan></text></g>
<g data-step="3" data-info="The CLI names the files. There is no reject — abandon the run and start a new one if the direction is wrong."><path class="flow" d="M381.0 208 L381.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="381.0,252 386.5,242.0 375.5,242.0" fill="#475569"/><rect x="266" y="252" width="230" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="381.0" y="286.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">Read the summary</tspan></text><text x="381.0" y="308.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">spec-/plan-summary.md,</tspan><tspan x="381.0" dy="18">then adw approve &lt;id&gt;</tspan></text></g>
<g data-step="5" data-info="Escalated runs are deliberately not resumable. Typical causes: vague issue, contradicting gates, merge conflict, a limit or the circuit breaker."><path class="flow" d="M623.0 208 L623.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="623.0,252 628.5,242.0 617.5,242.0" fill="#475569"/><text x="631.0" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b91c1c"><tspan x="631.0" dy="0">yes</tspan></text><rect x="516" y="252" width="214" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="623.0" y="277.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">Escalated (final)</tspan></text><text x="623.0" y="299.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">read escalation.md,</tspan><tspan x="623.0" dy="18">fix the cause,</tspan><tspan x="623.0" dy="18">start a NEW run</tspan></text></g>
<g data-step="6" data-info="Without an escalation the run is unchanged at its checkpoint (or was never created)."><path class="flow" d="M857.0 208 L857.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="857.0,252 862.5,242.0 851.5,242.0" fill="#475569"/><text x="865.0" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#475569"><tspan x="865.0" dy="0">no</tspan></text><rect x="750" y="252" width="214" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="857.0" y="286.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">Read stderr</tspan></text><text x="857.0" y="308.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">the message names</tspan><tspan x="857.0" dy="18">the cause</tspan></text></g>
<g data-step="7" data-info="The plan window is exhausted or the Claude CLI failed. Nothing to fix on the run."><path class="flow" d="M857.0 352 L857.0 385 L389.0 385 L389.0 410.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="389.0,420 394.5,410.0 383.5,410.0" fill="#475569"/><rect x="282" y="420" width="214" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="389.0" y="455.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="389.0" dy="0">Plan limit / crash</tspan></text><text x="389.0" y="477.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="389.0" dy="0">"Agent-Lauf abgebrochen"</tspan><tspan x="389.0" dy="18">→ wait for the reset,</tspan><tspan x="389.0" dy="18">adw resume &lt;id&gt;</tspan></text></g>
<g data-step="8" data-info="ADW never discards your work. Clean up the listed paths, then continue."><path class="flow" d="M857.0 352 L857.0 385 L623.0 385 L623.0 410.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="623.0,420 628.5,410.0 617.5,410.0" fill="#475569"/><rect x="516" y="420" width="214" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="623.0" y="455.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">Preflight refused</tspan></text><text x="623.0" y="477.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">foreign changes in the</tspan><tspan x="623.0" dy="18">main checkout → commit</tspan><tspan x="623.0" dy="18">or stash, adw resume</tspan></text></g>
<g data-step="9" data-info="Missing or invalid config, two issue sources, contradicting gate flags: fail fast before any run exists."><path class="flow" d="M857.0 352 L857.0 385 L857.0 385 L857.0 410.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="857.0,420 862.5,410.0 851.5,410.0" fill="#475569"/><rect x="750" y="420" width="214" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="857.0" y="455.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">Config / flag error</tspan></text><text x="857.0" y="477.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">no run was created →</tspan><tspan x="857.0" dy="18">fix config.yaml or flags,</tspan><tspan x="857.0" dy="18">adw run again</tspan></text></g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img">
<title>Weg zum ersten Lauf</title>
<desc>Vier Schritte von einem frischen Rechner zum ersten echten ADW-Lauf.</desc>
<rect x="0" y="0" width="980" height="330" fill="#ffffff"/>
<g data-step="1" data-info="uv und git installieren, dann mit der Claude-Code-CLI und der Codex-CLI anmelden. glab oder gh holen Issues und pollen die CI. API-Keys werden ignoriert — der Verbrauch läuft über deinen Plan."><rect x="10" y="30" width="232" height="175" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="126.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="126.0" dy="0">1 · Voraussetzungen</tspan></text><text x="126.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="126.0" dy="0">uv + Python ≥ 3.12, git</tspan><tspan x="126.0" dy="18">Claude-Code-CLI, angemeldet</tspan><tspan x="126.0" dy="18">Codex-CLI, angemeldet</tspan><tspan x="126.0" dy="18">glab (GitLab) oder gh (GitHub)</tspan></text></g>
<g data-step="2" data-info="Eine Datei enthält alle projektspezifischen Einstellungen. examples/config.yaml kopieren, Base-Branch und mindestens eine Lane mit Gates setzen. Unbekannte Keys werden abgelehnt."><path class="flow" d="M242 117.5 L242.0 117.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="252,117.5 242.0,112.0 242.0,123.0" fill="#475569"/><rect x="252" y="30" width="232" height="175" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="368.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="368.0" dy="0">2 · Repo konfigurieren</tspan></text><text x="368.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="368.0" dy="0">&lt;ziel&gt;/.adw/config.yaml</tspan><tspan x="368.0" dy="18">base_branch + lanes</tspan><tspan x="368.0" dy="18">Gates je Lane (tdd: true)</tspan><tspan x="368.0" dy="18">Vorlage: examples/</tspan></text></g>
<g data-step="3" data-info="Fährt den kompletten Kontrollfluss mit geskripteten Mocks, inklusive eines absichtlich roten Gates. Läuft er durch, sind Config und Gates korrekt verdrahtet."><path class="flow" d="M484 117.5 L484.0 117.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="494,117.5 484.0,112.0 484.0,123.0" fill="#475569"/><rect x="494" y="30" width="232" height="175" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="610.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="610.0" dy="0">3 · Dry Run</tspan></text><text x="610.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="610.0" dy="0">--dry-run --gates none</tspan><tspan x="610.0" dy="18">Mock-Agenten, Fake-CI</tspan><tspan x="610.0" dy="18">0 Tokens, kein Push</tspan><tspan x="610.0" dy="18">beweist Config + Gates</tspan></text></g>
<g data-step="4" data-info="Verbraucht Plan-Kontingent. Standardmäßig stoppt der Lauf nach Plan + Kontrakt; plan-summary.md lesen und freigeben. Exit 0 heißt: Branch gepusht, Pipeline grün."><path class="flow" d="M726 117.5 L726.0 117.5" stroke="#475569" stroke-width="2" fill="none"/><polygon points="736,117.5 726.0,112.0 726.0,123.0" fill="#475569"/><rect x="736" y="30" width="232" height="175" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="852.0" y="84.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="852.0" dy="0">4 · Echter Lauf</tspan></text><text x="852.0" y="106.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="852.0" dy="0">adw run --issue "…"</tspan><tspan x="852.0" dy="18">pausiert nach dem Plan (Exit 2)</tspan><tspan x="852.0" dy="18">adw approve &lt;run_id&gt;</tspan><tspan x="852.0" dy="18">→ Branch gepusht, CI grün</tspan></text></g>
<g data-step="5" data-info="Jederzeit optional: eine Read-only-Webansicht von Läufen, Traces, Kosten und Eskalationen. Braucht außerhalb dieses Repos das Extra gui."><path d="M731.0 240 L731.0 215.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="731.0,205 725.5,215.0 736.5,215.0" fill="#475569"/><rect x="494" y="240" width="474" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><text x="731.0" y="268.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="731.0" dy="0">adw gui — Run Inspector</tspan></text><text x="731.0" y="290.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="731.0" dy="0">Read-only-Sicht auf jeden Lauf · http://127.0.0.1:8765/</tspan></text></g>
<text x="10" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#475569"><tspan x="10" dy="0">Jeder Schritt baut auf dem vorigen auf —</tspan><tspan x="10" dy="17">ein roter Dry Run kostet nichts.</tspan></text>
</svg>

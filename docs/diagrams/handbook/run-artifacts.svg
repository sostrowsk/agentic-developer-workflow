<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 445" width="980" height="445" role="img">
<title>Which run file to read when</title>
<desc>The files under .adw/runs/&lt;run_id&gt;/, grouped by the moment you need them.</desc>
<rect x="0" y="0" width="980" height="445" fill="#ffffff"/>
<g data-info="One directory per run, 8-hex run ID, gitignored. Readable only by you."><rect x="330" y="16" width="320" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="37.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">.adw/runs/&lt;run_id&gt;/</tspan></text><text x="490.0" y="59.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">gitignored · state + log are 0600</tspan></text></g>
<g data-step="1" data-info="When the run pauses at the spec or plan gate: read the summary first, then the artifact itself."><path d="M490.0 70 L490.0 95 L166.0 95 L166.0 110.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="166.0,120 171.5,110.0 160.5,110.0" fill="#475569"/><rect x="16" y="120" width="300" height="38" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="166.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">At a gate (exit 2)</tspan></text></g>
<g data-step="1" data-info="The synthesis summary — the first thing to read at a gate."><rect x="16" y="172" width="300" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="166.0" y="195.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">spec-summary.md / plan-summary.md</tspan></text><text x="166.0" y="215.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">what + why, decisions, deferred items,</tspan><tspan x="166.0" dy="16">where the two drafts disagreed</tspan></text></g>
<g data-step="1" data-info="The archived, reviewed spec and plan. The plan lists workstreams and tasks."><rect x="16" y="256" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="166.0" y="279.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">spec.md · plan.md</tspan></text><text x="166.0" y="299.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">the reviewed artifact</tspan></text></g>
<g data-step="1" data-info="The agreed interface contract. Both lanes build against it in parallel mode."><rect x="16" y="323" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="166.0" y="346.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">contract.yaml</tspan></text><text x="166.0" y="366.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">interface both lanes build against</tspan></text></g>
<g data-step="2" data-info="When the run has ended: follow-ups after a success, the report after an escalation."><path d="M490.0 70 L490.0 95 L490.0 95 L490.0 110.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="490.0,120 495.5,110.0 484.5,110.0" fill="#475569"/><rect x="340" y="120" width="300" height="38" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="490.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">After the run</tspan></text></g>
<g data-step="2" data-info="Deduplicated follow-up issues. No automatic restart; the run continues normally."><rect x="340" y="172" width="300" height="74" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="195.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">followups.md</tspan></text><text x="490.0" y="215.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">scope gaps, findings below the</tspan><tspan x="490.0" dy="16">review threshold — make tickets</tspan></text></g>
<g data-step="2" data-info="The handover report: phase reached, gate output, conflict, limit or circuit breaker."><rect x="340" y="256" width="300" height="74" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="279.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">escalation.md</tspan></text><text x="490.0" y="299.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">only after exit 1 (escalated):</tspan><tspan x="490.0" dy="16">phase + concrete reason</tspan></text></g>
<g data-step="3" data-info="For debugging and traceability. Read these, never edit them."><path d="M490.0 70 L490.0 95 L814.0 95 L814.0 110.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="814.0,120 819.5,110.0 808.5,110.0" fill="#475569"/><rect x="664" y="120" width="300" height="38" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="814.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">Digging deeper</tspan></text></g>
<g data-step="3" data-info="Spans, agent messages, tool calls, gate outputs, findings. Raw and unredacted."><rect x="664" y="172" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="195.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">events.jsonl(.gz)</tspan></text><text x="814.0" y="215.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">full event log — via adw gui or jq</tspan></text></g>
<g data-step="3" data-info="The two independent drafts behind each synthesis; .codex.FAILED if Codex could not deliver."><rect x="664" y="239" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="262.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">drafts/</tspan></text><text x="814.0" y="282.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">Claude + Codex draft per artifact</tspan></text></g>
<g data-step="3" data-info="Phase, lanes, counters, pinned settings. The basis for adw resume."><rect x="664" y="306" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="329.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">state.json</tspan></text><text x="814.0" y="349.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">checkpointed run state — never edit</tspan></text></g>
<g data-step="3" data-info="The issue exactly as the run got it, and the git worktrees the lanes built in."><rect x="664" y="373" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="396.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">issue.md · trees/&lt;lane&gt;</tspan></text><text x="814.0" y="416.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">input as received · lane worktrees</tspan></text></g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img">
<title>Run Inspector: die Lauf-Detailseite</title>
<desc>Schematisches Layout von /runs/&lt;repo&gt;/&lt;run_id&gt; in adw gui.</desc>
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<rect x="10" y="10" width="960" height="520" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="30" y="34" font-family="Liberation Mono, Courier New, monospace" font-size="13" text-anchor="start" fill="#475569"><tspan x="30" dy="0">http://127.0.0.1:8765/runs/&lt;repo&gt;/&lt;run_id&gt;</tspan></text>
<g data-step="1" data-info="Wo der Lauf steht und wohin die Zeit ging. Ein Dry Run trägt ein fixes Dry-Run-Banner."><rect x="30" y="48" width="920" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="490.0" y="74.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Kopf</tspan></text><text x="490.0" y="94.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Status · maßstäbliches Phasenband (Klick springt zur Phase) · Arbeitszeit · Kosten + Tokens</tspan></text></g>
<g data-step="2" data-info="Nennt den einen nächsten Schritt für einen pausierten, unterbrochenen oder eskalierten Lauf, inklusive Eskalationsbericht."><rect x="30" y="122" width="920" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="490.0" y="140.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Recovery-Karte</tspan></text><text x="490.0" y="160.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">nur wenn der Lauf dich braucht: der nächste Befehl, z. B. adw approve &lt;id&gt; --repo &lt;pfad&gt;</tspan></text></g>
<g data-step="3" data-info="Trace ist Standard. Timeline zeigt Swimlanes, Artifacts Issue, Spec, Plan, Entwürfe und Berichte, Raw das filterbare Event-Log."><rect x="30" y="180" width="920" height="36" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="200.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Tabs: Trace · Timeline · Artifacts · Raw</tspan></text></g>
<g data-step="4" data-info="Der Span-Baum des Laufs; Tool-Rauschen ist gefaltet. Tastatur: Pfeile bewegen und falten, Enter oder Leertaste wählt aus."><rect x="30" y="226" width="270" height="220" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="165.0" y="314.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="165.0" dy="0">Trace-Baum</tspan></text><text x="165.0" y="334.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="165.0" dy="0">Phasen, Lanes, Runden,</tspan><tspan x="165.0" dy="16">Agent-Läufe, Gates, Reviews</tspan><tspan x="165.0" dy="16">↑ ↓ ← → Enter · ein Tab-Stopp</tspan></text></g>
<g data-step="5" data-info="Zeigt den gewählten Knoten. Diff ist der Schritt-Diff aus den Snapshot-Refs."><rect x="312" y="226" width="410" height="220" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="517.0" y="314.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="517.0" dy="0">Detailbereich</tspan></text><text x="517.0" y="334.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="517.0" dy="0">Agent-Lauf: Prompt · Answer · Tools · Diff</tspan><tspan x="517.0" dy="16">Payloads als Feldliste,</tspan><tspan x="517.0" dy="16">Issue / Prompts / Antworten als Markdown</tspan></text></g>
<g data-step="6" data-info="Zeitreise: der Lauf-Zustand zum gewählten Zeitpunkt, nicht nur am Ende."><rect x="734" y="226" width="216" height="220" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="842.0" y="306.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="842.0" dy="0">Lauf-Kontext</tspan></text><text x="842.0" y="326.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="842.0" dy="0">am gewählten Knoten:</tspan><tspan x="842.0" dy="16">Phase, Runde n/Cap,</tspan><tspan x="842.0" dy="16">Limit-Treffer, Breaker,</tspan><tspan x="842.0" dy="16">Kosten, Follow-ups</tspan></text></g>
<g data-step="7" data-info="Bei Bedarf aufklappen: Was noch geplant ist und was tatsächlich angefasst wurde."><rect x="30" y="456" width="920" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><text x="490.0" y="480.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Plan-Skelett · Änderungsumfang (beide eingeklappt)</tspan></text><text x="490.0" y="500.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Tasks aus plan.md je Lane · geänderte Dateien je Lane neben dem Kontrakt-Scope</tspan></text></g>
</svg>

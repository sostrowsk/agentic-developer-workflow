<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img">
<title>Fehlersuche nach Exit-Code</title>
<desc>Entscheidungsbaum vom Exit-Code von adw run / resume / approve zur nächsten Aktion.</desc>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<g data-step="1" data-info="run, resume und approve enden alle mit Exit 0, 2 oder 1. Der Code sagt, welcher Zweig dieses Baums gilt."><rect x="330" y="16" width="320" height="60" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="39.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Das Kommando endete mit</tspan></text><text x="490.0" y="61.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">echo $?</tspan></text></g>
<g data-step="2" data-info="Der Branch ist gepusht, die Pipeline (plus Staging-Job) grün."><path class="flow" d="M490.0 76 L490.0 104 L131.0 104 L131.0 118.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="131.0,128 136.5,118.0 125.5,118.0" fill="#475569"/><rect x="16" y="128" width="230" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="131.0" y="161.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">Exit 0</tspan></text><text x="131.0" y="183.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">fertig</tspan></text></g>
<g data-step="3" data-info="Gewollte Pause. resume würde nur erneut pausieren — approve verwenden."><path class="flow" d="M490.0 76 L490.0 104 L381.0 104 L381.0 118.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="381.0,128 386.5,118.0 375.5,118.0" fill="#475569"/><rect x="266" y="128" width="230" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="381.0" y="161.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">Exit 2</tspan></text><text x="381.0" y="183.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">pausiert an Gate oder Haltepunkt</tspan></text></g>
<g data-step="4" data-info="Exit 1 heißt entweder kontrollierte Eskalation oder Unterbrechung. adw status zeigt die Phase; escalation.md gibt es nur bei eskalierten Läufen."><path class="flow" d="M490.0 76 L490.0 104 L740.0 104 L740.0 118.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="740.0,128 745.5,118.0 734.5,118.0" fill="#475569"/><rect x="516" y="128" width="448" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="740.0" y="152.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="740.0" dy="0">Exit 1</tspan></text><text x="740.0" y="174.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="740.0" dy="0">Ist der Lauf eskaliert?</tspan><tspan x="740.0" dy="18">(adw status → Phase escalated)</tspan></text></g>
<g data-step="2" data-info="Wie gewohnt reviewen und mergen. Follow-ups werden bewusst nicht automatisch gebaut."><path class="flow" d="M131.0 208 L131.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="131.0,252 136.5,242.0 125.5,242.0" fill="#475569"/><rect x="16" y="252" width="230" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="131.0" y="286.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">MR/PR öffnen</tspan></text><text x="131.0" y="308.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="131.0" dy="0">followups.md in</tspan><tspan x="131.0" dy="18">Tickets verwandeln</tspan></text></g>
<g data-step="3" data-info="Die CLI nennt die Dateien. Ablehnen gibt es nicht — bei falscher Richtung den Lauf liegen lassen und neu starten."><path class="flow" d="M381.0 208 L381.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="381.0,252 386.5,242.0 375.5,242.0" fill="#475569"/><rect x="266" y="252" width="230" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="381.0" y="286.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">Zusammenfassung lesen</tspan></text><text x="381.0" y="308.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="381.0" dy="0">spec-/plan-summary.md,</tspan><tspan x="381.0" dy="18">dann adw approve &lt;id&gt;</tspan></text></g>
<g data-step="5" data-info="Eskalierte Läufe sind bewusst nicht fortsetzbar. Typische Ursachen: vages Issue, widersprüchliche Gates, Merge-Konflikt, ein Limit oder der Circuit Breaker."><path class="flow" d="M623.0 208 L623.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="623.0,252 628.5,242.0 617.5,242.0" fill="#475569"/><text x="631.0" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b91c1c"><tspan x="631.0" dy="0">ja</tspan></text><rect x="516" y="252" width="214" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="623.0" y="277.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">Eskaliert (final)</tspan></text><text x="623.0" y="299.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">escalation.md lesen,</tspan><tspan x="623.0" dy="18">Ursache beheben,</tspan><tspan x="623.0" dy="18">NEUEN Lauf starten</tspan></text></g>
<g data-step="6" data-info="Ohne Eskalation steht der Lauf unverändert am Checkpoint (oder wurde nie angelegt)."><path class="flow" d="M857.0 208 L857.0 242.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="857.0,252 862.5,242.0 851.5,242.0" fill="#475569"/><text x="865.0" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#475569"><tspan x="865.0" dy="0">nein</tspan></text><rect x="750" y="252" width="214" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="857.0" y="286.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">stderr lesen</tspan></text><text x="857.0" y="308.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">die Meldung nennt</tspan><tspan x="857.0" dy="18">die Ursache</tspan></text></g>
<g data-step="7" data-info="Das Plan-Fenster ist erschöpft oder die Claude-CLI ist ausgefallen. Am Lauf ist nichts zu reparieren."><path class="flow" d="M857.0 352 L857.0 385 L389.0 385 L389.0 410.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="389.0,420 394.5,410.0 383.5,410.0" fill="#475569"/><rect x="282" y="420" width="214" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="389.0" y="455.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="389.0" dy="0">Plan-Limit / Absturz</tspan></text><text x="389.0" y="477.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="389.0" dy="0">„Agent-Lauf abgebrochen“</tspan><tspan x="389.0" dy="18">→ Reset abwarten,</tspan><tspan x="389.0" dy="18">adw resume &lt;id&gt;</tspan></text></g>
<g data-step="8" data-info="ADW verwirft nie deine Arbeit. Die gelisteten Pfade aufräumen, dann fortsetzen."><path class="flow" d="M857.0 352 L857.0 385 L623.0 385 L623.0 410.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="623.0,420 628.5,410.0 617.5,410.0" fill="#475569"/><rect x="516" y="420" width="214" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="623.0" y="455.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">Vorflug abgelehnt</tspan></text><text x="623.0" y="477.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="623.0" dy="0">fremde Änderungen im</tspan><tspan x="623.0" dy="18">Haupt-Checkout → committen</tspan><tspan x="623.0" dy="18">oder stashen, adw resume</tspan></text></g>
<g data-step="9" data-info="Fehlende oder ungültige Config, zwei Issue-Quellen, widersprüchliche Gate-Flags: fail fast, bevor ein Lauf existiert."><path class="flow" d="M857.0 352 L857.0 385 L857.0 385 L857.0 410.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="857.0,420 862.5,410.0 851.5,410.0" fill="#475569"/><rect x="750" y="420" width="214" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="857.0" y="455.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">Config-/Flag-Fehler</tspan></text><text x="857.0" y="477.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="857.0" dy="0">kein Lauf angelegt →</tspan><tspan x="857.0" dy="18">config.yaml oder Flags</tspan><tspan x="857.0" dy="18">korrigieren, adw run</tspan></text></g>
</svg>

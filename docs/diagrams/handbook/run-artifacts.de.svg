<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 445" width="980" height="445" role="img">
<title>Welche Lauf-Datei wann lesen</title>
<desc>Die Dateien unter .adw/runs/&lt;run_id&gt;/, gruppiert nach dem Moment, in dem du sie brauchst.</desc>
<rect x="0" y="0" width="980" height="445" fill="#ffffff"/>
<g data-info="Ein Verzeichnis pro Lauf, 8-stellige Hex-ID, gitignored. Nur für dich lesbar."><rect x="330" y="16" width="320" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="37.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">.adw/runs/&lt;run_id&gt;/</tspan></text><text x="490.0" y="59.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">gitignored · State + Log sind 0600</tspan></text></g>
<g data-step="1" data-info="Wenn der Lauf am Spec- oder Plan-Gate pausiert: zuerst die Zusammenfassung, dann das Artefakt selbst."><path d="M490.0 70 L490.0 95 L166.0 95 L166.0 110.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="166.0,120 171.5,110.0 160.5,110.0" fill="#475569"/><rect x="16" y="120" width="300" height="38" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="166.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">Am Gate (Exit 2)</tspan></text></g>
<g data-step="1" data-info="Die Synthese-Zusammenfassung — das Erste, was man am Gate liest."><rect x="16" y="172" width="300" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="166.0" y="195.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">spec-summary.md / plan-summary.md</tspan></text><text x="166.0" y="215.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">Was + Warum, Entscheidungen, Zurück-</tspan><tspan x="166.0" dy="16">gestelltes, Dissens der Entwürfe</tspan></text></g>
<g data-step="1" data-info="Die archivierte, reviewte Spec und der Plan. Der Plan listet Workstreams und Tasks."><rect x="16" y="256" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="166.0" y="279.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">spec.md · plan.md</tspan></text><text x="166.0" y="299.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">das reviewte Artefakt</tspan></text></g>
<g data-step="1" data-info="Der vereinbarte Schnittstellen-Kontrakt. Im Parallel-Modus bauen beide Lanes dagegen."><rect x="16" y="323" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="166.0" y="346.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">contract.yaml</tspan></text><text x="166.0" y="366.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="166.0" dy="0">Schnittstelle für beide Lanes</tspan></text></g>
<g data-step="2" data-info="Wenn der Lauf zu Ende ist: Follow-ups nach Erfolg, der Bericht nach einer Eskalation."><path d="M490.0 70 L490.0 95 L490.0 95 L490.0 110.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="490.0,120 495.5,110.0 484.5,110.0" fill="#475569"/><rect x="340" y="120" width="300" height="38" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="490.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Nach dem Lauf</tspan></text></g>
<g data-step="2" data-info="Deduplizierte Follow-up-Issues. Kein automatischer Neustart; der Lauf geht normal weiter."><rect x="340" y="172" width="300" height="74" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="195.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">followups.md</tspan></text><text x="490.0" y="215.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">Scope-Lücken, Findings unter der</tspan><tspan x="490.0" dy="16">Review-Schwelle — Tickets machen</tspan></text></g>
<g data-step="2" data-info="Der Übergabebericht: erreichte Phase, Gate-Output, Konflikt, Limit oder Circuit Breaker."><rect x="340" y="256" width="300" height="74" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="490.0" y="279.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">escalation.md</tspan></text><text x="490.0" y="299.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="490.0" dy="0">nur nach Exit 1 (eskaliert):</tspan><tspan x="490.0" dy="16">Phase + konkreter Grund</tspan></text></g>
<g data-step="3" data-info="Für Debugging und Nachvollziehbarkeit. Lesen, nie bearbeiten."><path d="M490.0 70 L490.0 95 L814.0 95 L814.0 110.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="814.0,120 819.5,110.0 808.5,110.0" fill="#475569"/><rect x="664" y="120" width="300" height="38" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="814.0" y="145" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">Tiefer graben</tspan></text></g>
<g data-step="3" data-info="Spans, Agent-Nachrichten, Tool-Aufrufe, Gate-Ausgaben, Findings. Roh und ungeschwärzt."><rect x="664" y="172" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="195.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">events.jsonl(.gz)</tspan></text><text x="814.0" y="215.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">volles Event-Log — via adw gui oder jq</tspan></text></g>
<g data-step="3" data-info="Die zwei unabhängigen Entwürfe hinter jeder Synthese; .codex.FAILED, wenn Codex nicht liefern konnte."><rect x="664" y="239" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="262.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">drafts/</tspan></text><text x="814.0" y="282.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">Claude- + Codex-Entwurf je Artefakt</tspan></text></g>
<g data-step="3" data-info="Phase, Lanes, Zähler, gepinnte Einstellungen. Grundlage für adw resume."><rect x="664" y="306" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="329.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">state.json</tspan></text><text x="814.0" y="349.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">gesicherter Lauf-Zustand — nie editieren</tspan></text></g>
<g data-step="3" data-info="Das Issue genau so, wie der Lauf es bekam, und die Git-Worktrees der Lanes."><rect x="664" y="373" width="300" height="57" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="814.0" y="396.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">issue.md · trees/&lt;lane&gt;</tspan></text><text x="814.0" y="416.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a"><tspan x="814.0" dy="0">Eingabe wie erhalten · Lane-Worktrees</tspan></text></g>
</svg>

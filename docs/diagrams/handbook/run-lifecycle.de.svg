<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img">
<title>Ein Lauf aus deiner Sicht</title>
<desc>Von adw run bis zu den drei möglichen Enden, mit Exit-Codes und nächstem Schritt.</desc>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
<g data-step="1" data-info="Du startest einen Lauf mit genau einer Issue-Quelle. Zuerst werden die Flags geprüft; ein Fehler hier legt gar keinen Lauf an."><rect x="12" y="30" width="172" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="98.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="98.0" dy="0">adw run</tspan></text><text x="98.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="98.0" dy="0">genau eine Issue-Quelle</tspan><tspan x="98.0" dy="18">--gates, --parallel</tspan></text></g>
<g data-step="2" data-info="ADW lädt .adw/config.yaml (fail fast), prüft, ob die Forge bekannt ist (echte Läufe), und prüft den Haupt-Checkout. Liegengebliebene ADW-Artefakte werden automatisch aus HEAD wiederhergestellt."><path class="flow" d="M184 80.0 L196.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="206,80.0 196.0,74.5 196.0,85.5" fill="#475569"/><rect x="206" y="30" width="172" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="292.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">Vorflug</tspan></text><text x="292.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">Config + Forge ok?</tspan><tspan x="292.0" dy="18">Haupt-Checkout sauber?</tspan></text></g>
<g data-step="3" data-info="Zwei unabhängige Entwürfe (Claude + Codex) je Artefakt, von Fable 5.1 zu einer Spec, einem Plan und einem Schnittstellen-Kontrakt zusammengeführt."><path class="flow" d="M378 80.0 L390.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="400,80.0 390.0,74.5 390.0,85.5" fill="#475569"/><rect x="400" y="30" width="172" height="100" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="486.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="486.0" dy="0">Phasen 1–2</tspan></text><text x="486.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="486.0" dy="0">Spec, Plan + Kontrakt</tspan><tspan x="486.0" dy="18">zwei Entwürfe → Synthese</tspan></text></g>
<g data-step="4" data-info="Standard --gates plan: Der Lauf stoppt vor dem teuren Build. plan-summary.md, plan.md und contract.yaml lesen."><path class="flow" d="M572 80.0 L584.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="594,80.0 584.0,74.5 584.0,85.5" fill="#475569"/><rect x="594" y="30" width="172" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="680.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="680.0" dy="0">Plan-Gate</tspan></text><text x="680.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="680.0" dy="0">Exit 2 · pausiert</tspan><tspan x="680.0" dy="18">plan-summary.md lesen</tspan></text></g>
<g data-step="5" data-info="Erteilt die ausstehende Freigabe und läuft sofort weiter. Ein Ablehnen gibt es nicht: Ist der Plan falsch, einen neuen Lauf mit schärferem Issue starten."><path class="flow" d="M766 80.0 L778.0 80.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="788,80.0 778.0,74.5 778.0,85.5" fill="#475569"/><rect x="788" y="30" width="172" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="874.0" y="64.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="874.0" dy="0">adw approve &lt;id&gt;</tspan></text><text x="874.0" y="86.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="874.0" dy="0">setzt im selben</tspan><tspan x="874.0" dy="18">Prozess fort</tspan></text></g>
<g data-step="2" data-info="Der Vorflug verwirft nie deine Arbeit. Er listet die schmutzigen Pfade und stoppt; der Lauf bleibt unverändert und fortsetzbar."><path d="M292.0 130 L292.0 180.0" stroke="#b91c1c" stroke-width="2" fill="none"/><polygon points="292.0,190 297.5,180.0 286.5,180.0" fill="#b91c1c"/><rect x="206" y="190" width="172" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="292.0" y="220.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">Abgelehnt · Exit 1</tspan></text><text x="292.0" y="242.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="292.0" dy="0">fremde Änderungen im</tspan><tspan x="292.0" dy="18">Haupt-Checkout →</tspan><tspan x="292.0" dy="18">committen/stashen</tspan></text></g>
<g data-step="6" data-info="Build-Agenten arbeiten in Lane-Worktrees, Gates entscheiden, Reviewer melden nur. Optionale Haltepunkte können erneut pausieren (Exit 2)."><path class="flow" d="M874.0 130 L874.0 180.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="874.0,190 879.5,180.0 868.5,180.0" fill="#475569"/><rect x="594" y="190" width="346" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="767.0" y="229.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="767.0" dy="0">Phasen 3–7</tspan></text><text x="767.0" y="251.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="767.0" dy="0">Build (Lanes, RED-Stufe) · Integration/E2E</tspan><tspan x="767.0" dy="18">Codex-Review · finaler Review · Push + CI</tspan></text></g>
<g data-step="7" data-info="Erfolg: Der Feature-Branch ist gepusht, die CI grün. followups.md listet Scope-Lücken und zurückgestellte Findings — daraus Tickets machen."><path class="flow" d="M767.0 300 L767.0 345 L332.0 345 L332.0 370.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="332.0,380 337.5,370.0 326.5,370.0" fill="#475569"/><rect x="214" y="380" width="236" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="332.0" y="421.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="332.0" dy="0">Exit 0 · fertig</tspan></text><text x="332.0" y="443.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="332.0" dy="0">Branch gepusht,</tspan><tspan x="332.0" dy="18">Pipeline (+ Staging) grün</tspan><tspan x="332.0" dy="18">→ MR/PR öffnen,</tspan><tspan x="332.0" dy="18">followups.md lesen</tspan></text></g>
<g data-step="8" data-info="Bewusst endgültig: Eskalierte Läufe sind nicht fortsetzbar. escalation.md nennt Phase und konkreten Grund (Gate-Output, Konflikt, Limit, Circuit Breaker)."><path class="flow" d="M767.0 300 L767.0 345 L580.0 345 L580.0 370.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="580.0,380 585.5,370.0 574.5,370.0" fill="#475569"/><rect x="462" y="380" width="236" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="580.0" y="421.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="580.0" dy="0">Exit 1 · eskaliert</tspan></text><text x="580.0" y="443.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="580.0" dy="0">Limit oder harter Fehler</tspan><tspan x="580.0" dy="18">→ escalation.md lesen,</tspan><tspan x="580.0" dy="18">Ursache beheben,</tspan><tspan x="580.0" dy="18">NEUEN Lauf starten</tspan></text></g>
<g data-step="9" data-info="Keine Eskalation: Der Lauf bleibt am letzten Checkpoint. Fertige Lanes werden nicht neu gebaut, Limits nicht zurückgesetzt."><path class="flow" d="M767.0 300 L767.0 345 L828.0 345 L828.0 370.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="828.0,380 833.5,370.0 822.5,370.0" fill="#475569"/><rect x="710" y="380" width="236" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="828.0" y="421.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="828.0" dy="0">Exit 1 · unterbrochen</tspan></text><text x="828.0" y="443.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="828.0" dy="0">Plan-Limit, Absturz, Ctrl-C</tspan><tspan x="828.0" dy="18">→ Zustand gesichert</tspan><tspan x="828.0" dy="18">→ adw resume &lt;id&gt;</tspan><tspan x="828.0" dy="18">nach dem Reset</tspan></text></g>
<g data-step="9" data-info="adw resume setzt exakt dort fort, wo der Lauf stand — gleiche Phase, gleiche Agent-Session für einen offenen Fix."><path d="M946 455 L968 455 L968 245 L950.0 245.0" stroke="#b45309" stroke-width="2" fill="none"/><polygon points="940,245 950.0,250.5 950.0,239.5" fill="#b45309"/><text x="960" y="326" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#b45309"><tspan x="960" dy="0">adw resume</tspan></text></g>
<text x="12" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#475569"><tspan x="12" dy="0">Exit-Codes</tspan><tspan x="12" dy="20">0 = fertig</tspan><tspan x="12" dy="20">2 = pausiert (Gate/Haltepunkt)</tspan><tspan x="12" dy="20">1 = Eskalation oder Fehler</tspan></text>
</svg>

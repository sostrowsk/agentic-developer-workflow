<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 985 470" width="985" height="470" role="img">
<title>Where each --gates mode pauses</title>
<desc>The four approval-gate modes and the two optional breakpoints along the seven phases.</desc>
<rect x="0" y="0" width="985" height="470" fill="#ffffff"/>
<rect x="160" y="20" width="108" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="214.0" y="50.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="214.0" dy="0">Spec</tspan></text>
<rect x="278" y="20" width="108" height="56" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="332.0" y="41.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="332.0" dy="0">Plan +</tspan></text><text x="332.0" y="60.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="332.0" dy="0">Contract</tspan></text>
<rect x="396" y="20" width="108" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="450.0" y="50.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="450.0" dy="0">Build</tspan></text>
<rect x="514" y="20" width="108" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="568.0" y="41.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="568.0" dy="0">Integration</tspan></text><text x="568.0" y="60.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="568.0" dy="0">/ E2E</tspan></text>
<rect x="632" y="20" width="108" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="686.0" y="41.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="686.0" dy="0">Codex</tspan></text><text x="686.0" y="60.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="686.0" dy="0">review</tspan></text>
<rect x="750" y="20" width="108" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="804.0" y="41.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="804.0" dy="0">Final</tspan></text><text x="804.0" y="60.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a"><tspan x="804.0" dy="0">review</tspan></text>
<rect x="868" y="20" width="108" height="56" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="922.0" y="50.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a"><tspan x="922.0" dy="0">Push / CI</tspan></text>
<text x="12" y="52" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan x="12" dy="0">Mode</tspan></text>
<g data-step="1" data-info="Default. Pauses after plan + contract, before the build — the cheapest point to correct direction. Legacy: no flag."><text x="12" y="116" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan x="12" dy="0">plan</tspan></text><text x="12" y="134" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#475569"><tspan x="12" dy="0">(default)</tspan></text><path class="flow" d="M160 120 L966.0 120.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="976,120 966.0,114.5 966.0,125.5" fill="#475569"/><rect x="378.0" y="107.0" width="26" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="384.8" y="113.5" width="4.4" height="13.0" fill="#b45309"/><rect x="392.8" y="113.5" width="4.4" height="13.0" fill="#b45309"/></g>
<g data-step="2" data-info="Pauses after the spec, before the plan. Legacy: --no-approval --spec-approval. Breakpoints do not hold in this mode."><text x="12" y="178" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan x="12" dy="0">spec</tspan></text><text x="12" y="196" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#475569"><tspan x="12" dy="0">--no-approval</tspan><tspan x="12" dy="16">--spec-approval</tspan></text><path class="flow" d="M160 182 L966.0 182.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="976,182 966.0,176.5 966.0,187.5" fill="#475569"/><rect x="260.0" y="169.0" width="26" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="266.8" y="175.5" width="4.4" height="13.0" fill="#b45309"/><rect x="274.8" y="175.5" width="4.4" height="13.0" fill="#b45309"/></g>
<g data-step="3" data-info="Pauses after the spec and again after the plan. Legacy: --spec-approval."><text x="12" y="240" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan x="12" dy="0">both</tspan></text><text x="12" y="258" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#475569"><tspan x="12" dy="0">--spec-approval</tspan></text><path class="flow" d="M160 244 L966.0 244.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="976,244 966.0,238.5 966.0,249.5" fill="#475569"/><rect x="260.0" y="231.0" width="26" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="266.8" y="237.5" width="4.4" height="13.0" fill="#b45309"/><rect x="274.8" y="237.5" width="4.4" height="13.0" fill="#b45309"/><rect x="378.0" y="231.0" width="26" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="384.8" y="237.5" width="4.4" height="13.0" fill="#b45309"/><rect x="392.8" y="237.5" width="4.4" height="13.0" fill="#b45309"/></g>
<g data-step="4" data-info="Never pauses; only an escalation stops the run. Legacy: --no-approval. Breakpoints are skipped too."><text x="12" y="302" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan x="12" dy="0">none</tspan></text><text x="12" y="320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#475569"><tspan x="12" dy="0">--no-approval</tspan></text><path class="flow" d="M160 306 L966.0 306.0" stroke="#475569" stroke-width="2" fill="none"/><polygon points="976,306 966.0,300.5 966.0,311.5" fill="#475569"/><text x="568.0" y="296" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#475569"><tspan x="568.0" dy="0">no stop — only an escalation ends the run early</tspan></text></g>
<g data-step="5" data-info="Optional extra holds from .adw/config.yaml. before_integration: all lanes green, before integration (parallel) or the Codex review (single-lane). before_push: after the final review. They hold only in modes plan and both."><text x="12" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a"><tspan x="12" dy="0">breakpoints</tspan></text><text x="12" y="396" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#475569"><tspan x="12" dy="0">config · plan/both only</tspan></text><path d="M160 382 L966.0 382.0" stroke="#94a3b8" stroke-width="2" fill="none"/><polygon points="976,382 966.0,376.5 966.0,387.5" fill="#94a3b8"/><rect x="496.0" y="369.0" width="26" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="502.8" y="375.5" width="4.4" height="13.0" fill="#b45309"/><rect x="510.8" y="375.5" width="4.4" height="13.0" fill="#b45309"/><text x="509.0" y="416" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#b45309"><tspan x="509.0" dy="0">before_integration</tspan></text><rect x="850.0" y="369.0" width="26" height="26" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="856.8" y="375.5" width="4.4" height="13.0" fill="#b45309"/><rect x="864.8" y="375.5" width="4.4" height="13.0" fill="#b45309"/><text x="863.0" y="416" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#b45309"><tspan x="863.0" dy="0">before_push</tspan></text></g>
<rect x="13.0" y="425.0" width="22" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><rect x="18.8" y="430.5" width="3.7" height="11.0" fill="#b45309"/><rect x="25.5" y="430.5" width="3.7" height="11.0" fill="#b45309"/>
<text x="44" y="441" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#475569"><tspan x="44" dy="0">= pause, exit 2 · continue with adw approve &lt;run_id&gt;</tspan></text>
</svg>

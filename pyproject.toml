[project]
name = "adw"
version = "0.20.0"
description = "Agentic Developer Workflow — 7-Phasen-Orchestrator: Claude Agent SDK + Codex + deterministische Gates"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    # >=0.2.118: braucht tools/setting_sources/strict_mcp_config/sandbox
    "claude-agent-sdk>=0.2.118",
    "anyio>=4",
]

[project.optional-dependencies]
# The read-only web GUI (`adw gui`). Kept OUT of the core dependencies (E7): a
# plain `adw run` install stays free of the web stack — no import error, no
# missing dependency.
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3",
    # Renders the Markdown payload fields of the detail pane (issue, prompt,
    # answer). Already in the tree transitively via typer -> rich, but a direct
    # dependency is declared rather than relied upon.
    "markdown-it-py>=3",
]

[project.scripts]
adw = "adw.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # The optional `gui` extra's stack, so `uv run pytest` can exercise the web
    # app (FastAPI TestClient needs httpx). These are dev/test-only: the
    # distributed core package still declares no web dependency (E7), and the
    # core import path never imports them (test_gui_cli guards this).
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3",
    "markdown-it-py>=3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

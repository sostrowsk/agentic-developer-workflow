[project]
name = "adw"
version = "0.31.1"
description = "Agentic Developer Workflow — 7-Phasen-Orchestrator: Claude Agent SDK + Codex + deterministische Gates"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    # >=0.2.165: gebündelte Claude-Code-CLI >= 2.1.280 — ältere lehnen Opus 5.5 /
    # Fable 5.1 / Sonnet 5.5 ab (tests/test_agents.py prüft die gebündelte Version)
    "claude-agent-sdk>=0.2.165",
    "anyio>=4",
]

[project.optional-dependencies]
# The read-only web GUI (`adw gui`). Kept OUT of the core dependencies (E7): a
# plain `adw run` install stays free of the web stack — no import error, no
# missing dependency.
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3",
    # Renders the Markdown payload fields of the detail pane (issue, prompt,
    # answer). Already in the tree transitively via typer -> rich, but a direct
    # dependency is declared rather than relied upon.
    "markdown-it-py>=3",
]

[project.scripts]
adw = "adw.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # The optional `gui` extra (self-reference, so the two lists cannot drift) plus
    # httpx for FastAPI's TestClient, so `uv run pytest` can exercise the web app.
    # Dev/test-only: the distributed core package still declares no web dependency
    # (E7), and the core import path never imports it (test_gui_cli guards this).
    "adw[gui]",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adw"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
